    // ── PROCESAMIENTO INTELIGENTE DE ARCHIVOS (COMPRESIÓN DE FOTOS Y COMPATIBILIDAD CON PDF) ──
    const procesarArchivo = (file) => new Promise((resolve, reject) => {
        if (!file) return reject(new Error("No se seleccionó ningún archivo"));
        const isPdf = file.type === "application/pdf" || file.name.toLowerCase().endsWith(".pdf");
        const isImg = file.type.startsWith("image/");

        if (isPdf) {
            if (file.size > 850 * 1024) {
                alert("Atención: El archivo PDF supera 800 KB. Los registros en Firebase deben ser livianos para evitar errores.");
            }
            const reader = new FileReader();
            reader.onloadend = () => resolve({
                base64: reader.result,
                nombre: file.name,
                tipo: 'pdf',
                sizeKb: Math.round(file.size / 1024)
            });
            reader.onerror = () => reject(new Error("Error al leer el archivo PDF"));
            reader.readAsDataURL(file);
        } else if (isImg) {
            const reader = new FileReader();
            reader.onloadend = () => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement("canvas");
                    const maxDim = 1200;
                    let width = img.width;
                    let height = img.height;
                    if (width > maxDim || height > maxDim) {
                        if (width > height) {
                            height = Math.round((height * maxDim) / width);
                            width = maxDim;
                        } else {
                            width = Math.round((width * maxDim) / height);
                            height = maxDim;
                        }
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext("2d");
                    ctx.drawImage(img, 0, 0, width, height);
                    const compressedBase64 = canvas.toDataURL("image/jpeg", 0.75);
                    resolve({
                        base64: compressedBase64,
                        nombre: file.name,
                        tipo: 'image',
                        sizeKb: Math.round((compressedBase64.length * 3) / 4 / 1024)
                    });
                };
                img.onerror = () => reject(new Error("Error al decodificar la imagen"));
                img.src = reader.result;
            };
            reader.onerror = () => reject(new Error("Error al leer la foto"));
            reader.readAsDataURL(file);
        } else {
            reject(new Error("Formato no soportado. Debe ser imagen (.jpg, .png) o documento PDF."));
        }
    });

        // ── CÁLCULO DE GANANCIAS Y UTILIDAD SUMADA DIARIAMENTE ──
        // Desglose transparente día por día: Venta - Costo Mercadería = Utilidad Bruta (17%) - Gastos Operativos = GANANCIA NETA
        const reporteGananciasDiarias = useMemo(() => {
            const diasMap = {};

            // 1. Procesar despachos liquidados
            cargas.filter(c => c.estado === 'liquidada').forEach(c => {
                const f = c.fechaLiquidacion || c.fecha;
                if (!diasMap[f]) {
                    diasMap[f] = {
                        fecha: f,
                        unidadesVendidas: { p1:0, p2:0, p3:0, p4:0 },
                        totalUnidades: 0,
                        ventaTotal: 0,
                        costoTotal: 0,
                        utilidadBruta: 0,
                        gastosDirectos: 0,
                        gastosRutas: 0,
                        detallesRutas: [],
                        detallesGastos: []
                    };
                }

                const devs = c.itemsDevueltos || [];
                let ventaRuta = 0;
                let costoRuta = 0;

                (c.items || []).forEach(it => {
                    const dev = devs.find(d => d.id === it.id)?.q || 0;
                    const vendidas = Math.max(0, it.q - dev);
                    if (vendidas > 0) {
                        diasMap[f].unidadesVendidas[it.id] = (diasMap[f].unidadesVendidas[it.id] || 0) + vendidas;
                        diasMap[f].totalUnidades += vendidas;
                        const vItem = vendidas * (it.pvd || 0);
                        const cItem = vendidas * (it.costo || 0);
                        ventaRuta += vItem;
                        costoRuta += cItem;
                    }
                });

                const utilBrutaRuta = ventaRuta - costoRuta;
                diasMap[f].ventaTotal += ventaRuta;
                diasMap[f].costoTotal += costoRuta;
                diasMap[f].utilidadBruta += utilBrutaRuta;

                // Gastos reportados en la liquidación de la ruta
                if (c.gastos) {
                    const gRutaVal = Object.values(c.gastos).reduce((acc, val) => acc + (parseFloat(val) || 0), 0);
                    diasMap[f].gastosRutas += gRutaVal;
                }

                diasMap[f].detallesRutas.push({
                    vendedor: c.responsable,
                    ventaNeta: c.ventaNeta || ventaRuta,
                    depositado: c.totalADepositar,
                    gastos: c.gastos
                });
            });

            // 2. Procesar facturas de gastos operativos de cada día
            docsGasto.forEach(g => {
                const f = g.fecha;
                const m = parseFloat(g.monto) || 0;
                if (!diasMap[f]) {
                    diasMap[f] = {
                        fecha: f,
                        unidadesVendidas: { p1:0, p2:0, p3:0, p4:0 },
                        totalUnidades: 0,
                        ventaTotal: 0,
                        costoTotal: 0,
                        utilidadBruta: 0,
                        gastosDirectos: 0,
                        gastosRutas: 0,
                        detallesRutas: [],
                        detallesGastos: []
                    };
                }
                diasMap[f].gastosDirectos += m;
                diasMap[f].detallesGastos.push({
                    categoria: g.categoria,
                    concepto: g.concepto,
                    monto: m,
                    archivo: g.archivo,
                    tipoArchivo: g.tipoArchivo,
                    detalle: g.detalleMantenimiento || g.nombreHotel || g.tipoComida
                });
            });

            // 3. Consolidar cálculo de Ganancia Neta Limpia
            const diasArray = Object.values(diasMap).map(d => {
                const totalGastosDia = d.gastosDirectos + d.gastosRutas;
                const gananciaNeta = d.utilidadBruta - totalGastosDia;
                const margenNeto = d.ventaTotal > 0 ? (gananciaNeta / d.ventaTotal) * 100 : 0;
                return {
                    ...d,
                    totalGastosDia,
                    gananciaNeta,
                    margenNeto
                };
            }).sort((a,b) => b.fecha.localeCompare(a.fecha));

            return diasArray;

        // Filtrado de ganancias por rango de fechas
        const gananciasFiltradas = useMemo(() => {

        const totalesGanancias = useMemo(() => {

            const gNeta  = gananciasFiltradas.reduce((a, d) => a + d.gananciaNeta, 0);
            const uUnids = gananciasFiltradas.reduce((a, d) => a + d.totalUnidades, 0);
            const diaHoy = gananciasFiltradas.find(d => d.fecha === today);
            return {
                vTotal, cTotal, uBruta, gTotal, gNeta, uUnids,
                gananciaHoy: diaHoy ? diaHoy.gananciaNeta : 0
            };
        }, [gananciasFiltradas, today]);

        // Stock de bodega sumando entradas de compras y restando salidas de rutas
        const stockPorProducto = useMemo(() => PRODUCTOS.map(p => {
            // Entradas desde facturas de compra
            const entradasCompra = docsCompra.reduce((acc, doc) => {
                const item = doc.items?.find(it => it.id === p.id);
                return acc + (item ? parseFloat(item.q) || 0 : 0);
            }, 0);
            // Entradas desde facturas stock directas (si las hay)
            const entradasStock = facturasStock.reduce((a, f) => a + (f.items?.find(it => it.id === p.id)?.q || 0), 0);
            const despachado = cargas.reduce((a, c) => a + (c.items?.find(it => it.id === p.id)?.q || 0), 0);
            const devuelto   = cargas.reduce((a, c) => a + (c.itemsDevueltos?.find(it => it.id === p.id)?.q || 0), 0);
            const stock      = entradasCompra + entradasStock - despachado + devuelto;
            return {
                ...p,
                stock,
                costoTotal: stock * p.costo,
                ventaTotal: stock * p.pvd,
                utilidad: stock * (p.pvd - p.costo)
            };
        }), [docsCompra, facturasStock, cargas]);

        // Libro contable consolidado
        const libroCompleto = useMemo(() => {
            let data = [];
            cargas.filter(c => c.estado === 'liquidada').forEach(c =>
                data.push({ fecha: c.fechaLiquidacion || c.fecha, desc: `DEPÓSITO RUTA: ${c.responsable}`, ingreso: parseFloat(c.totalADepositar)||0, egreso: 0, tipo: 'RUTA' }));

                        fecha: p.fecha,
                        desc: `PAGO PROVEEDOR (${p.metodo?.toUpperCase()}): ${d.proveedor} F#${d.numFact}`,

                if (monto > 0) {
                    data.push({ fecha: d.fecha, desc: `GASTO (${d.categoria?.toUpperCase()}): ${d.concepto || d.notas || 'Sin detalle'}`, ingreso: 0, egreso: monto, tipo: 'GASTO' });
                }

            movManuales.forEach(m =>
                data.push({ fecha: m.fecha, desc: m.desc.toUpperCase(), ingreso: m.tipo === 'ingreso' ? parseFloat(m.monto)||0 : 0, egreso: m.tipo === 'egreso' ? parseFloat(m.monto)||0 : 0, tipo: 'MANUAL' }));

            data.sort((a,b) => new Date(a.fecha) - new Date(b.fecha));
            let saldo = 0;
            return data.map(m => {
                saldo += (m.ingreso - m.egreso);
                return { ...m, saldoActual: saldo };
            }).reverse();
        }, [cargas, docsCompra, docsGasto, movManuales]);

        const libroFiltrado = useMemo(() => libroCompleto.filter(m => {
            const ok1 = filtroInicio ? m.fecha >= filtroInicio : true;

            return ok1 && ok2;

                    ? (c.proveedor?.toLowerCase().includes(busquedaCompra.toLowerCase()) || c.numFact?.includes(busquedaCompra) || c.notas?.toLowerCase().includes(busquedaCompra.toLowerCase()))

        const gastosFiltrados = useMemo(() => {

        const totalGastosPorCat = useMemo(() => {

        // ── ACCIONES FIREBASE ──

        // Guardar Factura de Compra de Avena Polaca
        const guardarDocCompra = async () => {

                setIsSaving(false);
            }

        // REGISTRAR PAGO / ABONO A FACTURA DE COMPRA (Transferencia o Efectivo con Foto/PDF/Texto)
        const registrarPagoAbonoFactura = async () => {
            if (!modalPagoCompra || isSaving) return;
            const montoPagar = parseFloat(formPagoCompra.monto);
            if (isNaN(montoPagar) || montoPagar <= 0) {

            if (formPagoCompra.metodo === 'efectivo' && !formPagoCompra.detalleTextoEfectivo.trim()) {

            setIsSaving(true);
            try {

                const nuevoPago = {
                    id: 'pago_' + Date.now(),
                    fecha: formPagoCompra.fecha,

                    metodo: formPagoCompra.metodo,
                    monto: montoPagar,

                    detalleTextoEfectivo: formPagoCompra.detalleTextoEfectivo || '',

                    tipoArchivo: formPagoCompra.tipoArchivo || '',

                };

                const historialPagos = [...(modalPagoCompra.pagos || []), nuevoPago];
                const totalPagadoAcumulado = historialPagos.reduce((a, p) => a + (parseFloat(p.monto) || 0), 0);
                const nuevoEstado = totalPagadoAcumulado >= (modalPagoCompra.monto - 0.05) ? 'cancelado' : (totalPagadoAcumulado > 0 ? 'abonado' : 'pendiente');

                await FB.updateDoc(facturaRef, {

                setModalPagoCompra(null);
                setFormPagoCompra({

                setIsSaving(false);
            }

        // Guardar factura de gasto
        const guardarDocGasto = async () => {
            if (!user || isSaving) return;
            let montoFinal = 0;
            let conceptoFinal = formDocGasto.concepto;

            if (formDocGasto.categoria === 'combustible') {
                montoFinal = parseFloat(formDocGasto.valorCombustible);
                if (!conceptoFinal) conceptoFinal = `Combustible ($${montoFinal.toFixed(2)})`;
            } else if (formDocGasto.categoria === 'alimentacion') {
                montoFinal = parseFloat(formDocGasto.monto);
                const comLabel = formDocGasto.tipoComida === 'desayuno' ? 'Desayuno' : formDocGasto.tipoComida === 'almuerzo' ? 'Almuerzo' : 'Merienda';
                if (!conceptoFinal) conceptoFinal = `Alimentación - ${comLabel}`;
            } else if (formDocGasto.categoria === 'mantenimiento') {
                montoFinal = parseFloat(formDocGasto.monto);
                const mantLabel = formDocGasto.tipoMantenimiento === 'cambio_aceite' ? 'Cambio de Aceite' : 'Reparación Vehículo';
                if (!conceptoFinal) conceptoFinal = `Mantenimiento - ${mantLabel}`;
            } else if (formDocGasto.categoria === 'hospedaje') {
                montoFinal = parseFloat(formDocGasto.monto);
                if (!conceptoFinal) conceptoFinal = `Hospedaje: ${formDocGasto.nombreHotel || 'Hotel'}`;
            } else {
                montoFinal = parseFloat(formDocGasto.monto);
                if (!conceptoFinal) conceptoFinal = 'Gasto Operativo';
            }

            if (isNaN(montoFinal) || montoFinal <= 0) {
                setError("Por favor especifica un valor numérico válido para el gasto.");
                return;

                const byteNumbers = new Array(byteCharacters.length);
                for (let i = 0; i < byteCharacters.length; i++) {
                    byteNumbers[i] = byteCharacters.charCodeAt(i);
                }
                const byteArray = new Uint8Array(byteNumbers);
                const blob = new Blob([byteArray], { type: 'application/pdf' });
                const blobUrl = URL.createObjectURL(blob);

                                    <input
                                        type="number"
                                        step="0.01"
                                        className="w-full p-2.5 bg-white rounded-xl font-black text-base border border-blue-300 outline-none text-blue-900"
                                        value={formDocGasto.monto}
                                        onChange={e => setFormDocGasto({...formDocGasto, monto: e.target.value})}
                                    />
                                </div>
                            </div>
                        )}

                        {/* Adjunto */}
                        <div className="bg-slate-50 p-3 rounded-2xl border border-dashed border-slate-300">
                            <label className="text-[10px] font-black text-slate-700 uppercase block mb-1">Cargar Factura / Comprobante (PDF o Foto)</label>
                            <input
                                type="file"
                                accept="image/*,application/pdf"
                                className="w-full p-2 text-xs bg-white rounded-xl border"
                                onChange={e => handleSubidaArchivo(e, setFormDocGasto)}
                            />
                            {formDocGasto.nombreArchivo && <p className="text-[10px] text-orange-600 font-bold mt-1">📎 {formDocGasto.nombreArchivo}</p>}
                        </div>
                    </div>

                    <div className="p-4 border-t bg-slate-50 flex gap-2">
                        <button onClick={() => setModalDocGasto(false)} className="w-1/3 py-3 rounded-xl bg-slate-200 font-black text-xs uppercase text-slate-700">Cancelar</button>
                        <button onClick={guardarDocGasto} disabled={isSaving} className="flex-1 py-3 rounded-xl bg-orange-600 text-white font-black text-xs uppercase shadow-md">
                            {isSaving ? 'Guardando...' : 'Guardar Factura de Gasto'}
                        </button>
                    </div>
                </div>
            </div>
            )}

            {/* ═══════════════════════════════════════════════════════
                MODAL: DESPACHAR RUTA
            ═══════════════════════════════════════════════════════ */}
            {modalC && (
            <div className="fixed inset-0 bg-slate-900/80 z-[200] overflow-y-auto backdrop-blur-sm p-2 sm:p-4 flex items-end sm:items-center justify-center">
                <div className="bg-white w-full max-w-lg rounded-3xl flex flex-col shadow-2xl overflow-hidden fade-in text-xs">
                    <div className="p-4 border-b flex justify-between items-center bg-slate-50">
                        <h3 className="font-black uppercase text-xs text-slate-600 tracking-wider">Despachar Producto a Vendedor</h3>
                        <button onClick={() => setModalC(false)} className="p-1 text-slate-400"><Icon name="x" size={18}/></button>
                    </div>
                    <div className="p-5 space-y-4 max-h-[75vh] overflow-y-auto custom-scrollbar">
                        <div>
                            <label className="text-[9px] font-black text-slate-500 uppercase block mb-1">Vendedor Responsable</label>
                            <select
                                className="w-full p-2.5 bg-slate-50 rounded-xl font-black text-xs border border-slate-200 outline-none text-[#128C7E]"
                                value={formC.ven}
                                onChange={e => setFormC({...formC, ven: e.target.value})}
                            >
                                <option value="">Selecciona vendedor...</option>
                                {VENDEDORES.map((v, i) => <option key={i} value={v}>{v}</option>)}
                            </select>
                        </div>

                        <div>
                            <label className="text-[9px] font-black text-slate-500 uppercase block mb-1">Fecha de Salida</label>
                            <input
                                type="date"
                                className="w-full p-2.5 bg-slate-50 rounded-xl font-bold text-xs border outline-none"
                                value={formC.fecha}
                                onChange={e => setFormC({...formC, fecha: e.target.value})}
                            />
                        </div>

                        <div className="space-y-2">
                            {formC.items.map((it, idx) => (
                                <div key={it.id} className="flex justify-between items-center p-2.5 bg-slate-50 rounded-xl border">
                                    <span className="text-xs font-bold text-slate-700 uppercase flex-1 pr-2">{it.nombre}</span>
                                    <input
                                        type="number"
                                        placeholder="0"
                                        className="w-20 p-2 text-center font-black bg-white rounded-lg border outline-none text-[#128C7E]"
                                        value={it.q || ''}
                                        onChange={e => {
                                            const ni = [...formC.items];
                                            ni[idx].q = parseInt(e.target.value) || 0;
                                            setFormC({...formC, items: ni});
                                        }}
                                    />
                                </div>
                            ))}
                        </div>
                    </div>
                    <div className="p-4 border-t bg-slate-50">
                        <button onClick={guardarCarga} disabled={isSaving} className="w-full bg-[#128C7E] text-white py-3 rounded-xl font-black uppercase text-xs shadow-md">
                            Confirmar Despacho 🚛
                        </button>
                    </div>
                </div>
            </div>
            )}

            {/* ═══════════════════════════════════════════════════════
                MODAL: LIQUIDAR RUTA
            ═══════════════════════════════════════════════════════ */}
            {modalLiquidacion && (
            <div className="fixed inset-0 bg-slate-900/80 z-[200] overflow-y-auto backdrop-blur-sm p-2 sm:p-4 flex items-end sm:items-center justify-center">
                <div className="bg-white w-full max-w-lg rounded-3xl flex flex-col shadow-2xl overflow-hidden fade-in text-xs">
                    <div className="p-4 border-b flex justify-between items-center bg-slate-50">
                        <h3 className="font-black uppercase text-xs text-slate-600 tracking-wider">Liquidar Ruta — {modalLiquidacion.responsable}</h3>
                        <button onClick={() => setModalLiquidacion(null)} className="p-1 text-slate-400"><Icon name="x" size={18}/></button>
                    </div>
                    <div className="p-5 space-y-4 max-h-[75vh] overflow-y-auto custom-scrollbar">
                        <p className="text-[10px] font-black text-slate-400 uppercase">Unidades Devueltas por el Vendedor</p>
                        <div className="space-y-2">
                            {formLiq.itemsDevueltos.map((it, idx) => (
                                <div key={it.id} className="flex justify-between items-center p-2 bg-slate-50 rounded-xl border">
                                    <span className="text-xs font-bold text-slate-700 uppercase flex-1 pr-2">{it.nombre}</span>
                                    <input
                                        type="number"
                                        placeholder="0"
                                        className="w-20 p-2 text-center font-black bg-white rounded-lg border outline-none text-[#128C7E]"
                                        value={it.q || ''}
                                        onChange={e => {
                                            const ni = [...formLiq.itemsDevueltos];
                                            ni[idx].q = parseInt(e.target.value) || 0;
                                            setFormLiq({...formLiq, itemsDevueltos: ni});
                                        }}
                                    />
                                </div>
                            ))}
                        </div>

                        <p className="text-[10px] font-black text-slate-400 uppercase border-t pt-3">Gastos del Día en Ruta ($)</p>
                        <div className="grid grid-cols-2 gap-2">
                            {Object.keys(formLiq.gastos).map(k => (
                                <div key={k}>
                                    <label className="text-[9px] font-black text-slate-500 uppercase block mb-1">{k}</label>
                                    <input
                                        type="number"
                                        step="0.01"
                                        placeholder="0.00"
                                        className="w-full p-2 bg-slate-50 rounded-xl font-black text-xs border outline-none text-[#128C7E]"
                                        value={formLiq.gastos[k]}
                                        onChange={e => setFormLiq({
                                            ...formLiq,
                                            gastos: { ...formLiq.gastos, [k]: parseFloat(e.target.value) || 0 }
                                        })}
                                    />
                                </div>
                            ))}
                        </div>

                        <div>
                            <label className="text-[9px] font-black text-slate-500 uppercase block mb-1">Fecha de Liquidación / Depósito</label>
                            <input
                                type="date"
                                className="w-full p-2.5 bg-slate-50 rounded-xl font-bold text-xs border outline-none"
                                value={formLiq.fechaLiquidacion}
                                onChange={e => setFormLiq({...formLiq, fechaLiquidacion: e.target.value})}
                            />
                        </div>
                    </div>
                    <div className="p-4 border-t bg-slate-50">
                        <button onClick={registrarLiquidacion} disabled={isSaving} className="w-full bg-[#128C7E] text-white py-3 rounded-xl font-black uppercase text-xs shadow-md">
                            Confirmar Liquidación y Actualizar Ganancias
                        </button>
                    </div>
                </div>
            </div>
            )}

            {/* ═══════════════════════════════════════════════════════
                MODAL: MOVIMIENTO MANUAL DE CAJA
            ═══════════════════════════════════════════════════════ */}
            {modalContabilidad && (
            <div className="fixed inset-0 bg-slate-900/80 z-[200] overflow-y-auto backdrop-blur-sm p-2 sm:p-4 flex items-end sm:items-center justify-center">
                <div className="bg-white w-full max-w-md rounded-3xl flex flex-col shadow-2xl overflow-hidden fade-in text-xs">
                    <div className="p-4 border-b flex justify-between items-center bg-slate-50">
                        <h3 className="font-black uppercase text-xs text-slate-600 tracking-wider">Nuevo Movimiento Manual de Caja</h3>
                        <button onClick={() => setModalContabilidad(false)} className="p-1 text-slate-400"><Icon name="x" size={18}/></button>
                    </div>
                    <div className="p-5 space-y-4">
                        <div className="flex gap-2">
                            <button
                                type="button"
                                onClick={() => setFormMov({...formMov, tipo:'ingreso'})}
                                className={`flex-1 py-2.5 rounded-xl font-black text-xs uppercase ${formMov.tipo==='ingreso'?'bg-emerald-600 text-white shadow-sm':'bg-slate-100 text-slate-600'}`}
                            >
                                📈 Ingreso
                            </button>
                            <button
                                type="button"
                                onClick={() => setFormMov({...formMov, tipo:'egreso'})}
                                className={`flex-1 py-2.5 rounded-xl font-black text-xs uppercase ${formMov.tipo==='egreso'?'bg-red-500 text-white shadow-sm':'bg-slate-100 text-slate-600'}`}
                            >
                                📉 Egreso
                            </button>
                        </div>
                        <div>
                            <label className="text-[9px] font-black text-slate-500 uppercase block mb-1">Descripción</label>
                            <input
                                type="text"
                                placeholder="Ej: Depósito bancario, Pago proveedor..."
                                className="w-full p-2.5 bg-slate-50 rounded-xl font-bold text-xs border outline-none"
                                value={formMov.desc}
                                onChange={e => setFormMov({...formMov, desc: e.target.value})}
                            />
                        </div>
                        <div>
                            <label className="text-[9px] font-black text-slate-500 uppercase block mb-1">Monto ($)</label>
                            <input
                                type="number"
                                step="0.01"
                                placeholder="0.00"
                                className="w-full p-2.5 bg-slate-50 rounded-xl font-black text-base border outline-none"
                                value={formMov.monto}
                                onChange={e => setFormMov({...formMov, monto: e.target.value})}
                            />
                        </div>
                        <div>
                            <label className="text-[9px] font-black text-slate-500 uppercase block mb-1">Fecha</label>
                            <input
                                type="date"
                                className="w-full p-2.5 bg-slate-50 rounded-xl font-bold text-xs border outline-none"
                                value={formMov.fecha}
                                onChange={e => setFormMov({...formMov, fecha: e.target.value})}
                            />
                        </div>
                    </div>
                    <div className="p-4 border-t bg-slate-50">
                        <button onClick={registrarMovManual} disabled={isSaving} className="w-full bg-[#128C7E] text-white py-3 rounded-xl font-black uppercase text-xs shadow-md">
                            Asentar Movimiento en Caja
                        </button>
                    </div>
                </div>
            </div>
            )}

            {/* ═══════════════════════════════════════════════════════
                MODAL: VISOR DE DOCUMENTOS (PDF O FOTO)
            ═══════════════════════════════════════════════════════ */}
            {visorDoc && (
            <div className="fixed inset-0 bg-black/90 z-[300] flex flex-col items-center justify-center p-2 sm:p-6" onClick={() => setVisorDoc(null)}>
                <div className="w-full max-w-4xl bg-slate-900 rounded-2xl overflow-hidden shadow-2xl flex flex-col max-h-[92vh]" onClick={e => e.stopPropagation()}>
                    <div className="bg-slate-800 p-3.5 px-4 text-white flex justify-between items-center border-b border-slate-700">
                        <div>
                            <h3 className="font-black text-sm uppercase tracking-wide text-emerald-400">
                                {visorDoc.titulo || 'Visualizador de Documento'}
                            </h3>
                            <p className="text-[10px] text-slate-300">{visorDoc.detalle || visorDoc.nombre}</p>
                        </div>
                        <div className="flex items-center gap-2">
                            {visorDoc.tipo === 'pdf' && (
                                <button
                                    onClick={() => abrirPdfEnPestana(visorDoc.url)}
                                    className="px-3 py-1.5 bg-[#128C7E] hover:bg-emerald-600 text-white rounded-lg text-xs font-bold flex items-center gap-1 shadow-sm"
                                    title="Abrir en pestaña nueva para imprimir o descargar"
                                >
                                    <Icon name="external-link" size={14}/>
                                    <span>Abrir Completo</span>
                                </button>
                            )}
                            <button
                                onClick={() => setVisorDoc(null)}
                                className="p-1.5 text-slate-400 hover:text-white rounded-lg bg-white/10"
                            >
                                <Icon name="x" size={20}/>
                            </button>
                        </div>
                    </div>

                    <div className="flex-1 p-2 sm:p-4 bg-slate-950 flex items-center justify-center overflow-auto">
                        {visorDoc.tipo === 'image' || (visorDoc.url && visorDoc.url.startsWith('data:image')) ? (
                            <img
                                src={visorDoc.url}
                                alt="Comprobante cargado"
                                className="max-h-[75vh] w-auto max-w-full rounded-xl object-contain shadow-xl"
                            />
                        ) : visorDoc.tipo === 'pdf' || (visorDoc.url && visorDoc.url.startsWith('data:application/pdf')) ? (
                            <iframe
                                src={visorDoc.url}
                                className="w-full h-[75vh] rounded-xl bg-white border border-slate-700"
                                title="Factura PDF"
                            />
                        ) : (
                            <p className="text-white text-xs">Formato de archivo no soportado para previsualización directa.</p>
                        )}
                    </div>
                </div>
            </div>
            )}

            {/* ═══════════════════════════════════════════════════════
                MODAL: REINICIAR Y ARRANCAR DESDE CERO
            ═══════════════════════════════════════════════════════ */}
            {showReset && (
            <div className="fixed inset-0 bg-slate-900/90 z-[300] flex items-center justify-center p-4">
                <div className="bg-white rounded-3xl p-6 max-w-sm w-full shadow-2xl text-center fade-in">
                    <div className="w-16 h-16 bg-red-100 rounded-2xl flex items-center justify-center mx-auto mb-4 text-red-600">
                        <Icon name="rotate-ccw" size={30}/>
                    </div>
                    <h3 className="font-black text-slate-800 text-base uppercase italic mb-2">Arrancar Información desde 0</h3>
                    <p className="text-xs text-slate-500 mb-6 leading-relaxed">
                        ¿Confirmas que deseas reiniciar y arrancar desde cero todas las facturas de compras, gastos y rutas? Esta acción dejará las tablas completamente limpias.
                    </p>
                    <div className="flex gap-2.5">
                        <button
                            onClick={() => setShowReset(false)}
                            className="flex-1 py-3 rounded-xl bg-slate-100 hover:bg-slate-200 font-black text-xs uppercase text-slate-700"
                        >
                            Cancelar
                        </button>
                        <button
                            onClick={resetearTodoDesdeCero}
                            className="flex-1 py-3 rounded-xl bg-red-600 hover:bg-red-700 text-white font-black text-xs uppercase shadow-lg"
                        >
                            Sí, Arrancar en 0
                        </button>
                    </div>
                </div>
            </div>
            )}
        </div>
        );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App/>);
</script>
</body>
</html>
