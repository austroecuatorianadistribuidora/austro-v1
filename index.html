    const obtenerRutaPorFecha = (fechaIso) => {
        try {
            const d = fechaIso ? new Date(fechaIso + 'T12:00:00') : new Date();
            const day = d.getDay(); // 0=Dom, 1=Lun, 2=Mar, 3=Mié, 4=Jue, 5=Vie, 6=Sáb
            if (day === 1) return RUTAS_OFICIALES[0];
            if (day === 2) return RUTAS_OFICIALES[1];
            if (day === 3) return RUTAS_OFICIALES[2];
            if (day === 4) return RUTAS_OFICIALES[3];
            if (day === 0) return RUTAS_OFICIALES[5];
            return RUTAS_OFICIALES[4];
        } catch(e) {
            return RUTAS_OFICIALES[0];
        }
    };

    // Obtener rango semanal (Lunes a Domingo) para una fecha YYYY-MM-DD
    const obtenerSemanaDeFecha = (fechaIso) => {
        try {
            const f = fechaIso || new Date().toISOString().split('T')[0];
            const d = new Date(f + 'T12:00:00');
            const day = d.getDay();
            const diffLunes = d.getDate() - day + (day === 0 ? -6 : 1);
            const lunes = new Date(d);
            lunes.setDate(diffLunes);
            const domingo = new Date(lunes);
            domingo.setDate(lunes.getDate() + 6);
            const inicio = lunes.toISOString().split('T')[0];
            const fin = domingo.toISOString().split('T')[0];
            return {
                clave: `${inicio}_${fin}`,
                inicio,
                fin,
                etiqueta: `Semana ${inicio} al ${fin}`
            };
        } catch (e) {
            return { clave: 'actual', inicio: fechaIso, fin: fechaIso, etiqueta: `Semana ${fechaIso}` };
        }
    };

    const BACKUP_CONFIG = {

    // ── LECTOR INTELIGENTE DE PDF Y ARCHIVOS PARA FACTURAS ──
    const extraerTextoDePDF = async (arrayBuffer) => {
        if (!window.pdfjsLib) return '';
        try {
            const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            let fullText = '';
            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const content = await page.getTextContent();
                const strings = content.items.map(item => item.str);
                fullText += strings.join(' ') + '\n';
            }
            return fullText;
        } catch (err) {
            console.warn("Error leyendo texto PDF:", err);
            return '';
        }
    };

    // Analizar texto de factura electrónica de Lácteos La Polaca / Gustalac y extraer datos exactos
    const parsearTextoFacturaPolaca = (texto, fechaDefault) => {
        const limpio = String(texto || '').replace(/\s+/g, ' ');
        // 1. Número de factura (ej. 003-102-000005913)
        const matchNum = limpio.match(/(\d{3}-\d{3}-\d{6,9})/);
        const numFact = matchNum ? matchNum[1] : '';

        // 2. Fecha de emisión (dd/mm/yyyy o yyyy-mm-dd)
        let fecha = fechaDefault;
        const matchFechaDMY = limpio.match(/(\d{2})[\/\-](\d{2})[\/\-](20\d{2})/);
        const matchFechaYMD = limpio.match(/(20\d{2})[\/\-](\d{2})[\/\-](\d{2})/);
        if (matchFechaYMD) {
            fecha = `${matchFechaYMD[1]}-${matchFechaYMD[2]}-${matchFechaYMD[3]}`;
        } else if (matchFechaDMY) {
            fecha = `${matchFechaDMY[3]}-${matchFechaDMY[2]}-${matchFechaDMY[1]}`;
        }

        // 3. Buscar cantidades de los 3 productos en el texto del PDF
        const buscarCantidadProducto = (patrones) => {
            for (const reg of patrones) {
                const m = limpio.match(reg);
                if (m && m[1]) {
                    const val = parseFloat(m[1].replace(',', '.'));
                    if (!isNaN(val) && val > 0 && val < 100000) return Math.round(val);
                }
            }
            return null;
        };

        const qP1 = buscarCantidadProducto([
            /P000000256[^\d]{1,60}?(\d+(?:[\.,]\d+)?)/i,
            /(\d+(?:[\.,]\d+)?)\s*(?:UND|UNI|U\b)?[^\d]{1,40}?P000000256/i,
            /165\s*G[^\d]{1,45}?(\d{2,5})(?:\.00|\b)/i,
            /(\d{2,5})(?:\.00)?\s+[^\d]{0,30}?165\s*G/i
        ]);

        const qP2 = buscarCantidadProducto([
            /P000000247[^\d]{1,60}?(\d+(?:[\.,]\d+)?)/i,
            /(\d+(?:[\.,]\d+)?)\s*(?:UND|UNI|U\b)?[^\d]{1,40}?P000000247/i,
            /340\s*G[^\d]{1,45}?(\d{2,5})(?:\.00|\b)/i,
            /(\d{2,5})(?:\.00)?\s+[^\d]{0,30}?340\s*G/i
        ]);

        const qP3 = buscarCantidadProducto([
            /P000000005[^\d]{1,60}?(\d+(?:[\.,]\d+)?)/i,
            /(\d+(?:[\.,]\d+)?)\s*(?:UND|UNI|U\b)?[^\d]{1,40}?P000000005/i,
            /MEDIO\s+LITRO[^\d]{1,45}?(\d{1,5})(?:\.00|\b)/i,
            /(\d{1,5})(?:\.00)?\s+[^\d]{0,30}?MEDIO\s+LITRO/i
        ]);

        // 4. Buscar Valor Total en el PDF si aparece explícito
        let montoExplicito = null;
        const matchTotal = limpio.match(/VALOR\s+TOTAL\s*[:\$]?\s*(\d{1,6}[\.,]\d{2})/i)
            || limpio.match(/TOTAL\s+A\s+PAGAR\s*[:\$]?\s*(\d{1,6}[\.,]\d{2})/i);
        if (matchTotal && matchTotal[1]) {
            montoExplicito = parseFloat(matchTotal[1].replace(',', '.'));
        }

        return {
            numFact,
            fecha,
            qP1,
            qP2,
            qP3,
            montoExplicito
        };
    };

    function App() {
        const today = new Date().toISOString().split('T')[0];

                    const app = FB.initializeApp(cfg);
                    const auth = FB.getAuth(app);
                    const db = FB.getFirestore(app);
                    const appId = typeof __app_id !== 'undefined' ? __app_id : 'austropolaca-control-v1';
                    window.appDb = db;
                    window.appId = appId;

                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {

                    } else {
                        await FB.signInAnonymously(auth);
                    }
                    FB.onAuthStateChanged(auth, u => { setUser(u); setLoading(false); });

                    const col = n => FB.collection(db, 'artifacts', appId, 'public', 'data', n);
                    FB.onSnapshot(col('despachos'), s => setCargas(s.docs.map(d => ({ id: d.id, ...d.data() }))));

                    FB.onSnapshot(col('docsCompra'), s => setDocsCompra(s.docs.map(d => ({ id: d.id, ...d.data() }))));
                    FB.onSnapshot(col('docsGasto'), s => setDocsGasto(s.docs.map(d => ({ id: d.id, ...d.data() }))));
                    FB.onSnapshot(col('docsDevolucion'), s => setDocsDevolucion(s.docs.map(d => ({ id: d.id, ...d.data() }))));
                    FB.onSnapshot(col('ventasNotas'), s => {
                        const lista = s.docs.map(d => {
                            const data = d.data();
                            return { ...data, id: d.id, firestoreId: d.id, localId: data.id || d.id };
                        });
                        setVentasNotas(lista);
                        try { localStorage.setItem('austropolaca_ventas_notas_v1', JSON.stringify(lista)); } catch(e) {}

        // ═══════════════════════════════════════════════════════════════════════════

        // ═══════════════════════════════════════════════════════════════════════════
        const [editandoVentaId, setEditandoVentaId] = useState(null);

        const [sidebarAbierto, setSidebarAbierto] = useState(false); // Control de barra vertical lateral en pantallas móviles

        const [formNota, setFormNota] = useState(() => ({
            fecha: today,
            cliente: '',
            ciudad: rutaHoy.pueblos?.[0] || 'Alausí',
            items: PRODUCTOS_POLACA.map(p => ({
                id: p.id,

            }))

        const rutaFechaNota = useMemo(() => obtenerRutaPorFecha(formNota.fecha || today), [formNota.fecha, today]);

        const cambiarCantidadNota = (id, delta) => {
            setFormNota(prev => ({
                ...prev,
                items: prev.items.map(it => it.id === id ? { ...it, q: Math.max(0, (parseInt(it.q) || 0) + delta) } : it)
            }));
        };

        const fijarCantidadNota = (id, valor) => {
            const num = valor === '' ? 0 : Math.max(0, parseInt(valor) || 0);
            setFormNota(prev => ({
                ...prev,
                items: prev.items.map(it => it.id === id ? { ...it, q: num } : it)
            }));
        };

        const cambiarPrecioNota = (id, valor) => {
            const pvd = Math.max(0, parseFloat(String(valor).replace(',', '.')) || 0);
            setFormNota(prev => ({
                ...prev,
                items: prev.items.map(it => it.id === id ? { ...it, pvd } : it)
            }));
        };

        const totalesNotaActiva = useMemo(() => {
            let unids = 0, monto = 0, costo = 0;
            (formNota.items || []).forEach(it => {
                const q = parseInt(it.q) || 0;
                const p = parseFloat(it.pvd) || 0;
                const c = parseFloat(it.costo) || 0;
                unids += q;
                monto += q * p;
                costo += q * c;
            });
            return {
                totalUnidades: unids,
                totalMonto: parseFloat(monto.toFixed(2)),
                totalCosto: parseFloat(costo.toFixed(2)),
                totalUtilidad: parseFloat((monto - costo).toFixed(2))
            };
        }, [formNota.items]);

        const limpiarFormNota = () => {
            setEditandoVentaId(null);
            setFormNota(prev => ({
                fecha: prev.fecha || today,
                cliente: '',
                ciudad: prev.ciudad || obtenerRutaPorFecha(prev.fecha || today).pueblos?.[0] || '',
                items: PRODUCTOS_POLACA.map(p => ({
                    id: p.id,
                    codigo: p.codigo,
                    nombre: p.nombre,
                    nombreCorto: p.nombreCorto,
                    peso: p.peso,
                    costo: p.costo,
                    pvd: p.pvd,
                    q: 0
                }))
            }));
        };

        const guardarVentaNota = async () => {
            const itemsValidos = (formNota.items || []).filter(it => (parseInt(it.q) || 0) > 0);
            if (itemsValidos.length === 0) {
                setError("Ingresa la cantidad en al menos 1 producto para grabar la Nota de Venta.");
                return;
            }
            const clienteFinal = (formNota.cliente || '').trim() || 'Consumidor Final';
            const ciudadFinal = (formNota.ciudad || '').trim() || rutaFechaNota.nombre;
            const fechaFinal = formNota.fecha || today;
            const semanaInfo = obtenerSemanaDeFecha(fechaFinal);
            const numNota = editandoVentaId
                ? (ventasNotas.find(v => v.id === editandoVentaId)?.numeroNota || `NV-${String(ventasNotas.length).padStart(4, '0')}`)
                : `NV-${String((ventasNotas.length || 0) + 1).padStart(4, '0')}`;
            const horaActual = new Date().toLocaleTimeString('es-EC', { hour: '2-digit', minute: '2-digit' });

            const itemsProcesados = itemsValidos.map(it => {
                const q = parseInt(it.q) || 0;
                const pvd = parseFloat(it.pvd) || 0;
                const costo = parseFloat(it.costo) || 0;
                return {
                    id: it.id,
                    codigo: it.codigo,
                    nombre: it.nombre,
                    nombreCorto: it.nombreCorto,
                    peso: it.peso,
                    costo,
                    pvd,
                    q,
                    subtotal: parseFloat((q * pvd).toFixed(2)),
                    subtotalCosto: parseFloat((q * costo).toFixed(2)),
                    utilidad: parseFloat(((pvd - costo) * q).toFixed(2))
                };
            });

            const totalUnidades = itemsProcesados.reduce((a, b) => a + b.q, 0);
            const totalMonto = parseFloat(itemsProcesados.reduce((a, b) => a + b.subtotal, 0).toFixed(2));
            const totalCosto = parseFloat(itemsProcesados.reduce((a, b) => a + b.subtotalCosto, 0).toFixed(2));
            const utilidadBruta = parseFloat((totalMonto - totalCosto).toFixed(2));

            if (editandoVentaId) {
                const ventaActualizada = {
                    id: editandoVentaId,
                    firestoreId: editandoVentaId,
                    localId: editandoVentaId,
                    numeroNota: numNota,
                    fecha: fechaFinal,
                    hora: horaActual,
                    semanaClave: semanaInfo.clave,
                    semanaEtiqueta: semanaInfo.etiqueta,
                    rutaDia: rutaFechaNota.nombre,
                    cliente: clienteFinal,
                    ciudad: ciudadFinal,
                    direccion: ciudadFinal,
                    totalUnidades,
                    totalMonto,
                    totalCosto,
                    utilidadBruta,
                    items: itemsProcesados,
                    updatedAt: new Date().toISOString()
                };

                setVentasNotas(prev => {
                    const act = prev.map(v => (v.id === editandoVentaId || v.firestoreId === editandoVentaId) ? { ...v, ...ventaActualizada } : v);
                    try { localStorage.setItem('austropolaca_ventas_notas_v1', JSON.stringify(act)); } catch(e) {}
                    return act;
                });

                try {
                    if (window.appDb && window.appId && window.FB) {
                        const ref = FB.doc(window.appDb, 'artifacts', window.appId, 'public', 'data', 'ventasNotas', editandoVentaId);
                        await FB.updateDoc(ref, ventaActualizada);
                    }
                } catch(e) {}

                limpiarFormNota();
                mostrarAviso(`✓ Nota actualizada: ${clienteFinal} (${ciudadFinal}) • $${totalMonto.toFixed(2)}`);
                return;
            }

            const localId = 'vn_' + Date.now();
            const nuevaVenta = {
                id: localId,
                localId,
                firestoreId: localId,
                numeroNota: numNota,
                fecha: fechaFinal,
                hora: horaActual,
                timestamp: Date.now(),
                semanaClave: semanaInfo.clave,
                semanaEtiqueta: semanaInfo.etiqueta,
                rutaDia: rutaFechaNota.nombre,
                cliente: clienteFinal,
                ciudad: ciudadFinal,
                direccion: ciudadFinal,
                totalUnidades,
                totalMonto,
                totalCosto,
                utilidadBruta,
                items: itemsProcesados,
                createdAt: new Date().toISOString()
            };

            setVentasNotas(prev => {
                const nuevaLista = [nuevaVenta, ...prev];
                try { localStorage.setItem('austropolaca_ventas_notas_v1', JSON.stringify(nuevaLista)); } catch(e) {}
                return nuevaLista;
            });

            limpiarFormNota();
            mostrarAviso(`✓ Nota grabada: ${clienteFinal} (${ciudadFinal}) • $${totalMonto.toFixed(2)}`);

            try {
                if (window.appDb && window.appId && window.FB) {
                    const colRef = FB.collection(window.appDb, 'artifacts', window.appId, 'public', 'data', 'ventasNotas');
                    await FB.addDoc(colRef, nuevaVenta);
                }
            } catch(e) {}
        };

        const editarVentaNota = (v) => {
            if (!v || v.esConsumidorFinalAuto) return;
            const targetId = v.id || v.firestoreId || v.localId;
            setEditandoVentaId(targetId);
            setFormNota({
                fecha: v.fecha || today,
                cliente: v.cliente || '',
                ciudad: v.ciudad || v.direccion || '',
                items: PRODUCTOS_POLACA.map(p => {
                    const itemVenta = (v.items || []).find(it => normalizarIdProducto(it) === p.id);
                    return {
                        id: p.id,
                        codigo: p.codigo,
                        nombre: p.nombre,
                        nombreCorto: p.nombreCorto,
                        peso: p.peso,
                        costo: p.costo,
                        pvd: itemVenta ? (parseFloat(itemVenta.pvd) || p.pvd) : p.pvd,
                        q: itemVenta ? (parseInt(itemVenta.q) || 0) : 0
                    };
                })
            });
            setActiveTab('notaVenta');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        const eliminarVentaNota = async (v) => {
            if (!v || v.esConsumidorFinalAuto) return;
            if (!confirm(`¿Eliminar la nota de venta de ${v.cliente} ($${Number(v.totalMonto).toFixed(2)})?`)) return;
            const idTarget = v.id || v.firestoreId || v.localId;
            setVentasNotas(prev => {
                const filtradas = prev.filter(x => x.id !== idTarget && x.firestoreId !== idTarget && x.localId !== idTarget);
                try { localStorage.setItem('austropolaca_ventas_notas_v1', JSON.stringify(filtradas)); } catch(e) {}
                return filtradas;
            });
            try {
                if (window.appDb && window.appId && window.FB) {
                    await FB.deleteDoc(FB.doc(window.appDb, 'artifacts', window.appId, 'public', 'data', 'ventasNotas', idTarget));
                }
            } catch(e) {}
            mostrarAviso("✓ Nota de venta eliminada");
        };

        // Función auxiliar para extraer las unidades de los 3 productos de cualquier factura registrada
        const extraerUnidadesDeFactura = (doc) => {
            const unids = { p1: 0, p2: 0, p3: 0 };
            if (!doc) return unids;
            (doc.items || []).forEach(it => {
                const pid = normalizarIdProducto(it);
                if (!pid) return;
                const qTotal = parseInt(it.q) || 0;
                if (qTotal > 0) unids[pid] += qTotal;
            });
            const sumaUnids = unids.p1 + unids.p2 + unids.p3;
            const montoDoc = parseFloat(doc.monto) || 0;
            // Si una factura histórica fue guardada solo con el monto en dólares y sin detalle de cantidades,
            // se infiere proporcionalmente a la factura estándar (4080 Vaso 165g, 1740 Vaso 340g, 63 Botella 1/2L = $2460 ref)
            if (sumaUnids === 0 && montoDoc > 0) {
                const factor = montoDoc / 2460;
                unids.p1 = Math.round(4080 * factor);
                unids.p2 = Math.round(1740 * factor);
                unids.p3 = Math.round(63 * factor);
            }
            return unids;
        };

        // ── LIQUIDACIÓN AUTOMÁTICA Y CUADRE AL 100% DE TODAS LAS FACTURAS INGRESADAS HASTA HOY ──
        const liquidacionFacturasConsumidorFinal = useMemo(() => {
            const unidadesFacturadas = { p1: 0, p2: 0, p3: 0 };
            const unidadesConNota = { p1: 0, p2: 0, p3: 0 };
            const unidadesDevueltas = { p1: 0, p2: 0, p3: 0 };

            let totalFacturasHastaHoy = 0;
            let totalMontoFacturasHastaHoy = 0;

            (docsCompra || []).forEach(doc => {
                const fDoc = doc.fecha || today;
                if (fDoc > today) return;
                totalFacturasHastaHoy += 1;
                const unidsDoc = extraerUnidadesDeFactura(doc);
                unidadesFacturadas.p1 += unidsDoc.p1;
                unidadesFacturadas.p2 += unidsDoc.p2;
                unidadesFacturadas.p3 += unidsDoc.p3;

                const montoExplicito = parseFloat(doc.monto) || 0;
                const costoItems = (unidsDoc.p1 * 0.31) + (unidsDoc.p2 * 0.70) + (unidsDoc.p3 * 0.89);
                totalMontoFacturasHastaHoy += (montoExplicito > 0 ? montoExplicito : costoItems);
            });

            let ventaNotasManualesHastaHoy = 0;
            let costoNotasManualesHastaHoy = 0;
            let notasManualesCountHastaHoy = 0;

            (ventasNotas || []).forEach(v => {
                if (v.esConsumidorFinalAuto) return;
                if ((v.fecha || today) > today) return;
                notasManualesCountHastaHoy += 1;
                (v.items || []).forEach(it => {
                    const pid = normalizarIdProducto(it);
                    const prodBase = PRODUCTOS_POLACA.find(p => p.id === pid);
                    const q = parseInt(it.q) || 0;
                    if (pid && q > 0 && prodBase) {
                        unidadesConNota[pid] += q;
                        const pvd = parseFloat(it.pvd) || prodBase.pvd;
                        const c = parseFloat(it.costo) || prodBase.costo;
                        ventaNotasManualesHastaHoy += (Number(it.subtotal) || (q * pvd));
                        costoNotasManualesHastaHoy += (q * c);
                    }
                });
            });

            let totalDevolucionesHastaHoy = 0;
            (docsDevolucion || []).forEach(d => {
                if ((d.fecha || today) > today) return;
                totalDevolucionesHastaHoy += (parseFloat(d.perdidaTotal) || 0);
                (d.items || []).forEach(it => {
                    const pid = normalizarIdProducto(it);
                    if (pid) unidadesDevueltas[pid] += (parseInt(it.q) || 0);
                });
            });

            let totalGastosHastaHoy = 0;
            (docsGasto || []).forEach(g => {
                if ((g.fecha || today) > today) return;
                totalGastosHastaHoy += (parseFloat(g.monto) || 0);
            });

            // Todo lo facturado hasta hoy que no esté en notas individuales ni en devoluciones se registra 100% vendido como Consumidor Final
            const unidadesConsumidorFinal = {
                p1: Math.max(0, unidadesFacturadas.p1 - unidadesConNota.p1 - unidadesDevueltas.p1),
                p2: Math.max(0, unidadesFacturadas.p2 - unidadesConNota.p2 - unidadesDevueltas.p2),
                p3: Math.max(0, unidadesFacturadas.p3 - unidadesConNota.p3 - unidadesDevueltas.p3)
            };

            const itemsCF = PRODUCTOS_POLACA.map(p => {
                const q = unidadesConsumidorFinal[p.id] || 0;
                const subtotal = parseFloat((q * p.pvd).toFixed(2));
                const subtotalCosto = parseFloat((q * p.costo).toFixed(2));
                const utilidad = parseFloat((subtotal - subtotalCosto).toFixed(2));
                return {
                    id: p.id,
                    codigo: p.codigo,
                    nombre: p.nombre,
                    nombreCorto: p.nombreCorto,
                    peso: p.peso,
                    costo: p.costo,
                    pvd: p.pvd,
                    q,
                    subtotal,
                    subtotalCosto,
                    utilidad
                };
            }).filter(it => it.q > 0);

            const totalUnidadesCF = itemsCF.reduce((a, b) => a + b.q, 0);
            const totalMontoCF = parseFloat(itemsCF.reduce((a, b) => a + b.subtotal, 0).toFixed(2));
            const totalCostoCF = parseFloat(itemsCF.reduce((a, b) => a + b.subtotalCosto, 0).toFixed(2));
            const utilidadBrutaCF = parseFloat((totalMontoCF - totalCostoCF).toFixed(2));

            const notaConsumidorFinalAuto = totalUnidadesCF > 0 ? {
                id: 'cf_auto_facturas_hoy',
                esConsumidorFinalAuto: true,
                numeroNota: 'CF-CUADRE-HOY',
                fecha: today,
                hora: '100% Facturas Vendido',
                cliente: 'Consumidor Final (Cuadre Total Facturas)',
                ciudad: 'Todo Vendido Hasta Hoy',
                totalUnidades: totalUnidadesCF,
                totalMonto: totalMontoCF,
                totalCosto: totalCostoCF,
                utilidadBruta: utilidadBrutaCF,
                items: itemsCF
            } : null;

            // Totales acumulados de TODO el producto vendido hasta hoy (Notas de Venta + Consumidor Final)
            const unidadesTotalesVendidasHastaHoy = {
                p1: unidadesConNota.p1 + unidadesConsumidorFinal.p1,
                p2: unidadesConNota.p2 + unidadesConsumidorFinal.p2,
                p3: unidadesConNota.p3 + unidadesConsumidorFinal.p3
            };
            const totalUnidadesVendidasHastaHoy = unidadesTotalesVendidasHastaHoy.p1 + unidadesTotalesVendidasHastaHoy.p2 + unidadesTotalesVendidasHastaHoy.p3;
            const ventaTotalHastaHoy = parseFloat((ventaNotasManualesHastaHoy + totalMontoCF).toFixed(2));
            const costoTotalVendidoHastaHoy = parseFloat((costoNotasManualesHastaHoy + totalCostoCF).toFixed(2));
            const utilidadBrutaGanadaHastaHoy = parseFloat((ventaTotalHastaHoy - costoTotalVendidoHastaHoy).toFixed(2));
            totalMontoFacturasHastaHoy = parseFloat(totalMontoFacturasHastaHoy.toFixed(2));
            totalGastosHastaHoy = parseFloat(totalGastosHastaHoy.toFixed(2));
            totalDevolucionesHastaHoy = parseFloat(totalDevolucionesHastaHoy.toFixed(2));
            const utilidadNetaGanadaHastaHoy = parseFloat((utilidadBrutaGanadaHastaHoy - totalGastosHastaHoy - totalDevolucionesHastaHoy).toFixed(2));

            return {
                unidadesFacturadas,
                unidadesConNota,
                unidadesDevueltas,
                unidadesConsumidorFinal,
                unidadesTotalesVendidasHastaHoy,
                totalFacturasHastaHoy,
                totalMontoFacturasHastaHoy,
                notasManualesCountHastaHoy,
                ventaNotasManualesHastaHoy: parseFloat(ventaNotasManualesHastaHoy.toFixed(2)),
                costoNotasManualesHastaHoy: parseFloat(costoNotasManualesHastaHoy.toFixed(2)),
                totalUnidadesFacturadas: unidadesFacturadas.p1 + unidadesFacturadas.p2 + unidadesFacturadas.p3,
                totalUnidadesConNota: unidadesConNota.p1 + unidadesConNota.p2 + unidadesConNota.p3,
                totalUnidadesDevueltas: unidadesDevueltas.p1 + unidadesDevueltas.p2 + unidadesDevueltas.p3,
                totalUnidadesVendidasHastaHoy,
                totalUnidadesCF,
                totalMontoCF,
                totalCostoCF,
                utilidadBrutaCF,
                ventaTotalHastaHoy,
                costoTotalVendidoHastaHoy,
                utilidadBrutaGanadaHastaHoy,
                totalGastosHastaHoy,
                totalDevolucionesHastaHoy,
                utilidadNetaGanadaHastaHoy,
                notaConsumidorFinalAuto
            };
        }, [docsCompra, ventasNotas, docsDevolucion, docsGasto, today]);

        const asentarCuadreConsumidorFinalEnFirme = async () => {
            const cf = liquidacionFacturasConsumidorFinal.notaConsumidorFinalAuto;
            if (!cf || cf.totalUnidades <= 0) {
                mostrarAviso("✓ Todo el producto de las facturas ya está 100% registrado en notas de venta.");
                return;
            }
            const semanaInfo = obtenerSemanaDeFecha(today);
            const localId = 'vn_cuadre_' + Date.now();
            const notaFirme = {
                id: localId,
                localId,
                firestoreId: localId,
                numeroNota: `NV-CUADRE-${today.replace(/-/g, '')}`,
                fecha: today,
                hora: new Date().toLocaleTimeString('es-EC', { hour: '2-digit', minute: '2-digit' }),
                timestamp: Date.now(),
                semanaClave: semanaInfo.clave,
                semanaEtiqueta: semanaInfo.etiqueta,
                rutaDia: rutaHoy.nombre,
                cliente: 'Consumidor Final (Cuadre Facturas Hasta Hoy)',
                ciudad: 'Ruta Andrés Cárdenas',
                direccion: 'Cuadre Total Hasta Hoy',
                totalUnidades: cf.totalUnidades,
                totalMonto: cf.totalMonto,
                totalCosto: cf.totalCosto,
                utilidadBruta: cf.utilidadBruta,
                items: cf.items,
                esCuadreFirme: true,
                createdAt: new Date().toISOString()
            };
            setVentasNotas(prev => {
                const nuevaLista = [notaFirme, ...prev];
                try { localStorage.setItem('austropolaca_ventas_notas_v1', JSON.stringify(nuevaLista)); } catch(e) {}
                return nuevaLista;
            });
            try {
                if (window.appDb && window.appId && window.FB) {
                    const colRef = FB.collection(window.appDb, 'artifacts', window.appId, 'public', 'data', 'ventasNotas');
                    await FB.addDoc(colRef, notaFirme);
                }
            } catch(e) {}
            mostrarAviso(`✓ Cuadre asentado en firme: ${cf.totalUnidades} u. vendidas • $${cf.totalMonto.toFixed(2)}`);
        };

        const ventasNotasEfectivas = useMemo(() => {
            const manuales = (ventasNotas || []).filter(v => !v.esConsumidorFinalAuto);
            if (liquidacionFacturasConsumidorFinal.notaConsumidorFinalAuto) {
                return [liquidacionFacturasConsumidorFinal.notaConsumidorFinalAuto, ...manuales];
            }
            return manuales;
        }, [ventasNotas, liquidacionFacturasConsumidorFinal]);

        // ── PANTALLA ADJUNTA EN TIEMPO REAL: SUMA DE NOTAS DE VENTA, PRODUCTO VENDIDO Y VALOR COBRADO ──
        const resumenTiempoRealAdjunto = useMemo(() => {
            const semActual = obtenerSemanaDeFecha(today);
            const mesActual = today.substring(0, 7);

            const fuenteBase = incluirCFEnAdjunta
                ? ventasNotasEfectivas
                : (ventasNotas || []).filter(v => !v.esConsumidorFinalAuto);

            const notasFiltradas = fuenteBase.filter(v => {
                const f = v.fecha || today;
                if (filtroPantallaAdjunta === 'hoy') return f === (formNota.fecha || today);
                if (filtroPantallaAdjunta === 'semana') return f >= semActual.inicio && f <= semActual.fin;
                if (filtroPantallaAdjunta === 'mes') return f.startsWith(mesActual);
                return true;
            });

            const porProducto = PRODUCTOS_POLACA.map(p => {
                let unidadesVendidas = 0;
                let valorCobrado = 0;
                let costoTotal = 0;
                notasFiltradas.forEach(v => {
                    (v.items || []).forEach(it => {
                        if (normalizarIdProducto(it) === p.id) {
                            const q = parseInt(it.q) || 0;
                            const pvd = parseFloat(it.pvd) || p.pvd;
                            const sub = Number(it.subtotal) || (q * pvd);
                            unidadesVendidas += q;
                            valorCobrado += sub;
                            costoTotal += q * p.costo;
                        }
                    });
                });
                valorCobrado = parseFloat(valorCobrado.toFixed(2));
                costoTotal = parseFloat(costoTotal.toFixed(2));
                const utilidad = parseFloat((valorCobrado - costoTotal).toFixed(2));
                return {
                    ...p,
                    unidadesVendidas,
                    valorCobrado,
                    costoTotal,
                    utilidad
                };
            });

            const totalUnidadesVendidas = porProducto.reduce((a, b) => a + b.unidadesVendidas, 0);
            const totalValorCobrado = parseFloat(porProducto.reduce((a, b) => a + b.valorCobrado, 0).toFixed(2));
            const totalCostoVendido = parseFloat(porProducto.reduce((a, b) => a + b.costoTotal, 0).toFixed(2));
            const totalUtilidadVenta = parseFloat((totalValorCobrado - totalCostoVendido).toFixed(2));

            return {
                notas: notasFiltradas,
                porProducto,
                totalNotas: notasFiltradas.length,
                totalUnidadesVendidas,
                totalValorCobrado,
                totalCostoVendido,
                totalUtilidadVenta
            };
        }, [ventasNotas, ventasNotasEfectivas, incluirCFEnAdjunta, filtroPantallaAdjunta, formNota.fecha, today]);

        // ═══════════════════════════════════════════════════════════════════════════
        // 2. HISTORIAL SEMANAL DE CLIENTES (REGISTRO AUTOMÁTICO DESDE NOTAS DE VENTA)
        // ═══════════════════════════════════════════════════════════════════════════
        const [busquedaCliente, setBusquedaCliente] = useState('');
        const [filtroSemanaCliente, setFiltroSemanaCliente] = useState('todas');

        const historialClientesData = useMemo(() => {
            const notasReales = (ventasNotas || []).filter(v => !v.esConsumidorFinalAuto);
            const semanasMap = {};
            const clientesMap = {};

            notasReales.forEach(v => {
                const f = v.fecha || today;
                const sem = obtenerSemanaDeFecha(f);
                if (!semanasMap[sem.clave]) {
                    semanasMap[sem.clave] = {
                        ...sem,
                        totalVenta: 0,
                        totalUnidades: 0,
                        notasCount: 0
                    };
                }
                semanasMap[sem.clave].totalVenta += (parseFloat(v.totalMonto) || 0);
                semanasMap[sem.clave].totalUnidades += (parseInt(v.totalUnidades) || 0);
                semanasMap[sem.clave].notasCount += 1;

                if (filtroSemanaCliente !== 'todas' && sem.clave !== filtroSemanaCliente) return;

                const nombre = (v.cliente || 'Consumidor Final').trim();
                const ciudad = (v.ciudad || v.direccion || 'Ruta').trim();
                const key = `${nombre.toLowerCase()}__${ciudad.toLowerCase()}`;

                if (!clientesMap[key]) {
                    clientesMap[key] = {
                        key,
                        nombre,
                        ciudad,
                        totalComprado: 0,
                        totalUnidades: 0,
                        unidadesPorProd: { p1: 0, p2: 0, p3: 0 },
                        notasCount: 0,
                        ultimaFecha: f,
                        semanas: {},
                        notas: []
                    };
                }

                const cli = clientesMap[key];
                const montoNota = parseFloat(v.totalMonto) || 0;
                const unidsNota = parseInt(v.totalUnidades) || 0;
                cli.totalComprado = parseFloat((cli.totalComprado + montoNota).toFixed(2));
                cli.totalUnidades += unidsNota;
                cli.notasCount += 1;
                if (f > cli.ultimaFecha) cli.ultimaFecha = f;

                (v.items || []).forEach(it => {
                    const pid = normalizarIdProducto(it);
                    if (pid) cli.unidadesPorProd[pid] += (parseInt(it.q) || 0);
                });

                if (!cli.semanas[sem.clave]) {
                    cli.semanas[sem.clave] = {
                        ...sem,
                        monto: 0,
                        unidades: 0,
                        notas: 0
                    };
                }
                cli.semanas[sem.clave].monto = parseFloat((cli.semanas[sem.clave].monto + montoNota).toFixed(2));
                cli.semanas[sem.clave].unidades += unidsNota;
                cli.semanas[sem.clave].notas += 1;
                cli.notas.push(v);
            });

            const listaSemanas = Object.values(semanasMap).sort((a, b) => b.inicio.localeCompare(a.inicio));
            let listaClientes = Object.values(clientesMap).sort((a, b) => b.totalComprado - a.totalComprado);

            if (busquedaCliente.trim()) {
                const q = busquedaCliente.toLowerCase();
                listaClientes = listaClientes.filter(c =>
                    c.nombre.toLowerCase().includes(q) || c.ciudad.toLowerCase().includes(q)
                );
            }

            return {
                listaSemanas,
                listaClientes
            };
        }, [ventasNotas, filtroSemanaCliente, busquedaCliente, today]);

        // Clientes frecuentes únicos para selección de 1 toque en la Nota de Venta
        const clientesRapidosSugeridos = useMemo(() => {
            const map = {};
            (ventasNotas || []).filter(v => !v.esConsumidorFinalAuto).forEach(v => {
                const nom = (v.cliente || '').trim();
                if (!nom || nom.toLowerCase() === 'consumidor final') return;
                const key = nom.toLowerCase();
                if (!map[key]) {
                    map[key] = {
                        nombre: nom,
                        ciudad: v.ciudad || v.direccion || ''
                    };
                }
            });
            return Object.values(map).slice(0, 14);
        }, [ventasNotas]);

        // ═══════════════════════════════════════════════════════════════════════════
        // 3. DEVOLUCIONES AL FINAL DEL DÍA (UN SOLO INGRESO DEL TOTAL DIARIO)
        // ═══════════════════════════════════════════════════════════════════════════
        const [formDevDia, setFormDevDia] = useState({
            fecha: today,
            p1: 0,
            p2: 0,
            p3: 0
        });

        const cambiarCantDevDia = (id, delta) => {
            setFormDevDia(prev => ({
                ...prev,
                [id]: Math.max(0, (parseInt(prev[id]) || 0) + delta)
            }));
        };

        const fijarCantDevDia = (id, val) => {
            const num = val === '' ? 0 : Math.max(0, parseInt(val) || 0);
            setFormDevDia(prev => ({ ...prev, [id]: num }));
        };

        const totalesFormDevDia = useMemo(() => {
            let totalUnidades = 0;
            let perdidaVenta = 0;
            let perdidaCosto = 0;
            PRODUCTOS_POLACA.forEach(p => {
                const q = parseInt(formDevDia[p.id]) || 0;
                totalUnidades += q;
                perdidaVenta += q * p.pvd;
                perdidaCosto += q * p.costo;

                perdidaVenta: parseFloat(perdidaVenta.toFixed(2)),
                perdidaCosto: parseFloat(perdidaCosto.toFixed(2))

                };

                fecha: fechaCierre,
                cliente: 'Total Devoluciones Fin del Día',
                vendedor: `Andrés Cárdenas (${rutaDia.nombre})`,
                rutaId: rutaDia.id,
                rutaNombre: rutaDia.nombre,

            };

            setIsSaving(true);
            try {

                setFormDevDia(prev => ({ ...prev, p1: 0, p2: 0, p3: 0 }));

                setError("Error al guardar devolución: " + (e.message || e));

        const [editandoFacturaId, setEditandoFacturaId] = useState(null);

        const [formFactura, setFormFactura] = useState(() => ({

            monto: 0,
            notas: '',
            archivo: null,
            nombreArchivo: '',
            tipoArchivo: ''
        }));

        const recalcularTotalesFactura = (items, montoOverride = null) => {
            const itemsCalc = items.map(it => {
                const q = Math.max(0, parseInt(it.q) || 0);
                const c = parseFloat(it.costo) || 0;
                return {
                    ...it,
                    q,
                    costo: c,
                    total: parseFloat((q * c).toFixed(2))
                };
            });
            const sumaItems = parseFloat(itemsCalc.reduce((a, b) => a + b.total, 0).toFixed(2));
            const montoFinal = (montoOverride !== null && !isNaN(montoOverride) && montoOverride > 0) ? parseFloat(montoOverride.toFixed(2)) : sumaItems;
            const subtotal = parseFloat((montoFinal / 1.15).toFixed(2));
            const iva15 = parseFloat((montoFinal - subtotal).toFixed(2));
            return { items: itemsCalc, subtotal, iva15, monto: montoFinal };
        };

        const cambiarCantidadItemFactura = (id, qVal) => {
            const q = qVal === '' ? 0 : Math.max(0, parseInt(qVal) || 0);
            setFormFactura(prev => {
                const nuevos = prev.items.map(it => it.id === id ? { ...it, q } : it);
                const calc = recalcularTotalesFactura(nuevos);
                return { ...prev, ...calc };
            });
        };

        const cambiarCostoItemFactura = (id, costoVal) => {
            const costo = Math.max(0, parseFloat(String(costoVal).replace(',', '.')) || 0);
            setFormFactura(prev => {
                const nuevos = prev.items.map(it => it.id === id ? { ...it, costo } : it);
                const calc = recalcularTotalesFactura(nuevos);
                return { ...prev, ...calc };
            });
        };

        // Procesar PDF o Imagen subida y extraer automáticamente datos y valores exactos del PDF
        const manejarSubidaPdfFactura = async (e) => {
            const file = e.target.files?.[0];
            if (!file) return;
            setLeyendoPdf(true);
            try {
                const isPdf = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');
                const readerDataUrl = new FileReader();
                const base64Promise = new Promise((resolve, reject) => {
                    readerDataUrl.onloadend = () => resolve(readerDataUrl.result);
                    readerDataUrl.onerror = reject;
                    readerDataUrl.readAsDataURL(file);
                });
                const base64 = await base64Promise;

                let datosExtraidos = null;
                if (isPdf) {
                    const arrayBuf = await file.arrayBuffer();
                    const textoPdf = await extraerTextoDePDF(arrayBuf);
                    if (textoPdf && textoPdf.trim().length > 10) {
                        datosExtraidos = parsearTextoFacturaPolaca(textoPdf, formFactura.fecha || today);
                    }
                }

                setFormFactura(prev => {
                    const tieneCantidadesExtraidas = datosExtraidos && (datosExtraidos.qP1 !== null || datosExtraidos.qP2 !== null || datosExtraidos.qP3 !== null);
                    const nuevosItems = prev.items.map(it => {
                        if (!tieneCantidadesExtraidas) return it;
                        if (it.id === 'p1' && datosExtraidos.qP1 !== null) return { ...it, q: datosExtraidos.qP1 };
                        if (it.id === 'p2' && datosExtraidos.qP2 !== null) return { ...it, q: datosExtraidos.qP2 };
                        if (it.id === 'p3' && datosExtraidos.qP3 !== null) return { ...it, q: datosExtraidos.qP3 };
                        return it;
                    });
                    const calc = recalcularTotalesFactura(nuevosItems, datosExtraidos?.montoExplicito || null);
                    return {
                        ...prev,
                        fecha: datosExtraidos?.fecha || prev.fecha || today,
                        numFact: datosExtraidos?.numFact || prev.numFact || file.name.replace(/\.[^.]+$/, ''),
                        ...calc,
                        archivo: base64,
                        nombreArchivo: file.name,
                        tipoArchivo: isPdf ? 'pdf' : 'image'
                    };
                });

                if (datosExtraidos && (datosExtraidos.numFact || datosExtraidos.qP1 !== null || datosExtraidos.qP2 !== null || datosExtraidos.qP3 !== null)) {
                    mostrarAviso(`✓ Datos y valores extraídos automáticamente del PDF: ${file.name}`);
                } else {
                    mostrarAviso(`✓ Archivo ${file.name} cargado. Verifica o ingresa las cantidades.`);
                }
            } catch (err) {
                setError("Error al leer el archivo de factura: " + (err.message || err));
            } finally {
                setLeyendoPdf(false);
            }
        };

        const aplicarTextoPegadoFactura = () => {
            if (!textoPegadoFactura.trim()) return;
            const datos = parsearTextoFacturaPolaca(textoPegadoFactura, formFactura.fecha || today);
            setFormFactura(prev => {
                const nuevosItems = prev.items.map(it => {
                    if (it.id === 'p1' && datos.qP1 !== null) return { ...it, q: datos.qP1 };
                    if (it.id === 'p2' && datos.qP2 !== null) return { ...it, q: datos.qP2 };
                    if (it.id === 'p3' && datos.qP3 !== null) return { ...it, q: datos.qP3 };
                    return it;
                });
                const calc = recalcularTotalesFactura(nuevosItems, datos.montoExplicito || null);
                return {
                    ...prev,
                    fecha: datos.fecha || prev.fecha,
                    numFact: datos.numFact || prev.numFact,
                    ...calc
                };
            });
            setTextoPegadoFactura('');
            mostrarAviso("✓ Datos copiados aplicados a la factura");
        };

        const cargarPlantillaReferenciaPolaca = () => {
            const itemsRef = crearItemsFacturaVacios(true);
            const calc = recalcularTotalesFactura(itemsRef);
            setFormFactura(prev => ({
                ...prev,
                ...calc,
                notas: 'Factura Avena Polaca - Ruta Andrés Cárdenas'
            }));
            mostrarAviso("✓ Valores de referencia cargados (4080 Vaso 165g, 1740 Vaso 340g, 63 Botella 1/2L)");
        };

        const guardarFacturaCompra = async () => {
            if (isSaving) return;
            const montoVal = parseFloat(formFactura.monto) || 0;
            if (montoVal <= 0) {
                setError("Ingresa las cantidades o el valor total de la factura antes de guardar.");
                return;
            }
            const numFactFinal = (formFactura.numFact || '').trim() || `FAC-${Date.now().toString().slice(-6)}`;

            const payload = {
                fecha: formFactura.fecha || today,
                fechaVence: formFactura.fecha || today,
                numFact: numFactFinal,
                proveedor: PROVEEDOR_UNICO.razonSocial,
                rucProveedor: PROVEEDOR_UNICO.ruc,
                destino: 'andres',
                items: formFactura.items,
                subtotal: parseFloat((formFactura.subtotal || (montoVal / 1.15)).toFixed(2)),
                iva15: parseFloat((formFactura.iva15 || (montoVal - (montoVal / 1.15))).toFixed(2)),
                monto: parseFloat(montoVal.toFixed(2)),
                notas: formFactura.notas || 'Ruta Andrés Cárdenas',
                archivo: formFactura.archivo || null,
                nombreArchivo: formFactura.nombreArchivo || '',
                tipoArchivo: formFactura.tipoArchivo || '',
                updatedAt: new Date().toISOString()
            };

            setIsSaving(true);
            try {
                if (editandoFacturaId) {
                    if (window.appDb && window.appId && window.FB) {
                        const ref = FB.doc(window.appDb, 'artifacts', window.appId, 'public', 'data', 'docsCompra', editandoFacturaId);
                        await FB.updateDoc(ref, payload);
                    } else {
                        setDocsCompra(prev => prev.map(d => d.id === editandoFacturaId ? { ...d, ...payload } : d));
                    }
                    setEditandoFacturaId(null);
                    mostrarAviso(`✓ Factura ${numFactFinal} actualizada ($${montoVal.toFixed(2)})`);
                } else {
                    const nuevoDoc = {
                        ...payload,
                        montoPagado: 0,
                        estadoPago: 'pendiente',
                        pagos: [],
                        createdAt: new Date().toISOString()
                    };
                    if (window.appDb && window.appId && window.FB) {
                        const colRef = FB.collection(window.appDb, 'artifacts', window.appId, 'public', 'data', 'docsCompra');
                        await FB.addDoc(colRef, nuevoDoc);
                    } else {
                        setDocsCompra(prev => [{ id: 'fac_' + Date.now(), ...nuevoDoc }, ...prev]);
                    }
                    mostrarAviso(`✓ Factura ${numFactFinal} guardada ($${montoVal.toFixed(2)})`);
                }

                setFormFactura({
                    fecha: today,
                    numFact: '',
                    proveedor: PROVEEDOR_UNICO.razonSocial,
                    rucProveedor: PROVEEDOR_UNICO.ruc,
                    items: crearItemsFacturaVacios(false),
                    subtotal: 0,
                    iva15: 0,
                    monto: 0,
                    notas: '',
                    archivo: null,
                    nombreArchivo: '',
                    tipoArchivo: ''
                });
            } catch (e) {
                setError("Error al guardar factura: " + (e.message || e));
            } finally {
                setIsSaving(false);
            }
        };

        const editarFacturaCompra = (fac) => {
            if (!fac) return;
            setEditandoFacturaId(fac.id);
            const itemsCargados = PRODUCTOS_POLACA.map(p => {
                const it = (fac.items || []).find(x => normalizarIdProducto(x) === p.id);
                const q = it ? (parseInt(it.q) || 0) : 0;
                const c = it ? (parseFloat(it.costo) || p.costo) : p.costo;
                return {
                    id: p.id,
                    codigo: p.codigo,
                    nombre: p.nombre,
                    nombreCorto: p.nombreCorto,
                    q,
                    costo: c,
                    pvd: p.pvd,
                    total: parseFloat((q * c).toFixed(2))
                };
            });
            setFormFactura({
                fecha: fac.fecha || today,
                numFact: fac.numFact || '',
                proveedor: fac.proveedor || PROVEEDOR_UNICO.razonSocial,
                rucProveedor: fac.rucProveedor || PROVEEDOR_UNICO.ruc,
                items: itemsCargados,
                subtotal: parseFloat(fac.subtotal || 0),
                iva15: parseFloat(fac.iva15 || 0),
                monto: parseFloat(fac.monto || 0),
                notas: fac.notas || '',
                archivo: fac.archivo || null,

                tipoArchivo: fac.tipoArchivo || ''
            });
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        const eliminarFacturaCompra = async (id) => {
            if (!confirm("¿Eliminar esta factura de compra de forma definitiva?")) return;
            try {
                if (window.appDb && window.appId && window.FB) {
                    await FB.deleteDoc(FB.doc(window.appDb, 'artifacts', window.appId, 'public', 'data', 'docsCompra', id));
                } else {
                    setDocsCompra(prev => prev.filter(d => d.id !== id));
                }
                mostrarAviso("✓ Factura eliminada");
            } catch(e) {}
        };

        const guardarPagoFactura = async () => {
            if (!modalPagoCompra || isSaving) return;
            const montoPagar = parseFloat(String(formPago.monto).replace(',', '.'));
            if (isNaN(montoPagar) || montoPagar <= 0) {
                setError("Ingresa un monto de pago válido.");

            }
            const nuevoPago = {
                id: 'pago_' + Date.now(),
                fecha: formPago.fecha || today,
                monto: parseFloat(montoPagar.toFixed(2)),
                metodo: formPago.metodo || 'transferencia',
                referenciaBanco: formPago.referencia || '',
                detalleTextoEfectivo: formPago.referencia || '',

            };
            const pagosActualizados = [...(modalPagoCompra.pagos || []), nuevoPago];

            const montoFactura = parseFloat(modalPagoCompra.monto) || 0;
            const estadoPago = totalPagado >= (montoFactura - 0.05) ? 'cancelado' : 'abonado';

            setIsSaving(true);
            try {
                if (window.appDb && window.appId && window.FB) {
                    const ref = FB.doc(window.appDb, 'artifacts', window.appId, 'public', 'data', 'docsCompra', modalPagoCompra.id);

                    setDocsCompra(prev => prev.map(d => d.id === modalPagoCompra.id ? {
                        ...d,

                        montoPagado: totalPagado,
                        estadoPago
                    } : d));
                }
                setModalPagoCompra(null);
                setFormPago({ fecha: today, monto: '', metodo: 'transferencia', referencia: '' });
                mostrarAviso(`✓ Pago de $${montoPagar.toFixed(2)} registrado en Factura ${modalPagoCompra.numFact}`);
            } catch(e) {
                setError("Error al registrar pago: " + (e.message || e));
            } finally {
                setIsSaving(false);
            }
        };

        const abrirPdfEnPestana = (base64) => {
            if (!base64) return;
            try {
                if (base64.startsWith('data:image/')) {
                    const w = window.open('');
                    if (w) w.document.write(`<img src="${base64}" style="max-width:100%;margin:auto;display:block;" />`);
                    return;
                }
                const base64Data = base64.includes(',') ? base64.split(',')[1] : base64;
                const byteCharacters = atob(base64Data);
                const byteNumbers = new Array(byteCharacters.length);
                for (let i = 0; i < byteCharacters.length; i++) {
                    byteNumbers[i] = byteCharacters.charCodeAt(i);
                }
                const byteArray = new Uint8Array(byteNumbers);
                const blob = new Blob([byteArray], { type: 'application/pdf' });
                window.open(URL.createObjectURL(blob), '_blank');
            } catch(e) {
                alert("No se pudo abrir el documento adjunto.");
            }
        };

        // ── FILTRO DE FACTURAS POR RANGO DE FECHAS Y SUMA DEL TOTAL DE FACTURAS ──
        const [fechaFacturaDesde, setFechaFacturaDesde] = useState('');
        const [fechaFacturaHasta, setFechaFacturaHasta] = useState(today);
        const [facturasSeleccionadasIds, setFacturasSeleccionadasIds] = useState([]);

        const toggleSeleccionFactura = (id) => {
            setFacturasSeleccionadasIds(prev =>
                prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]
            );
        };

        const resumenFacturasRango = useMemo(() => {
            const listaOrdenada = [...(docsCompra || [])].sort((a, b) => (b.fecha || '').localeCompare(a.fecha || ''));
            const enRangoFecha = listaOrdenada.filter(fac => {
                const f = fac.fecha || today;
                if (fechaFacturaDesde && f < fechaFacturaDesde) return false;
                if (fechaFacturaHasta && f > fechaFacturaHasta) return false;
                return true;
            });

            // Si el usuario marcó casillas específicas dentro del rango, sumamos esas; si no marcó ninguna, sumamos todas las del rango de fechas
            const idsActivosEnRango = facturasSeleccionadasIds.filter(id => enRangoFecha.some(f => f.id === id));
            const facturasParaSumar = idsActivosEnRango.length > 0
                ? enRangoFecha.filter(f => idsActivosEnRango.includes(f.id))
                : enRangoFecha;

            let sumaSubtotal = 0;
            let sumaIva = 0;
            let sumaTotalFacturas = 0;
            let sumaPagado = 0;
            let sumaPendiente = 0;
            const unidadesPorProd = { p1: 0, p2: 0, p3: 0 };
            let ventaTotalGenerada = 0;
            let costoTotalProductos = 0;

            facturasParaSumar.forEach(fac => {
                const unids = extraerUnidadesDeFactura(fac);
                unidadesPorProd.p1 += unids.p1;
                unidadesPorProd.p2 += unids.p2;
                unidadesPorProd.p3 += unids.p3;

                const costoItems = (unids.p1 * 0.31) + (unids.p2 * 0.70) + (unids.p3 * 0.89);
                const ventaItems = (unids.p1 * 0.42) + (unids.p2 * 0.84) + (unids.p3 * 1.04);
                costoTotalProductos += costoItems;
                ventaTotalGenerada += ventaItems;

                const totalFac = (parseFloat(fac.monto) || 0) > 0 ? parseFloat(fac.monto) : costoItems;
                const subFac = (parseFloat(fac.subtotal) || 0) > 0 ? parseFloat(fac.subtotal) : (totalFac / 1.15);
                const ivaFac = (parseFloat(fac.iva15) || 0) > 0 ? parseFloat(fac.iva15) : (totalFac - subFac);
                const pagadoFac = (fac.pagos || []).reduce((a, p) => a + (parseFloat(p.monto) || 0), 0);
                const pendFac = Math.max(0, totalFac - pagadoFac);

                sumaTotalFacturas += totalFac;
                sumaSubtotal += subFac;
                sumaIva += ivaFac;
                sumaPagado += pagadoFac;
                sumaPendiente += pendFac;
            });

            const totalUnidades = unidadesPorProd.p1 + unidadesPorProd.p2 + unidadesPorProd.p3;
            const utilidadGanadaFacturas = ventaTotalGenerada - costoTotalProductos;

            return {
                facturasEnRango: enRangoFecha,
                facturasSumadas: facturasParaSumar,
                usandoSeleccionManual: idsActivosEnRango.length > 0,
                cantidadEnRango: enRangoFecha.length,
                cantidadSumadas: facturasParaSumar.length,
                sumaSubtotal: parseFloat(sumaSubtotal.toFixed(2)),
                sumaIva: parseFloat(sumaIva.toFixed(2)),
                sumaTotalFacturas: parseFloat(sumaTotalFacturas.toFixed(2)),
                sumaPagado: parseFloat(sumaPagado.toFixed(2)),
                sumaPendiente: parseFloat(sumaPendiente.toFixed(2)),
                unidadesPorProd,
                totalUnidades,
                ventaTotalGenerada: parseFloat(ventaTotalGenerada.toFixed(2)),
                costoTotalProductos: parseFloat(costoTotalProductos.toFixed(2)),
                utilidadGanadaFacturas: parseFloat(utilidadGanadaFacturas.toFixed(2))
            };
        }, [docsCompra, fechaFacturaDesde, fechaFacturaHasta, facturasSeleccionadasIds, today]);

        // ═══════════════════════════════════════════════════════════════════════════
        // 6. CAJA Y UTILIDAD REAL: DIARIA, SEMANAL Y MENSUAL (VENTA, COMPRA, GASTOS)
        // ═══════════════════════════════════════════════════════════════════════════
        const [fechaCajaDia, setFechaCajaDia] = useState(today);
        const [mesCaja, setMesCaja] = useState(today.substring(0, 7));

        const calculosCajaYUtilidad = useMemo(() => {
            const semInfo = obtenerSemanaDeFecha(fechaCajaDia || today);

            // Función auxiliar para calcular métricas exactas en cualquier rango [desde, hasta]
            const calcularEnRango = (desde, hasta, esMensual = false) => {
                const notasRango = (ventasNotasEfectivas || []).filter(v => {
                    const f = v.fecha || today;
                    return f >= desde && f <= hasta;
                });
                const gastosRango = (docsGasto || []).filter(g => {
                    const f = g.fecha || today;
                    return f >= desde && f <= hasta;
                });
                const devsRango = (docsDevolucion || []).filter(d => {
                    const f = d.fecha || today;
                    return f >= desde && f <= hasta;
                });
                const comprasRango = (docsCompra || []).filter(c => {
                    const f = c.fecha || today;
                    return f >= desde && f <= hasta;
                });

                let ventaTotal = 0;
                let costoMercaderiaVendida = 0;
                let unidadesVendidas = 0;
                const porProd = { p1: 0, p2: 0, p3: 0 };

                notasRango.forEach(v => {
                    (v.items || []).forEach(it => {
                        const pid = normalizarIdProducto(it);
                        const prodBase = PRODUCTOS_POLACA.find(p => p.id === pid);
                        const q = parseInt(it.q) || 0;
                        if (q > 0 && prodBase) {
                            const pvd = parseFloat(it.pvd) || prodBase.pvd;
                            const c = parseFloat(it.costo) || prodBase.costo;
                            unidadesVendidas += q;
                            porProd[pid] = (porProd[pid] || 0) + q;
                            ventaTotal += (Number(it.subtotal) || (q * pvd));
                            costoMercaderiaVendida += (q * c);
                        }
                    });
                });

                ventaTotal = parseFloat(ventaTotal.toFixed(2));
                costoMercaderiaVendida = parseFloat(costoMercaderiaVendida.toFixed(2));
                const utilidadBrutaVenta = parseFloat((ventaTotal - costoMercaderiaVendida).toFixed(2));

                const totalGastosManuales = parseFloat(gastosRango.reduce((a, g) => a + (parseFloat(g.monto) || 0), 0).toFixed(2));
                const totalDevoluciones = parseFloat(devsRango.reduce((a, d) => a + (parseFloat(d.perdidaTotal) || 0), 0).toFixed(2));
                const unidadesDevueltas = devsRango.reduce((a, d) => a + (parseInt(d.totalUnidades) || 0), 0);

                const totalComprasFacturas = parseFloat(comprasRango.reduce((a, c) => a + (parseFloat(c.monto) || 0), 0).toFixed(2));
                let totalPagosFacturas = 0;
                (docsCompra || []).forEach(c => {
                    (c.pagos || []).forEach(p => {
                        if ((p.fecha || '') >= desde && (p.fecha || '') <= hasta) {
                            totalPagosFacturas += (parseFloat(p.monto) || 0);
                        }
                    });
                });
                totalPagosFacturas = parseFloat(totalPagosFacturas.toFixed(2));

                const creditoVehiculo = esMensual ? CREDITO_VEHICULO_FIJO : 0;
                const utilidadNetaReal = parseFloat((utilidadBrutaVenta - totalGastosManuales - totalDevoluciones - creditoVehiculo).toFixed(2));
                const efectivoCaja = parseFloat((ventaTotal - totalGastosManuales - totalDevoluciones - totalPagosFacturas).toFixed(2));

                return {
                    desde,
                    hasta,
                    ventaTotal,
                    costoMercaderiaVendida,
                    utilidadBrutaVenta,
                    unidadesVendidas,
                    porProd,
                    totalGastosManuales,
                    totalDevoluciones,
                    unidadesDevueltas,
                    totalComprasFacturas,
                    totalPagosFacturas,
                    creditoVehiculo,
                    utilidadNetaReal,
                    efectivoCaja,
                    notasCount: notasRango.length,
                    gastosLista: gastosRango,
                    devsLista: devsRango,
                    comprasLista: comprasRango
                };
            };

            const diario = calcularEnRango(fechaCajaDia, fechaCajaDia, false);
            const semanal = calcularEnRango(semInfo.inicio, semInfo.fin, false);
            const mensual = calcularEnRango(`${mesCaja}-01`, `${mesCaja}-31`, true);

            return {
                semInfo,
                diario,
                semanal,
                mensual
            };
        }, [ventasNotasEfectivas, docsGasto, docsDevolucion, docsCompra, fechaCajaDia, mesCaja, today]);

        // ── COMPARTIR NOTA POR WHATSAPP Y DESCARGAR PDF ──
        const compartirNotaWhatsApp = (venta) => {
            if (!venta) return;
            let msg = `*NOTA DE VENTA - ANDRÉS CÁRDENAS (AVENA POLACA)*\n`;
            msg += `📅 *Fecha:* ${venta.fecha}\n`;
            msg += `👤 *Cliente:* ${venta.cliente}\n`;
            msg += `📍 *Ciudad/Ruta:* ${venta.ciudad || ''}\n\n`;
            msg += `*DETALLE DE PRODUCTOS:*\n`;
            (venta.items || []).forEach(it => {
                if ((parseInt(it.q) || 0) > 0) {
                    const sub = Number(it.subtotal) || (it.q * it.pvd);
                    msg += `• ${it.q}x ${it.nombreCorto || it.nombre} ($${Number(it.pvd).toFixed(2)}) = *$${sub.toFixed(2)}*\n`;
                }
            });
            msg += `\n📦 *Total Unidades:* ${venta.totalUnidades} u.\n`;
            msg += `💰 *VALOR TOTAL A PAGAR:* *$${Number(venta.totalMonto).toFixed(2)}*`;
            window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`, '_blank');
        };

        const descargarPdfNotaVenta = (venta) => {
            const { jsPDF } = window.jspdf || {};
            if (typeof jsPDF !== 'function') return;
            try {
                const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a5' });
                doc.setFillColor(7, 94, 84);
                doc.rect(0, 0, 148, 8, 'F');
                doc.setFont('helvetica', 'bold');
                doc.setFontSize(14);
                doc.setTextColor(7, 94, 84);
                doc.text("ANDRÉS CÁRDENAS - AVENA POLACA", 10, 16);

                doc.text(`Nota: ${venta.numeroNota || 'NV'}   |   Fecha: ${venta.fecha}`, 10, 23);
                doc.text(`Cliente: ${venta.cliente}   |   Ciudad: ${venta.ciudad || ''}`, 10, 29);

                const rows = (venta.items || []).filter(i => i.q > 0).map(it => [
                    it.nombreCorto || it.nombre,
                    `${it.q} u.`,
                    `$${Number(it.pvd).toFixed(2)}`,
                    `$${(Number(it.subtotal) || (it.q * it.pvd)).toFixed(2)}`
                ]);

                doc.autoTable({
                    startY: 34,
                    head: [['Producto', 'Cantidad', 'Precio Unit.', 'Subtotal']],
                    body: rows,
                    theme: 'grid',
                    headStyles: { fillColor: [7, 94, 84] }
                });

                const y = (doc.lastAutoTable?.finalY || 75) + 8;
                doc.setFontSize(12);
                doc.setFont('helvetica', 'bold');
                doc.setTextColor(7, 94, 84);
                doc.text(`TOTAL COBRADO: $${Number(venta.totalMonto).toFixed(2)} (${venta.totalUnidades} u.)`, 10, y);
                doc.save(`Nota_${venta.cliente}_${venta.fecha}.pdf`);
            } catch(e) {}
        };

        const exportarCajaExcel = () => {
            if (typeof XLSX === 'undefined') return;
            const wb = XLSX.utils.book_new();
            const { diario, semanal, mensual } = calculosCajaYUtilidad;
            const resumen = [
                ["ANDRÉS CÁRDENAS - REPORTE REAL DE CAJA Y UTILIDAD (AVENA POLACA)"],
                ["Fecha de Emisión:", new Date().toLocaleString()],
                [],
                ["CONCEPTO", `DIARIO (${fechaCajaDia})`, `SEMANAL (${semanal.desde} a ${semanal.hasta})`, `MENSUAL (${mesCaja})`],
                ["Unidades Vendidas (u.)", diario.unidadesVendidas, semanal.unidadesVendidas, mensual.unidadesVendidas],
                ["Venta Total Cobrada ($)", diario.ventaTotal, semanal.ventaTotal, mensual.ventaTotal],
                ["Costo Mercadería Vendida ($)", diario.costoMercaderiaVendida, semanal.costoMercaderiaVendida, mensual.costoMercaderiaVendida],
                ["Utilidad Bruta de Venta ($)", diario.utilidadBrutaVenta, semanal.utilidadBrutaVenta, mensual.utilidadBrutaVenta],
                ["(-) Gastos Operativos Manuales ($)", diario.totalGastosManuales, semanal.totalGastosManuales, mensual.totalGastosManuales],
                ["(-) Devoluciones ($)", diario.totalDevoluciones, semanal.totalDevoluciones, mensual.totalDevoluciones],
                ["(-) Crédito Vehículo Fijo ($436/mes)", 0, 0, mensual.creditoVehiculo],
                ["(=) UTILIDAD NETA REAL ($)", diario.utilidadNetaReal, semanal.utilidadNetaReal, mensual.utilidadNetaReal],
                ["Facturas de Compra Registradas ($)", diario.totalComprasFacturas, semanal.totalComprasFacturas, mensual.totalComprasFacturas]
            ];
            XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(resumen), "Utilidad Real");
            XLSX.writeFile(wb, `Caja_Utilidad_AndresCardenas_${today}.xlsx`);
        };

        // ── NAVEGACIÓN PRINCIPAL EN BARRA VERTICAL LATERAL ──
        const tabs = [
            { id: 'notaVenta',    icon: 'zap',         label: '1. Nota de Venta Ágil', badge: `$${resumenTiempoRealAdjunto.totalValorCobrado.toFixed(0)}`, desc: 'Registro rápido + Total en vivo' },
            { id: 'clientes',     icon: 'users',       label: '2. Clientes Semanal',   badge: `${historialClientesData.listaClientes.length}`, desc: 'Historial por semana' },
            { id: 'devoluciones', icon: 'rotate-ccw',  label: '3. Devoluciones Día',   desc: '1 solo ingreso fin del día' },
            { id: 'gastos',       icon: 'receipt',     label: '4. Gastos Ágiles',      desc: 'Fecha, descripción y monto' },
            { id: 'compras',      icon: 'file-text',   label: '5. Facturas y Pagos',   badge: `${docsCompra.length}`, desc: 'Rango de fechas + Suma total' },
            { id: 'caja',         icon: 'trending-up', label: '6. Caja y Utilidad Real', badge: `+$${liquidacionFacturasConsumidorFinal.utilidadBrutaGanadaHastaHoy.toFixed(0)}`, desc: 'Diaria, Semanal, Mensual y Hasta Hoy' }
        ];

        return (
            <div className="min-h-screen flex bg-slate-100 text-slate-900">
                {/* ═══ OVERLAY MÓVIL PARA LA BARRA VERTICAL LATERAL ═══ */}
                {sidebarAbierto && (
                    <div
                        className="fixed inset-0 z-40 bg-slate-950/60 backdrop-blur-xs md:hidden"
                        onClick={() => setSidebarAbierto(false)}
                    />
                )}

                {/* ═══ BARRA VERTICAL LATERAL (SIDEBAR) PARA SELECCIONAR PESTAÑAS ═══ */}
                <aside
                    className={`fixed md:sticky top-0 left-0 z-50 h-screen w-72 bg-[#075E54] text-white shadow-2xl flex flex-col justify-between shrink-0 transition-transform duration-200 ${
                        sidebarAbierto ? 'translate-x-0' : '-translate-x-full md:translate-x-0'
                    }`}
                >
                    <div className="p-4 space-y-4 overflow-y-auto custom-scrollbar flex-1">
                        {/* Cabecera de Marca en la Barra Vertical Lateral */}
                        <div className="flex items-center justify-between gap-2 pb-3 border-b border-white/15">
                            <div className="flex items-center gap-2.5">
                                <div className="w-11 h-11 rounded-2xl bg-white p-0.5 shadow flex items-center justify-center overflow-hidden shrink-0">
                                    <img src="image.jpg" alt="Avena Polaca" className="w-full h-full object-contain" onError={(e) => { e.target.style.display='none'; }} />
                                </div>
                                <div>
                                    <span className="bg-[#25D366] text-[#075E54] text-[9px] font-black px-2 py-0.5 rounded-full uppercase inline-block mb-0.5">
                                        Ruta Única Oficial
                                    </span>
                                    <h1 className="font-black text-base tracking-tight uppercase leading-none">
                                        Andrés Cárdenas
                                    </h1>
                                    <p className="text-[11px] text-emerald-200 font-bold mt-0.5">
                                        Avena Polaca
                                    </p>

                            <button

                                className="md:hidden w-8 h-8 rounded-xl bg-white/15 text-white font-black flex items-center justify-center"
                            >
                                ✕
                            </button>
                        </div>

                        {/* Ruta del Día Actual */}
                        <div className="p-3 rounded-2xl bg-white/10 border border-white/15">

                        {/* Lista Vertical de Pestañas */}

                    {/* Resumen de Cuadre Total Hasta Hoy en el Pie de la Barra Lateral */}
                    <div className="p-4 bg-slate-950/50 border-t border-white/15 space-y-2">

                </aside>

                {/* ═══ CONTENEDOR DERECHO (CABECERA SUPERIOR + CONTENIDO DE LA PESTAÑA ACTIVA) ═══ */}
                <div className="flex-1 flex flex-col min-w-0 pb-20 md:pb-8">
                    <header className="sticky top-0 z-30 bg-[#075E54] md:bg-white text-white md:text-slate-900 shadow-md border-b border-slate-200">
