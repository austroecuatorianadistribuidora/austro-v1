    // ── PROCESAMIENTO INTELIGENTE DE ARCHIVOS (COMPRESIÓN AUTOMÁTICA DE FOTOS Y COMPATIBILIDAD CON PDF) ──
    const procesarArchivo = (file) => new Promise((resolve, reject) => {
        if (!file) return reject(new Error("No se seleccionó ningún archivo"));
        const isPdf = file.type === "application/pdf" || file.name.toLowerCase().endsWith(".pdf");
        const isImg = file.type.startsWith("image/");

        if (isPdf) {
            if (file.size > 850 * 1024) {
                alert("Atención: El archivo PDF supera 800 KB. Los registros en Firebase deben ser livianos. Si supera 1MB podría generar error al guardar.");
            }
            const reader = new FileReader();
            reader.onloadend = () => resolve({
                base64: reader.result,
                nombre: file.name,
                tipo: 'pdf',
                sizeKb: Math.round(file.size / 1024)
            });
            reader.onerror = () => reject(new Error("Error al leer el archivo PDF"));
            reader.readAsDataURL(file);
        } else if (isImg) {
            const reader = new FileReader();
            reader.onloadend = () => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement("canvas");
                    const maxDim = 1200; // Redimensionar imágenes de teléfono móvil para optimizar espacio
                    let width = img.width;
                    let height = img.height;
                    if (width > maxDim || height > maxDim) {
                        if (width > height) {
                            height = Math.round((height * maxDim) / width);
                            width = maxDim;
                        } else {
                            width = Math.round((width * maxDim) / height);
                            height = maxDim;
                        }
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext("2d");
                    ctx.drawImage(img, 0, 0, width, height);
                    const compressedBase64 = canvas.toDataURL("image/jpeg", 0.75);
                    resolve({
                        base64: compressedBase64,
                        nombre: file.name,
                        tipo: 'image',
                        sizeKb: Math.round((compressedBase64.length * 3) / 4 / 1024)
                    });
                };
                img.onerror = () => reject(new Error("Error al decodificar la imagen"));
                img.src = reader.result;
            };
            reader.onerror = () => reject(new Error("Error al leer la foto"));
            reader.readAsDataURL(file);
        } else {
            reject(new Error("Formato no soportado. Debe ser imagen (.jpg, .png, etc.) o documento PDF."));
        }
    });

    function App() {
        const [user, setUser] = useState(null);
        const [activeTab, setActiveTab] = useState('compras'); // pestaña inicial orientada a compras y gastos
        const [loading, setLoading] = useState(true);
        const [error, setError] = useState(null);
        const [successMsg, setSuccessMsg] = useState(null);
        const [isSaving, setIsSaving] = useState(false);

        // Colecciones limpias
        const [facturas, setFacturas]       = useState([]); // stock en bodega
        const [cargas, setCargas]           = useState([]); // despachos y rutas
        const [movManuales, setMovManuales] = useState([]); // caja general
        const [docsCompra, setDocsCompra]   = useState([]); // FACTURAS DE COMPRA (PDF / FOTO)
        const [docsGasto, setDocsGasto]     = useState([]); // FACTURAS DE GASTO (PDF / FOTO, ALIMENTACIÓN, COMBUSTIBLE, ETC.)

        // Filtros
        const [filtroInicio, setFiltroInicio]       = useState('');
        const [filtroFin, setFiltroFin]             = useState('');
        const [filtroGastoCat, setFiltroGastoCat]   = useState('todos');
        const [busquedaCompra, setBusquedaCompra]   = useState('');

        // Sub-tabs
        const [cajaSubTab, setCajaSubTab] = useState('libro'); // 'libro' | 'diario'

        // Modales
        const [modalF, setModalF]                       = useState(false);
        const [modalC, setModalC]                       = useState(false);
        const [modalLiquidacion, setModalLiquidacion]   = useState(null);
        const [modalPago, setModalPago]                 = useState(null);
        const [modalContabilidad, setModalContabilidad] = useState(false);
        const [modalDocCompra, setModalDocCompra]       = useState(false);
        const [modalDocGasto, setModalDocGasto]         = useState(false);
        const [visorDoc, setVisorDoc]                   = useState(null); // { url, nombre, tipo, titulo, detalle }
        const [showReset, setShowReset]                 = useState(false);

        // Fechas
        const today = new Date().toISOString().split('T')[0];

        // Form Stock Factura
        const input2 = useRef(null);
        const input3 = useRef(null);
        const [formF, setFormF] = useState({ n1:'', n2:'', n3:'', items: PRODUCTOS.map(p=>({...p,q:0})) });

        // Form Despacho
        const [formC, setFormC] = useState({ ven:'', items: PRODUCTOS.map(p=>({...p,q:0})), fecha:today });

        // Form Pago Stock
        const [formPago, setFormPago] = useState({ monto:0, fecha:today, foto:null });

        // Form Liquidación Ruta
        const [formLiq, setFormLiq] = useState({
            itemsDevueltos: PRODUCTOS.map(p=>({...p,q:0})),
            gastos: { combustible:0, alimentacion:0, viaticos:0, hospedaje:0, mantenimiento:0, otros:0 },
            fechaLiquidacion: today,
            fotoDeposito: null
        });

        // Form Caja Manual
        const [formMov, setFormMov] = useState({ fecha:today, desc:'', monto:0, tipo:'egreso' });

        // FORM FACTURA DE COMPRA (con fecha, proveedor, numFact, monto, detalle productos, archivo PDF/Foto)
        const [formDocCompra, setFormDocCompra] = useState({
            fecha: today,
            proveedor: 'Avena Polaca / Distribuidor Principal',
            numFact: '',
            monto: '',
            notas: '',
            archivo: null,
            nombreArchivo: '',
            tipoArchivo: ''
        });

        // FORM FACTURA DE GASTO (Alimentación con Desayuno/Almuerzo/Merienda, Combustible variable, Mantenimiento con cambio aceite/reparación + detalle, Hospedaje con hotel + costo detallado)
        const [formDocGasto, setFormDocGasto] = useState({
            fecha: today,
            categoria: 'alimentacion', // 'alimentacion' | 'combustible' | 'mantenimiento' | 'hospedaje' | 'otros'
            // Alimentación
            tipoComida: 'almuerzo', // 'desayuno' | 'almuerzo' | 'merienda'
            // Combustible
            valorCombustible: '',
            // Mantenimiento
            tipoMantenimiento: 'cambio_aceite', // 'cambio_aceite' | 'reparacion'
            detalleMantenimiento: '',
            // Hospedaje
            nombreHotel: '',
            costoDetalladoHotel: '',
            // Generales
            monto: '',
            concepto: '',
            notas: '',
            archivo: null,
            nombreArchivo: '',
            tipoArchivo: ''

        // Feedback temporal
        const mostrarAviso = (msg) => {

        // ── CONEXIÓN FIREBASE LIMPIA DESDE CERO (appId austro-v28 para partir de cero registros limpios) ──
        useEffect(() => {
            const init = async () => {
                try {
                    let cfg;
                    try { cfg = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : BACKUP_CONFIG; } catch { cfg = BACKUP_CONFIG; }
                    const app = FB.initializeApp(cfg);
                    const auth = FB.getAuth(app);
                    const db = FB.getFirestore(app);

                    // Namespace de aplicación limpio desde 0
                    const appId = typeof __app_id !== 'undefined' ? __app_id : 'austro-v28';
                    window.appDb = db;
                    window.appId = appId;

                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await FB.signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await FB.signInAnonymously(auth);
                    }
                    FB.onAuthStateChanged(auth, u => { setUser(u); setLoading(false); });

                    const col = n => FB.collection(db, 'artifacts', appId, 'public', 'data', n);

                    // Escucha en tiempo real de colecciones
                    FB.onSnapshot(col('facturas'), s => setFacturas(s.docs.map(d=>({id:d.id, ...d.data()}))));
                    FB.onSnapshot(col('despachos'), s => setCargas(s.docs.map(d=>({id:d.id, ...d.data()}))));
                    FB.onSnapshot(col('movimientos'), s => setMovManuales(s.docs.map(d=>({id:d.id, ...d.data()}))));
                    FB.onSnapshot(col('docsCompra'), s => setDocsCompra(s.docs.map(d=>({id:d.id, ...d.data()}))));
                    FB.onSnapshot(col('docsGasto'), s => setDocsGasto(s.docs.map(d=>({id:d.id, ...d.data()}))));
                } catch(e) {
                    console.error("Firebase init error:", e);
                    setError("Fallo al conectar con la base de datos en la nube.");
                    setLoading(false);
                }
            };
            init();
        }, []);

        // ── MEMOS Y CÁLCULOS FINANCIEROS ──
        const margenBrutoTotal = useMemo(() => cargas.reduce((acc, c) => {
            const devs = c.itemsDevueltos || [];
            return acc + (c.items || []).reduce((s, i) => {
                const dev = devs.find(d => d.id === i.id)?.q || 0;
                return s + ((i.q - dev) * (i.pvd - i.costo));
            }, 0);
        }, 0), [cargas]);

        const stockPorProducto = useMemo(() => PRODUCTOS.map(p => {
            const entradas   = facturas.reduce((a, f) => a + (f.items?.find(it => it.id === p.id)?.q || 0), 0);
            const despachado = cargas.reduce((a, c) => a + (c.items?.find(it => it.id === p.id)?.q || 0), 0);
            const devuelto   = cargas.reduce((a, c) => a + (c.itemsDevueltos?.find(it => it.id === p.id)?.q || 0), 0);
            const stock      = entradas - despachado + devuelto;
            return {
                ...p,
                stock,
                costoTotal: stock * p.costo,
                ventaTotal: stock * p.pvd,
                utilidad: stock * (p.pvd - p.costo)
            };
        }), [facturas, cargas]);

        // Libro contable consolidado con Compras, Gastos, Liquidaciones y Movimientos
        const libroCompleto = useMemo(() => {
            let data = [];
            cargas.filter(c => c.estado === 'liquidada').forEach(c =>
                data.push({ fecha: c.fechaLiquidacion || c.fecha, desc: `DEPÓSITO RUTA: ${c.responsable}`, ingreso: parseFloat(c.totalADepositar)||0, egreso: 0, tipo: 'RUTA' }));

            facturas.filter(f => f.montoPagado > 0).forEach(f =>
                data.push({ fecha: f.fechaPago || f.fecha, desc: `PAGO STOCK FACT: ${f.numFactura}`, ingreso: 0, egreso: parseFloat(f.montoPagado)||0, tipo: 'FACTURA' }));

            movManuales.forEach(m =>
                data.push({ fecha: m.fecha, desc: m.desc.toUpperCase(), ingreso: m.tipo === 'ingreso' ? parseFloat(m.monto)||0 : 0, egreso: m.tipo === 'egreso' ? parseFloat(m.monto)||0 : 0, tipo: 'MANUAL' }));

            docsGasto.forEach(d => {
                const monto = parseFloat(d.monto) || 0;
                if (monto > 0) {
                    data.push({ fecha: d.fecha, desc: `GASTO (${d.categoria?.toUpperCase()}): ${d.concepto || d.notas || 'Sin detalle'}`, ingreso: 0, egreso: monto, tipo: 'GASTO' });
                }
            });

            docsCompra.forEach(d => {
                const monto = parseFloat(d.monto) || 0;
                if (monto > 0) {
                    data.push({ fecha: d.fecha, desc: `COMPRA: ${d.proveedor} ${d.numFact ? 'F#'+d.numFact : ''}`, ingreso: 0, egreso: monto, tipo: 'COMPRA' });
                }
            });

            data.sort((a,b) => new Date(a.fecha) - new Date(b.fecha));
            let saldo = 0;
            return data.map(m => {
                saldo += (m.ingreso - m.egreso);
                return { ...m, saldoActual: saldo };
            }).reverse();
        }, [facturas, cargas, movManuales, docsGasto, docsCompra]);

        const libroFiltrado = useMemo(() => libroCompleto.filter(m => {
            const ok1 = filtroInicio ? m.fecha >= filtroInicio : true;
            const ok2 = filtroFin   ? m.fecha <= filtroFin   : true;
            return ok1 && ok2;

        const resumenCaja = useMemo(() => {

        // Agrupado diario
        const libroDiario = useMemo(() => {
            const map = {};
            libroCompleto.forEach(m => {
                if (!map[m.fecha]) map[m.fecha] = { fecha: m.fecha, ingreso: 0, egreso: 0 };
                map[m.fecha].ingreso += m.ingreso;
                map[m.fecha].egreso  += m.egreso;
            });
            return Object.values(map).sort((a,b) => b.fecha.localeCompare(a.fecha)).map(d => ({ ...d, neto: d.ingreso - d.egreso }));
        }, [libroCompleto]);

        // Estadísticas y filtrado de compras
        const comprasFiltradas = useMemo(() => {
            return docsCompra.filter(c => {

                const matchFechaIni = filtroInicio ? c.fecha >= filtroInicio : true;
                const matchFechaFin = filtroFin ? c.fecha <= filtroFin : true;
                return matchTexto && matchFechaIni && matchFechaFin;

        const totalComprasMonto = useMemo(() => comprasFiltradas.reduce((a, c) => a + (parseFloat(c.monto) || 0), 0), [comprasFiltradas]);

        // Estadísticas y filtrado de gastos

                const byteNumbers = new Array(byteCharacters.length);
                for (let i = 0; i < byteCharacters.length; i++) {

                                        className="text-red-500 hover:text-red-700 ml-2"
                                    >
                                        <Icon name="x" size={14}/>
                                    </button>
                                </div>
                            )}

                            {formDocGasto.archivo && formDocGasto.tipoArchivo === 'image' && (
                                <img
                                    src={formDocGasto.archivo}
                                    alt="Vista previa"
                                    className="w-full h-36 object-contain rounded-xl mt-2 border bg-white"
                                />
                            )}
                        </div>
                    </div>

                    <div className="p-4 border-t bg-slate-50 flex gap-2">
                        <button
                            onClick={() => setModalDocGasto(false)}
                            className="w-1/3 py-3 rounded-xl bg-slate-200 hover:bg-slate-300 font-black text-xs uppercase text-slate-700"
                        >
                            Cancelar
                        </button>
                        <button
                            onClick={guardarDocGasto}
                            disabled={isSaving}
                            className={`flex-1 py-3 rounded-xl ${isSaving ? 'bg-slate-400' : 'bg-orange-600 hover:bg-orange-700'} text-white font-black text-xs uppercase shadow-lg transition-all`}
                        >
                            {isSaving ? 'Guardando...' : 'Guardar Factura de Gasto'}
                        </button>
                    </div>
                </div>
            </div>
            )}

            {/* ═══════════════════════════════════════════════════════
                MODAL VISOR DE FACTURA / DOCUMENTO (PDF O FOTO)
            ═══════════════════════════════════════════════════════ */}
            {visorDoc && (
            <div className="fixed inset-0 bg-black/90 z-[300] flex flex-col items-center justify-center p-2 sm:p-6" onClick={() => setVisorDoc(null)}>
                <div className="w-full max-w-4xl bg-slate-900 rounded-2xl overflow-hidden shadow-2xl flex flex-col max-h-[92vh]" onClick={e => e.stopPropagation()}>
                    <div className="bg-slate-800 p-3.5 px-4 text-white flex justify-between items-center border-b border-slate-700">
                        <div>
                            <h3 className="font-black text-sm uppercase tracking-wide text-emerald-400">
                                {visorDoc.titulo || 'Visualizador de Documento'}
                            </h3>
                            <p className="text-[10px] text-slate-300">{visorDoc.detalle || visorDoc.nombre}</p>
                        </div>
                        <div className="flex items-center gap-2">
                            {visorDoc.tipo === 'pdf' && (
                                <button
                                    onClick={() => abrirPdfEnPestana(visorDoc.url)}
                                    className="px-3 py-1.5 bg-[#128C7E] hover:bg-emerald-600 text-white rounded-lg text-xs font-bold flex items-center gap-1 shadow-sm"
                                    title="Abrir en pestaña nueva para imprimir o descargar"
                                >
                                    <Icon name="external-link" size={14}/>
                                    <span>Abrir Completo</span>
                                </button>
                            )}
                            <button
                                onClick={() => setVisorDoc(null)}
                                className="p-1.5 text-slate-400 hover:text-white rounded-lg bg-white/10"
                            >
                                <Icon name="x" size={20}/>
                            </button>
                        </div>
                    </div>

                    <div className="flex-1 p-2 sm:p-4 bg-slate-950 flex items-center justify-center overflow-auto">
                        {visorDoc.tipo === 'image' || (visorDoc.url && visorDoc.url.startsWith('data:image')) ? (
                            <img
                                src={visorDoc.url}
                                alt="Factura cargada"
                                className="max-h-[75vh] w-auto max-w-full rounded-xl object-contain shadow-xl"
                            />
                        ) : visorDoc.tipo === 'pdf' || (visorDoc.url && visorDoc.url.startsWith('data:application/pdf')) ? (
                            <iframe
                                src={visorDoc.url}
                                className="w-full h-[75vh] rounded-xl bg-white border border-slate-700"
                                title="Factura PDF"
                            />
                        ) : (
                            <p className="text-white text-xs">Formato de archivo no soportado para previsualización directa.</p>
                        )}
                    </div>
                </div>
            </div>
            )}

            {/* ═══════════════════════════════════════════════════════
                MODAL: INGRESO DE STOCK A BODEGA
            ═══════════════════════════════════════════════════════ */}
            {modalF && (
            <div className="fixed inset-0 bg-slate-900/80 z-[200] overflow-y-auto backdrop-blur-sm p-2 sm:p-4 flex items-end sm:items-center justify-center">
                <div className="bg-white w-full max-w-lg rounded-3xl flex flex-col shadow-2xl overflow-hidden fade-in">
                    <div className="p-4 border-b flex justify-between items-center bg-slate-50">
                        <h3 className="font-black uppercase text-xs text-slate-600 tracking-wider">Ingreso de Mercadería a Bodega</h3>
                        <button onClick={() => setModalF(false)} className="p-1 text-slate-400"><Icon name="x" size={18}/></button>
                    </div>
                    <div className="p-5 space-y-4 max-h-[75vh] overflow-y-auto custom-scrollbar">
                        <div className="bg-[#075E54] p-4 rounded-2xl text-center text-white">
                            <p className="text-[9px] font-bold uppercase opacity-75 mb-2">N° Factura de Stock</p>
                            <div className="flex justify-center items-center gap-2">
                                <input className="bg-white/10 text-white w-14 text-center text-lg font-black py-1.5 rounded-xl border border-white/20 outline-none" placeholder="000" maxLength="3" value={formF.n1} onChange={e=>{setFormF({...formF,n1:e.target.value});if(e.target.value.length===3)input2.current.focus();}}/>
                                <span className="text-white/40 font-black">-</span>
                                <input ref={input2} className="bg-white/10 text-white w-14 text-center text-lg font-black py-1.5 rounded-xl border border-white/20 outline-none" placeholder="000" maxLength="3" value={formF.n2} onChange={e=>{setFormF({...formF,n2:e.target.value});if(e.target.value.length===3)input3.current.focus();}}/>
                                <span className="text-white/40 font-black">-</span>
                                <input ref={input3} className="bg-white/10 text-white w-28 text-center text-lg font-black py-1.5 rounded-xl border border-white/20 outline-none" placeholder="000000000" maxLength="9" value={formF.n3} onChange={e=>setFormF({...formF,n3:e.target.value})}/>
                            </div>
                        </div>

                        <div className="space-y-2">
                            {formF.items.map((it, idx) => (
                                <div key={it.id} className="flex justify-between items-center p-2.5 bg-slate-50 rounded-xl border">
                                    <span className="text-xs font-bold text-slate-700 uppercase flex-1 pr-2">{it.nombre}</span>
                                    <input
                                        type="number"
                                        placeholder="0"
                                        className="w-20 p-2 text-center font-black bg-white rounded-lg border border-slate-200 outline-none text-[#128C7E]"
                                        value={it.q || ''}
                                        onChange={e => {
                                            const ni = [...formF.items];
                                            ni[idx].q = parseInt(e.target.value) || 0;
                                            setFormF({...formF, items: ni});
                                        }}
                                    />
                                </div>
                            ))}
                        </div>
                    </div>
                    <div className="p-4 border-t bg-slate-50">
                        <button onClick={guardarFacturaStock} disabled={isSaving} className="w-full bg-[#128C7E] text-white py-3 rounded-xl font-black uppercase text-xs shadow-md">
                            Guardar Stock en Bodega
                        </button>
                    </div>
                </div>
            </div>
            )}

            {/* ═══════════════════════════════════════════════════════
                MODAL: DESPACHAR RUTA
            ═══════════════════════════════════════════════════════ */}
            {modalC && (
            <div className="fixed inset-0 bg-slate-900/80 z-[200] overflow-y-auto backdrop-blur-sm p-2 sm:p-4 flex items-end sm:items-center justify-center">
                <div className="bg-white w-full max-w-lg rounded-3xl flex flex-col shadow-2xl overflow-hidden fade-in">
                    <div className="p-4 border-b flex justify-between items-center bg-slate-50">
                        <h3 className="font-black uppercase text-xs text-slate-600 tracking-wider">Despachar Producto a Vendedor</h3>
                        <button onClick={() => setModalC(false)} className="p-1 text-slate-400"><Icon name="x" size={18}/></button>
                    </div>
                    <div className="p-5 space-y-4 max-h-[75vh] overflow-y-auto custom-scrollbar">
                        <div>
                            <label className="text-[9px] font-black text-slate-500 uppercase block mb-1">Vendedor Responsable</label>
                            <select
                                className="w-full p-2.5 bg-slate-50 rounded-xl font-black text-xs border border-slate-200 outline-none text-[#128C7E]"
                                value={formC.ven}
                                onChange={e => setFormC({...formC, ven: e.target.value})}
                            >
                                <option value="">Selecciona vendedor...</option>
                                {VENDEDORES.map((v, i) => <option key={i} value={v}>{v}</option>)}
                            </select>
                        </div>

                        <div>
                            <label className="text-[9px] font-black text-slate-500 uppercase block mb-1">Fecha de Salida</label>
                            <input
                                type="date"
                                className="w-full p-2.5 bg-slate-50 rounded-xl font-bold text-xs border outline-none"
                                value={formC.fecha}
                                onChange={e => setFormC({...formC, fecha: e.target.value})}
                            />
                        </div>

                        <div className="space-y-2">
                            {formC.items.map((it, idx) => (
                                <div key={it.id} className="flex justify-between items-center p-2.5 bg-slate-50 rounded-xl border">
                                    <span className="text-xs font-bold text-slate-700 uppercase flex-1 pr-2">{it.nombre}</span>
                                    <input
                                        type="number"
                                        placeholder="0"
                                        className="w-20 p-2 text-center font-black bg-white rounded-lg border border-slate-200 outline-none text-[#128C7E]"
                                        value={it.q || ''}
                                        onChange={e => {
                                            const ni = [...formC.items];
                                            ni[idx].q = parseInt(e.target.value) || 0;
                                            setFormC({...formC, items: ni});
                                        }}
                                    />
                                </div>
                            ))}
                        </div>
                    </div>
                    <div className="p-4 border-t bg-slate-50">
                        <button onClick={guardarCarga} disabled={isSaving} className="w-full bg-[#128C7E] text-white py-3 rounded-xl font-black uppercase text-xs shadow-md">
                            Confirmar Despacho 🚛
                        </button>
                    </div>
                </div>
            </div>
            )}

            {/* ═══════════════════════════════════════════════════════
                MODAL: LIQUIDAR RUTA
            ═══════════════════════════════════════════════════════ */}
            {modalLiquidacion && (
            <div className="fixed inset-0 bg-slate-900/80 z-[200] overflow-y-auto backdrop-blur-sm p-2 sm:p-4 flex items-end sm:items-center justify-center">
                <div className="bg-white w-full max-w-lg rounded-3xl flex flex-col shadow-2xl overflow-hidden fade-in">
                    <div className="p-4 border-b flex justify-between items-center bg-slate-50">
                        <h3 className="font-black uppercase text-xs text-slate-600 tracking-wider">Liquidar Ruta — {modalLiquidacion.responsable}</h3>
                        <button onClick={() => setModalLiquidacion(null)} className="p-1 text-slate-400"><Icon name="x" size={18}/></button>
                    </div>
                    <div className="p-5 space-y-4 max-h-[75vh] overflow-y-auto custom-scrollbar">
                        <p className="text-[10px] font-black text-slate-400 uppercase">Unidades Devueltas por el Vendedor</p>
                        <div className="space-y-2">
                            {formLiq.itemsDevueltos.map((it, idx) => (
                                <div key={it.id} className="flex justify-between items-center p-2 bg-slate-50 rounded-xl border">
                                    <span className="text-xs font-bold text-slate-700 uppercase flex-1 pr-2">{it.nombre}</span>
                                    <input
                                        type="number"
                                        placeholder="0"
                                        className="w-20 p-2 text-center font-black bg-white rounded-lg border outline-none text-[#128C7E]"
                                        value={it.q || ''}
                                        onChange={e => {
                                            const ni = [...formLiq.itemsDevueltos];
                                            ni[idx].q = parseInt(e.target.value) || 0;
                                            setFormLiq({...formLiq, itemsDevueltos: ni});
                                        }}
                                    />
                                </div>
                            ))}
                        </div>

                        <p className="text-[10px] font-black text-slate-400 uppercase border-t pt-3">Gastos del Día en Ruta ($)</p>
                        <div className="grid grid-cols-2 gap-2">
                            {Object.keys(formLiq.gastos).map(k => (
                                <div key={k}>
                                    <label className="text-[9px] font-black text-slate-500 uppercase block mb-1">{k}</label>
                                    <input
                                        type="number"
                                        step="0.01"
                                        placeholder="0.00"
                                        className="w-full p-2 bg-slate-50 rounded-xl font-black text-xs border outline-none text-[#128C7E]"
                                        value={formLiq.gastos[k]}
                                        onChange={e => setFormLiq({
                                            ...formLiq,
                                            gastos: { ...formLiq.gastos, [k]: parseFloat(e.target.value) || 0 }
                                        })}
                                    />
                                </div>
                            ))}
                        </div>

                        <div>
                            <label className="text-[9px] font-black text-slate-500 uppercase block mb-1">Fecha de Liquidación / Depósito</label>
                            <input
                                type="date"
                                className="w-full p-2.5 bg-slate-50 rounded-xl font-bold text-xs border outline-none"
                                value={formLiq.fechaLiquidacion}
                                onChange={e => setFormLiq({...formLiq, fechaLiquidacion: e.target.value})}
                            />
                        </div>
                    </div>
                    <div className="p-4 border-t bg-slate-50">
                        <button onClick={registrarLiquidacion} disabled={isSaving} className="w-full bg-[#128C7E] text-white py-3 rounded-xl font-black uppercase text-xs shadow-md">
                            Confirmar Liquidación y Asentar en Caja
                        </button>
                    </div>
                </div>
            </div>
            )}

            {/* ═══════════════════════════════════════════════════════
                MODAL: PAGO FACTURA STOCK
            ═══════════════════════════════════════════════════════ */}
            {modalPago && (
            <div className="fixed inset-0 bg-slate-900/80 z-[200] overflow-y-auto backdrop-blur-sm p-2 sm:p-4 flex items-end sm:items-center justify-center">
                <div className="bg-white w-full max-w-md rounded-3xl flex flex-col shadow-2xl overflow-hidden fade-in">
                    <div className="p-4 border-b flex justify-between items-center bg-slate-50">
                        <h3 className="font-black uppercase text-xs text-slate-600 tracking-wider">Pago Factura {modalPago.numFactura}</h3>
                        <button onClick={() => setModalPago(null)} className="p-1 text-slate-400"><Icon name="x" size={18}/></button>
                    </div>
                    <div className="p-5 space-y-4">
                        <div className="bg-slate-50 p-3 rounded-xl text-center border">
                            <p className="text-[9px] font-bold text-slate-400 uppercase">Total Factura</p>
                            <p className="text-xl font-black text-slate-800">${modalPago.total?.toFixed(2)}</p>
                        </div>
                        <div>
                            <label className="text-[9px] font-black text-slate-500 uppercase block mb-1">Monto Pagado ($)</label>
                            <input
                                type="number"
                                step="0.01"
                                className="w-full p-3 bg-emerald-50 rounded-xl font-black text-base border border-emerald-200 outline-none text-[#075E54]"
                                value={formPago.monto}
                                onChange={e => setFormPago({...formPago, monto: e.target.value})}
                            />
                        </div>
                        <div>
                            <label className="text-[9px] font-black text-slate-500 uppercase block mb-1">Fecha de Pago</label>
                            <input
                                type="date"
                                className="w-full p-2.5 bg-slate-50 rounded-xl font-bold text-xs border outline-none"
                                value={formPago.fecha}
                                onChange={e => setFormPago({...formPago, fecha: e.target.value})}
                            />
                        </div>
                    </div>
                    <div className="p-4 border-t bg-slate-50">
                        <button onClick={registrarPagoStock} disabled={isSaving} className="w-full bg-[#128C7E] text-white py-3 rounded-xl font-black uppercase text-xs shadow-md">
                            Confirmar Cobro / Pago
                        </button>
                    </div>
                </div>
            </div>
            )}

            {/* ═══════════════════════════════════════════════════════
                MODAL: MOVIMIENTO MANUAL DE CAJA
            ═══════════════════════════════════════════════════════ */}
            {modalContabilidad && (
            <div className="fixed inset-0 bg-slate-900/80 z-[200] overflow-y-auto backdrop-blur-sm p-2 sm:p-4 flex items-end sm:items-center justify-center">
                <div className="bg-white w-full max-w-md rounded-3xl flex flex-col shadow-2xl overflow-hidden fade-in">
                    <div className="p-4 border-b flex justify-between items-center bg-slate-50">
                        <h3 className="font-black uppercase text-xs text-slate-600 tracking-wider">Nuevo Movimiento Manual de Caja</h3>
                        <button onClick={() => setModalContabilidad(false)} className="p-1 text-slate-400"><Icon name="x" size={18}/></button>
                    </div>
                    <div className="p-5 space-y-4">
                        <div className="flex gap-2">
                            <button
                                type="button"
                                onClick={() => setFormMov({...formMov, tipo:'ingreso'})}
                                className={`flex-1 py-2.5 rounded-xl font-black text-xs uppercase ${formMov.tipo==='ingreso'?'bg-emerald-600 text-white shadow-sm':'bg-slate-100 text-slate-600'}`}
                            >
                                📈 Ingreso
                            </button>
                            <button
                                type="button"
                                onClick={() => setFormMov({...formMov, tipo:'egreso'})}
                                className={`flex-1 py-2.5 rounded-xl font-black text-xs uppercase ${formMov.tipo==='egreso'?'bg-red-500 text-white shadow-sm':'bg-slate-100 text-slate-600'}`}
                            >
                                📉 Egreso
                            </button>
                        </div>
                        <div>
                            <label className="text-[9px] font-black text-slate-500 uppercase block mb-1">Descripción</label>
                            <input
                                type="text"
                                placeholder="Ej: Depósito bancario, Pago proveedor..."
                                className="w-full p-2.5 bg-slate-50 rounded-xl font-bold text-xs border outline-none"
                                value={formMov.desc}
                                onChange={e => setFormMov({...formMov, desc: e.target.value})}
                            />
                        </div>
                        <div>
                            <label className="text-[9px] font-black text-slate-500 uppercase block mb-1">Monto ($)</label>
                            <input
                                type="number"
                                step="0.01"
                                placeholder="0.00"
                                className="w-full p-2.5 bg-slate-50 rounded-xl font-black text-base border outline-none"
                                value={formMov.monto}
                                onChange={e => setFormMov({...formMov, monto: e.target.value})}
                            />
                        </div>
                        <div>
                            <label className="text-[9px] font-black text-slate-500 uppercase block mb-1">Fecha</label>
                            <input
                                type="date"
                                className="w-full p-2.5 bg-slate-50 rounded-xl font-bold text-xs border outline-none"
                                value={formMov.fecha}
                                onChange={e => setFormMov({...formMov, fecha: e.target.value})}
                            />
                        </div>
                    </div>
                    <div className="p-4 border-t bg-slate-50">
                        <button onClick={registrarMovManual} disabled={isSaving} className="w-full bg-[#128C7E] text-white py-3 rounded-xl font-black uppercase text-xs shadow-md">
                            Asentar Movimiento en Caja
                        </button>
                    </div>
                </div>
            </div>
            )}

            {/* ═══════════════════════════════════════════════════════
                MODAL: REINICIAR Y ARRANCAR DESDE CERO
            ═══════════════════════════════════════════════════════ */}
            {showReset && (
            <div className="fixed inset-0 bg-slate-900/90 z-[300] flex items-center justify-center p-4">
                <div className="bg-white rounded-3xl p-6 max-w-sm w-full shadow-2xl text-center fade-in">
                    <div className="w-16 h-16 bg-red-100 rounded-2xl flex items-center justify-center mx-auto mb-4 text-red-600">
                        <Icon name="rotate-ccw" size={30}/>
                    </div>
                    <h3 className="font-black text-slate-800 text-base uppercase italic mb-2">Arrancar Información desde 0</h3>
                    <p className="text-xs text-slate-500 mb-6 leading-relaxed">
                        ¿Confirmas que deseas reiniciar y arrancar desde cero todas las facturas de compras, gastos y rutas? Esta acción dejará las tablas completamente limpias.
                    </p>
                    <div className="flex gap-2.5">
                        <button
                            onClick={() => setShowReset(false)}
                            className="flex-1 py-3 rounded-xl bg-slate-100 hover:bg-slate-200 font-black text-xs uppercase text-slate-700"
                        >
                            Cancelar
                        </button>
                        <button
                            onClick={resetearTodoDesdeCero}
                            className="flex-1 py-3 rounded-xl bg-red-600 hover:bg-red-700 text-white font-black text-xs uppercase shadow-lg"
                        >
                            Sí, Arrancar en 0
                        </button>
                    </div>
                </div>
            </div>
            )}
        </div>
        );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App/>);
</script>
</body>
</html>
