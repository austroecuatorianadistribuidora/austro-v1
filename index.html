    // ── PROCESAMIENTO INTELIGENTE DE ARCHIVOS ──
    const procesarArchivo = (file) => new Promise((resolve, reject) => {
        if (!file) return reject(new Error("No se seleccionó ningún archivo"));
        const isPdf = file.type === "application/pdf" || file.name.toLowerCase().endsWith(".pdf");
        const isImg = file.type.startsWith("image/");

        if (isPdf) {
            if (file.size > 850 * 1024) {
                alert("Atención: El archivo PDF supera 800 KB.");
            }
            const reader = new FileReader();
            reader.onloadend = () => resolve({
                base64: reader.result,
                nombre: file.name,
                tipo: 'pdf',
                sizeKb: Math.round(file.size / 1024)
            });
            reader.onerror = () => reject(new Error("Error al leer el archivo PDF"));
            reader.readAsDataURL(file);
        } else if (isImg) {
            const reader = new FileReader();
            reader.onloadend = () => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement("canvas");
                    const maxDim = 1200;
                    let width = img.width;
                    let height = img.height;
                    if (width > maxDim || height > maxDim) {
                        if (width > height) {
                            height = Math.round((height * maxDim) / width);
                            width = maxDim;
                        } else {
                            width = Math.round((width * maxDim) / height);
                            height = maxDim;
                        }
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext("2d");
                    ctx.drawImage(img, 0, 0, width, height);
                    const compressedBase64 = canvas.toDataURL("image/jpeg", 0.75);
                    resolve({
                        base64: compressedBase64,
                        nombre: file.name,
                        tipo: 'image',
                        sizeKb: Math.round((compressedBase64.length * 3) / 4 / 1024)
                    });
                };
                img.onerror = () => reject(new Error("Error al decodificar la imagen"));
                img.src = reader.result;
            };
            reader.onerror = () => reject(new Error("Error al leer la foto"));
            reader.readAsDataURL(file);
        } else {
            reject(new Error("Formato no soportado. Debe ser imagen o PDF."));
        }
    });

                    telefono: formNota.telefono || '',
                    totalUnidades,
                    totalMonto: parseFloat(totalMonto.toFixed(2)),
                    totalCosto: parseFloat(totalCosto.toFixed(2)),
                    utilidadBruta: parseFloat((totalMonto - totalCosto).toFixed(2)),
                    items: itemsProcesados
                };

                setVentasNotas(prev => {
                    const actualizadas = prev.map(v => (v.id === editandoVentaId || v.firestoreId === editandoVentaId || v.localId === editandoVentaId) ? { ...v, ...ventaActualizada } : v);
                    try {
                        localStorage.setItem('austropolaca_ventas_notas_v1', JSON.stringify(actualizadas));
                    } catch(e) {}
                    return actualizadas;
                });

                try {
                    if (window.appDb && window.appId && window.FB) {
                        const col = n => FB.collection(window.appDb, 'artifacts', window.appId, 'public', 'data', n);
                        try {
                            const ventaRef = FB.doc(window.appDb, 'artifacts', window.appId, 'public', 'data', 'ventasNotas', editandoVentaId);
                            await FB.updateDoc(ventaRef, {
                                ...ventaActualizada,
                                updatedAt: new Date().toISOString()
                            });
                        } catch(errDirect) {
                            const snap = await FB.getDocs(col('ventasNotas'));
                            for (const d of snap.docs) {
                                if (d.id === editandoVentaId || d.data().id === editandoVentaId) {
                                    await FB.updateDoc(FB.doc(window.appDb, 'artifacts', window.appId, 'public', 'data', 'ventasNotas', d.id), {
                                        ...ventaActualizada,
                                        updatedAt: new Date().toISOString()
                                    });
                                }
                            }
                        }
                    }
                } catch(e) {
                    console.warn("Offline sync update warning:", e);
                }

                setEditandoVentaId(null);
                limpiarFormNota();
                mostrarAviso(`✓ Nota ${numNota} actualizada (${clienteFinal} - ${ciudadFinal})`);
                setModalVentaGuardada(ventaActualizada);
                return;
            }

            // ── MODO NUEVA VENTA ÁGIL ──
            const localId = 'vn_' + Date.now();
            let ventaFinal = {
                id: localId,
                localId: localId,
                firestoreId: localId,
                numeroNota: numNota,
                fecha: formNota.fecha || today,
                hora: horaActual,
                timestamp: Date.now(),
                cliente: clienteFinal,
                ciudad: ciudadFinal,
                direccion: ciudadFinal,
                detalle: formNota.detalle || '',
                telefono: formNota.telefono || '',
                totalUnidades,
                totalMonto: parseFloat(totalMonto.toFixed(2)),
                totalCosto: parseFloat(totalCosto.toFixed(2)),
                utilidadBruta: parseFloat((totalMonto - totalCosto).toFixed(2)),
                items: itemsProcesados
            };

            try {
                if (window.appDb && window.appId && window.FB) {
                    const col = n => FB.collection(window.appDb, 'artifacts', window.appId, 'public', 'data', n);
                    const docRef = await FB.addDoc(col('ventasNotas'), { ...ventaFinal, createdAt: new Date().toISOString() });
                    if (docRef && docRef.id) {
                        ventaFinal.id = docRef.id;
                        ventaFinal.firestoreId = docRef.id;
                    }
                }
            } catch(e) {
                console.warn("Offline Firestore sync fallback");
            }

            setVentasNotas(prev => [ventaFinal, ...prev.filter(v => v.id !== ventaFinal.id)]);
            try {
                localStorage.setItem('austropolaca_ventas_notas_v1', JSON.stringify([ventaFinal, ...ventasNotas]));
            } catch(e) {}

            mostrarAviso(`✓ Nota grabada: ${clienteFinal} (${ciudadFinal}) • $${ventaFinal.totalMonto.toFixed(2)}`);
            setModalVentaGuardada(ventaFinal);
            limpiarFormNota();
        };

        // Funciones ágiles para Carga Diaria de los 3 productos
        const cambiarCantidadCargaDiaria = (id, delta) => {
            setFormCargaDiaria(prev => ({
                ...prev,
                items: prev.items.map(it => it.id === id ? { ...it, q: Math.max(0, (parseInt(it.q) || 0) + delta) } : it)
            }));
        };

        const fijarCantidadCargaDiaria = (id, val) => {
            const q = Math.max(0, parseInt(val) || 0);
            setFormCargaDiaria(prev => ({
                ...prev,
                items: prev.items.map(it => it.id === id ? { ...it, q } : it)
            }));
        };

        const guardarCargaDiariaAgil = async (fechaOverride) => {
            if (isSaving) return;
            const fechaCarga = fechaOverride || formCargaDiaria.fecha || today;
            const rutaAuto = obtenerRutaPorFecha(fechaCarga);
            const rutaIdFinal = formCargaDiaria.ruta || rutaAuto.id;
            const rutaInfo = RUTAS_OFICIALES.find(r => r.id === rutaIdFinal) || rutaAuto;

            const totalUnidades = formCargaDiaria.items.reduce((a, b) => a + (parseInt(b.q) || 0), 0);
            if (totalUnidades <= 0) {
                setError("Ingresa al menos 1 unidad en cualquiera de los 3 productos para registrar la carga diaria.");
                return;
            }

            const totalCosto = formCargaDiaria.items.reduce((a, b) => a + ((parseInt(b.q) || 0) * (b.costo || 0)), 0);
            const totalVenta = formCargaDiaria.items.reduce((a, b) => a + ((parseInt(b.q) || 0) * (b.pvd || 0)), 0);

            const nuevaCargaObj = {
                id: 'carga_' + Date.now(),
                rutaId: rutaInfo.id,
                ruta: rutaInfo.nombre,
                rutaNombre: `${rutaInfo.diaSemana || ''} - ${rutaInfo.nombre}`,
                destino: 'Andrés Cárdenas',
                responsable: rutaInfo.nombre,
                fecha: fechaCarga,
                totalUnidades,
                totalCargado: parseFloat(totalVenta.toFixed(2)),
                totalCosto: parseFloat(totalCosto.toFixed(2)),
                items: formCargaDiaria.items.map(it => ({
                    id: it.id,
                    codigo: it.codigo,
                    nombre: it.nombre,
                    nombreCorto: it.nombreCorto,
                    q: parseInt(it.q) || 0,
                    costo: it.costo,
                    pvd: it.pvd
                })),
                estado: 'activa',
                sinUtilidad: false,
                requiereSeguimiento: false,
                createdAt: new Date().toISOString()
            };

            setIsSaving(true);
            try {
                if (window.appDb && window.appId && window.FB) {
                    const colRef = FB.collection(window.appDb, 'artifacts', window.appId, 'public', 'data', 'despachos');
                    await FB.addDoc(colRef, nuevaCargaObj);
                } else {
                    setCargas(prev => [nuevaCargaObj, ...prev]);
                }
                setFormCargaDiaria(prev => ({
                    ...prev,
                    items: PRODUCTOS_POLACA.map(p => ({
                        id: p.id,
                        codigo: p.codigo,
                        nombre: p.nombre,
                        nombreCorto: p.nombreCorto,
                        peso: p.peso,
                        costo: p.costo,
                        pvd: p.pvd,
                        q: 0
                    }))
                }));
                mostrarAviso(`✓ Carga diaria registrada (${totalUnidades} u. • $${totalVenta.toFixed(2)}) en ${rutaInfo.nombre}`);
            } catch(e) {
                setError("Error al guardar carga diaria: " + (e.message || e));
            } finally {
                setIsSaving(false);
            }
        };

        // Eliminar definitivamente una nota de venta tanto de memoria local como de Firestore
        const eliminarVentaNota = async (ventaOId) => {
            if (!confirm("¿Deseas anular y eliminar esta nota de venta de forma definitiva? No volverá a aparecer.")) return;
            const venta = typeof ventaOId === 'object' ? ventaOId : ventasNotas.find(v => v.id === ventaOId || v.firestoreId === ventaOId || v.localId === ventaOId);
            const idTarget = typeof ventaOId === 'string' ? ventaOId : (venta ? (venta.id || venta.firestoreId || venta.localId) : null);
            if (!idTarget) return;

            setVentasNotas(prev => {
                const filtradas = prev.filter(v => v.id !== idTarget && v.firestoreId !== idTarget && v.localId !== idTarget);
                try {
                    localStorage.setItem('austropolaca_ventas_notas_v1', JSON.stringify(filtradas));
                } catch(e) {}
                return filtradas;
            });

            if (modalTicketDetalle && (modalTicketDetalle.id === idTarget || modalTicketDetalle.firestoreId === idTarget)) {
                setModalTicketDetalle(null);
            }
            if (editandoVentaId === idTarget) {
                setEditandoVentaId(null);
                limpiarFormNota();
            }

            try {
                if (window.appDb && window.appId && window.FB) {
                    const col = n => FB.collection(window.appDb, 'artifacts', window.appId, 'public', 'data', n);
                    try {
                        await FB.deleteDoc(FB.doc(window.appDb, 'artifacts', window.appId, 'public', 'data', 'ventasNotas', idTarget));
                    } catch(e) {}

                    if (venta && venta.firestoreId && venta.firestoreId !== idTarget) {
                        try {
                            await FB.deleteDoc(FB.doc(window.appDb, 'artifacts', window.appId, 'public', 'data', 'ventasNotas', venta.firestoreId));
                        } catch(e) {}
                    }

                    const snap = await FB.getDocs(col('ventasNotas'));
                    for (const d of snap.docs) {
                        const data = d.data();
                        const coincideId = d.id === idTarget || (venta && d.id === venta.firestoreId);
                        const coincideLocal = data.id && (data.id === idTarget || (venta && (data.id === venta.localId || data.id === venta.id)));
                        const coincideAtributos = venta && data.numeroNota && data.numeroNota === venta.numeroNota && data.fecha === venta.fecha && data.cliente === venta.cliente && Math.abs((data.totalMonto || 0) - (venta.totalMonto || 0)) < 0.01;
                        if (coincideId || coincideLocal || coincideAtributos) {
                            await FB.deleteDoc(FB.doc(window.appDb, 'artifacts', window.appId, 'public', 'data', 'ventasNotas', d.id));
                        }
                    }
                }
            } catch(e) {
                console.error("Error al borrar definitivamente en Firestore:", e);
            }

            mostrarAviso("✓ Nota de venta eliminada definitivamente");
        };

        // ── MOTOR CRONOLÓGICO DE CARGA DIARIA, ARRASTRE AUTOMÁTICO DE SOBRANTE Y CIERRE DIARIO ──
        const controlDiarioPorFecha = useMemo(() => {
            const fechasSet = new Set([today]);
            if (filtroFechaVentas && filtroFechaVentas !== 'todas') fechasSet.add(filtroFechaVentas);
            (cargas || []).forEach(c => { if (c.fecha && c.rutaId !== 'local3puentes' && !c.sinUtilidad) fechasSet.add(c.fecha); });
            (ventasNotas || []).forEach(v => { if (v.fecha) fechasSet.add(v.fecha); });
            (docsDevolucion || []).forEach(d => { if (d.fecha) fechasSet.add(d.fecha); });
            (docsGasto || []).forEach(g => { if (g.fecha) fechasSet.add(g.fecha); });

            const fechasOrdenadas = Array.from(fechasSet).filter(Boolean).sort();
            const mapaFechas = {};
            let sobranteAcumulado = { p1: 0, p2: 0, p3: 0 };

            fechasOrdenadas.forEach(f => {
                const sobranteAnterior = { ...sobranteAcumulado };
                const cargaNueva = { p1: 0, p2: 0, p3: 0 };
                const vendidoNotas = { p1: 0, p2: 0, p3: 0 };
                const montoVendidoNotas = { p1: 0, p2: 0, p3: 0 };
                const devueltoClientes = { p1: 0, p2: 0, p3: 0 };

                // 1. Sumar cargas nuevas del día f
                (cargas || []).filter(c => c.fecha === f && c.rutaId !== 'local3puentes' && !c.sinUtilidad).forEach(c => {
                    (c.items || []).forEach(it => {
                        if (cargaNueva[it.id] !== undefined) {
                            cargaNueva[it.id] += (parseInt(it.q) || 0);
                        }
                    });
                });

                // 2. Sumar ventas de Notas de Venta del día f
                (ventasNotas || []).filter(v => v.fecha === f).forEach(v => {
                    (v.items || []).forEach(it => {
                        if (vendidoNotas[it.id] !== undefined) {
                            const q = parseInt(it.q) || 0;
                            const p = parseFloat(it.pvd) || 0;
                            vendidoNotas[it.id] += q;
                            montoVendidoNotas[it.id] += (Number(it.subtotal) || (q * p));
                        }
                    });
                });

                // 3. Sumar devoluciones de clientes del día f
                (docsDevolucion || []).filter(d => d.fecha === f).forEach(d => {
                    (d.items || []).forEach(it => {
                        if (devueltoClientes[it.id] !== undefined) {
                            devueltoClientes[it.id] += (parseInt(it.q) || 0);
                        }
                    });
                });

                // 4. Calcular Carga Disponible y Sobrante que pasa automáticamente al día siguiente
                const cargaTotalDisponible = { p1: 0, p2: 0, p3: 0 };
                const sobranteParaManana = { p1: 0, p2: 0, p3: 0 };

                PRODUCTOS_POLACA.forEach(p => {
                    const disp = (sobranteAnterior[p.id] || 0) + (cargaNueva[p.id] || 0);
                    cargaTotalDisponible[p.id] = disp;
                    const restado = (vendidoNotas[p.id] || 0) + (devueltoClientes[p.id] || 0);
                    sobranteParaManana[p.id] = Math.max(0, disp - restado);
                });

                mapaFechas[f] = {
                    fecha: f,
                    rutaOficial: obtenerRutaPorFecha(f),
                    sobranteAnterior,
                    cargaNueva,
                    cargaTotalDisponible,
                    vendidoNotas,
                    montoVendidoNotas,
                    devueltoClientes,
                    sobranteParaManana
                };

                sobranteAcumulado = { ...sobranteParaManana };
            });

            return { mapaFechas, fechasOrdenadas };
        }, [cargas, ventasNotas, docsDevolucion, docsGasto, filtroFechaVentas, today]);

        // Resumen y Cierre Diario Completo
        const resumenCierreDia = useMemo(() => {
            const fechaFiltro = filtroFechaVentas || today;
            const esTodas = filtroFechaVentas === 'todas';

            const ventasFiltradas = ventasNotas.filter(v => esTodas ? true : v.fecha === fechaFiltro);
            const gastosFiltradosDia = docsGasto.filter(g => esTodas ? true : g.fecha === fechaFiltro);
            const devolucionesFiltradasDia = docsDevolucion.filter(d => esTodas ? true : d.fecha === fechaFiltro);
            const cargasFiltradasDia = cargas.filter(c => (esTodas ? true : c.fecha === fechaFiltro) && c.rutaId !== 'local3puentes' && !c.sinUtilidad);

            const infoControlDia = (!esTodas && controlDiarioPorFecha.mapaFechas[fechaFiltro])
                ? controlDiarioPorFecha.mapaFechas[fechaFiltro]
                : null;

            const totalVentasMonto = ventasFiltradas.reduce((a, b) => a + (Number(b.totalMonto) || 0), 0);
            const totalUnidades = ventasFiltradas.reduce((a, b) => a + (Number(b.totalUnidades) || 0), 0);
            const totalClientes = ventasFiltradas.length;
            const ticketPromedio = totalClientes > 0 ? (totalVentasMonto / totalClientes) : 0;

            const porItem = PRODUCTOS_VENTA_BASE.map(prod => {
                let unidadesVendidas = 0;
                let montoVendido = 0;
                ventasFiltradas.forEach(v => {
                    const it = (v.items || []).find(item => item.id === prod.id);
                    if (it) {
                        const q = parseInt(it.q) || 0;
                        const p = parseFloat(it.pvd) || prod.pvd;
                        unidadesVendidas += q;
                        montoVendido += (Number(it.subtotal) || (q * p));
                    }
                });

                let unidadesDevueltas = 0;
                devolucionesFiltradasDia.forEach(d => {
                    const it = (d.items || []).find(item => item.id === prod.id);
                    if (it) unidadesDevueltas += (parseInt(it.q) || 0);
                });

                const sobranteAnterior = infoControlDia ? (infoControlDia.sobranteAnterior[prod.id] || 0) : 0;
                const cargaNueva = infoControlDia
                    ? (infoControlDia.cargaNueva[prod.id] || 0)
                    : cargasFiltradasDia.reduce((acc, c) => acc + ((c.items || []).find(i => i.id === prod.id)?.q || 0), 0);
                const cargaTotal = sobranteAnterior + cargaNueva;
                const sobranteManana = Math.max(0, cargaTotal - unidadesVendidas - unidadesDevueltas);

                const costoVendido = parseFloat((unidadesVendidas * prod.costo).toFixed(2));
                const utilidadBrutaItem = parseFloat((montoVendido - costoVendido).toFixed(2));
                const montoDevuelto = parseFloat((unidadesDevueltas * prod.pvd).toFixed(2));
                const costoDevuelto = parseFloat((unidadesDevueltas * prod.costo).toFixed(2));

                return {
                    ...prod,
                    sobranteAnterior,
                    cargaNueva,
                    cargaTotal,
                    montoCargaTotal: parseFloat((cargaTotal * prod.pvd).toFixed(2)),
                    unidadesVendidas,
                    montoVendido: parseFloat(montoVendido.toFixed(2)),
                    costoVendido,
                    utilidadBrutaItem,
                    unidadesDevueltas,
                    montoDevuelto,
                    costoDevuelto,
                    sobranteManana,
                    montoSobranteManana: parseFloat((sobranteManana * prod.pvd).toFixed(2)),
                    porcentajeTotal: totalVentasMonto > 0 ? ((montoVendido / totalVentasMonto) * 100).toFixed(1) : '0.0'
                };
            });

            const totalSobranteAnteriorUnids = porItem.reduce((a, b) => a + b.sobranteAnterior, 0);
            const totalCargaNuevaUnids = porItem.reduce((a, b) => a + b.cargaNueva, 0);
            const totalCargaDisponibleUnids = porItem.reduce((a, b) => a + b.cargaTotal, 0);
            const totalCargaDisponibleMonto = parseFloat(porItem.reduce((a, b) => a + b.montoCargaTotal, 0).toFixed(2));

            const totalCostoVentas = parseFloat(porItem.reduce((a, b) => a + b.costoVendido, 0).toFixed(2));
            const utilidadBrutaVentas = parseFloat((totalVentasMonto - totalCostoVentas).toFixed(2));

            const totalUnidadesDevueltas = porItem.reduce((a, b) => a + b.unidadesDevueltas, 0);
            const totalDevolucionesMonto = parseFloat(devolucionesFiltradasDia.reduce((a, d) => a + (parseFloat(d.perdidaTotal) || 0), 0).toFixed(2)) || parseFloat(porItem.reduce((a, b) => a + b.montoDevuelto, 0).toFixed(2));

            const totalSobranteMananaUnids = porItem.reduce((a, b) => a + b.sobranteManana, 0);
            const totalSobranteMananaMonto = parseFloat(porItem.reduce((a, b) => a + b.montoSobranteManana, 0).toFixed(2));

            const totalGastosOperativosDia = parseFloat(gastosFiltradosDia.reduce((a, g) => a + (parseFloat(g.monto) || 0), 0).toFixed(2));

            const utilidadTotalNetaDia = parseFloat((utilidadBrutaVentas - totalGastosOperativosDia - totalDevolucionesMonto).toFixed(2));
            const efectivoNetoCierreDia = parseFloat((totalVentasMonto - totalGastosOperativosDia - totalDevolucionesMonto).toFixed(2));

            const clientesMap = {};
            ventasFiltradas.forEach(v => {
                const nom = (v.cliente || 'Consumidor Final').trim();
                const key = nom.toLowerCase();
                if (!clientesMap[key]) {
                    clientesMap[key] = {
                        nombre: nom,
                        ciudad: v.ciudad || v.direccion || '',
                        telefono: v.telefono || '',
                        direccion: v.ciudad || v.direccion || '',
                        ventasCount: 0,
                        totalMonto: 0,
                        totalUnidades: 0,
                        tickets: []
                    };
                }
                clientesMap[key].ventasCount += 1;
                clientesMap[key].totalMonto += (Number(v.totalMonto) || 0);
                clientesMap[key].totalUnidades += (Number(v.totalUnidades) || 0);
                clientesMap[key].tickets.push(v);
            });

            const porCliente = Object.values(clientesMap).sort((a, b) => b.totalMonto - a.totalMonto);
            const rutaDelDia = obtenerRutaPorFecha(esTodas ? today : fechaFiltro);

            return {
                fecha: fechaFiltro,
                rutaDelDia,
                ventas: ventasFiltradas,
                gastosDiaLista: gastosFiltradosDia,
                devolucionesDiaLista: devolucionesFiltradasDia,
                cargasDiaLista: cargasFiltradasDia,
                totalSobranteAnteriorUnids,
                totalCargaNuevaUnids,
                totalCargaDisponibleUnids,
                totalCargaDisponibleMonto,
                totalVentasMonto: parseFloat(totalVentasMonto.toFixed(2)),
                totalCostoVentas,
                utilidadBrutaVentas,
                totalUnidades,
                totalUnidadesDevueltas,
                totalDevolucionesMonto,
                totalGastosOperativosDia,
                totalSobranteMananaUnids,
                totalSobranteMananaMonto,
                utilidadTotalNetaDia,
                efectivoNetoCierreDia,
                totalClientes,
                ticketPromedio: parseFloat(ticketPromedio.toFixed(2)),
                porItem,
                porCliente
            };
        }, [ventasNotas, docsGasto, docsDevolucion, cargas, controlDiarioPorFecha, filtroFechaVentas, today]);

        // Descargar PDF oficial de Nota de Venta para compartir al cliente
        const descargarPdfNotaVenta = (venta) => {
            const { jsPDF } = window.jspdf || {};
            if (typeof jsPDF !== 'function') {
                mostrarAviso("Librería PDF cargando... intenta nuevamente.");
                return;
            }
            try {
                const doc = new jsPDF({
                    orientation: 'portrait',
                    unit: 'mm',
                    format: 'a5'
                });

                const cVerdeOscuro = [7, 94, 84];     // #075E54
                const cTeal = [18, 140, 126];         // #128C7E
                const cGrisTexto = [51, 65, 85];
                const cGrisBorde = [203, 213, 225];

                doc.setFillColor(cVerdeOscuro[0], cVerdeOscuro[1], cVerdeOscuro[2]);
                doc.rect(0, 0, 148, 6, 'F');

                doc.setFont('helvetica', 'bold');
                doc.setFontSize(14);
                doc.setTextColor(cVerdeOscuro[0], cVerdeOscuro[1], cVerdeOscuro[2]);
                doc.text("ANDRÉS CÁRDENAS", 10, 15);

                doc.setFontSize(7.5);
                doc.setFont('helvetica', 'bold');
                doc.setTextColor(cTeal[0], cTeal[1], cTeal[2]);
                doc.text("DISTRIBUIDOR DE AVENA POLACA", 10, 19.5);

                doc.setFont('helvetica', 'normal');
                doc.setFontSize(6.5);
                doc.setTextColor(cGrisTexto[0], cGrisTexto[1], cGrisTexto[2]);
                doc.text("RUC: " + PROVEEDOR_UNICO.ruc + " | Matriz: " + PROVEEDOR_UNICO.direccion.substring(0, 42), 10, 24);
                doc.text("Teléfonos: " + PROVEEDOR_UNICO.telefonos, 10, 27.5);

                doc.setDrawColor(cTeal[0], cTeal[1], cTeal[2]);
                doc.setLineWidth(0.6);
                doc.setFillColor(248, 250, 252);
                doc.roundedRect(88, 10, 50, 21, 2, 2, 'FD');

                doc.setFillColor(cVerdeOscuro[0], cVerdeOscuro[1], cVerdeOscuro[2]);
                doc.rect(88, 10, 50, 6, 'F');
                doc.setTextColor(255, 255, 255);
                doc.setFontSize(7.5);
                doc.setFont('helvetica', 'bold');
                doc.text("NOTA DE VENTA / RECIBO", 113, 14.5, { align: 'center' });

        const reporteGananciasDiarias = useMemo(() => {
            const diasMap = {};

            const asegurarDia = (f) => {
                if (!diasMap[f]) {
                    diasMap[f] = {
                        fecha: f,
                        unidadesVendidas: { p1: 0, p2: 0, p3: 0 },
                        totalUnidades: 0,

            (ventasNotas || []).forEach(v => {
                const f = v.fecha || today;
                asegurarDia(f);
                let ventaNota = 0;
                let costoNota = 0;

                (v.items || []).forEach(it => {
                    const q = parseInt(it.q) || 0;
                    if (q > 0) {
                        const prodBase = PRODUCTOS_POLACA.find(p => p.id === it.id);
                        const pvd = parseFloat(it.pvd) || prodBase?.pvd || 0;
                        const costo = parseFloat(it.costo) || prodBase?.costo || 0;
                        diasMap[f].unidadesVendidas[it.id] = (diasMap[f].unidadesVendidas[it.id] || 0) + q;
                        diasMap[f].totalUnidades += q;
                        const vItem = Number(it.subtotal) || (q * pvd);
                        const cItem = q * costo;
                        ventaNota += vItem;
                        costoNota += cItem;
                    }
                });

                diasMap[f].ventaTotal += ventaNota;
                diasMap[f].costoTotal += costoNota;
                diasMap[f].utilidadBruta += (ventaNota - costoNota);
                diasMap[f].detallesRutas.push({
                    vendedor: `${v.cliente || 'Cliente'} (${v.ciudad || v.direccion || 'Ruta'})`,
                    ventaNeta: ventaNota,
                    depositado: ventaNota,
                    gastos: {}
                });
            });

            // 2. Cargas liquidadas históricas (compatibilidad hacia atrás si en esa fecha no hubo Notas de Venta)
            cargas.filter(c => c.estado === 'liquidada' && c.rutaId !== 'local3puentes' && !c.sinUtilidad).forEach(c => {
                const f = c.fechaLiquidacion || c.fecha;
                const tieneNotasEseDia = (ventasNotas || []).some(v => v.fecha === f);
                if (tieneNotasEseDia) return;
                asegurarDia(f);

                let costoRuta = 0;

                (c.items || []).forEach(it => {
                    const dev = devs.find(d => d.id === it.id)?.q || 0;
                    const vendidas = Math.max(0, it.q - dev);
                    if (vendidas > 0) {
                        diasMap[f].unidadesVendidas[it.id] = (diasMap[f].unidadesVendidas[it.id] || 0) + vendidas;
                        diasMap[f].totalUnidades += vendidas;
                        const vItem = vendidas * (it.pvd || 0);
                        const cItem = vendidas * (it.costo || 0);
                        ventaRuta += vItem;
                        costoRuta += cItem;
                    }
                });

                const utilBrutaRuta = ventaRuta - costoRuta;
                diasMap[f].ventaTotal += ventaRuta;
                diasMap[f].costoTotal += costoRuta;
                diasMap[f].utilidadBruta += utilBrutaRuta;

                if (c.gastos) {
                    const gRutaVal = Object.values(c.gastos).reduce((acc, val) => acc + (parseFloat(val) || 0), 0);
                    diasMap[f].gastosRutas += gRutaVal;
                }

                diasMap[f].detallesRutas.push({
                    vendedor: c.responsable,
                    ventaNeta: c.ventaNeta || ventaRuta,
                    depositado: c.totalADepositar,
                    gastos: c.gastos
                });
            });

            // 3. Gastos Operativos Manuales
            docsGasto.forEach(g => {
                const f = g.fecha;
                const m = parseFloat(g.monto) || 0;
                asegurarDia(f);
                diasMap[f].gastosDirectos += m;
                diasMap[f].detallesGastos.push({
                    categoria: g.categoria,
                    concepto: g.concepto,
                    monto: m,
                    archivo: g.archivo,
                    tipoArchivo: g.tipoArchivo,
                    detalle: g.detalleMantenimiento || g.nombreHotel || g.tipoComida
                });
            });

            // 4. Devoluciones de Clientes (100% pérdida)
            docsDevolucion.forEach(dev => {
                const f = dev.fecha;
                const perdida = parseFloat(dev.perdidaTotal) || 0;
                asegurarDia(f);
                diasMap[f].perdidasDevoluciones = (diasMap[f].perdidasDevoluciones || 0) + perdida;
                diasMap[f].unidadesDevueltasPerdida = (diasMap[f].unidadesDevueltasPerdida || 0) + (dev.totalUnidades || 0);
                diasMap[f].detallesDevoluciones.push({
                    cliente: dev.cliente,
                    vendedor: dev.vendedor,
                    motivo: dev.motivo,
                    motivoDetalle: dev.motivoDetalle,
                    monto: perdida,
                    unidades: dev.totalUnidades,
                    archivo: dev.archivo,
                    tipoArchivo: dev.tipoArchivo,
                    items: dev.items
                });
            });

            return Object.values(diasMap).map(d => {
                const totalGastosDia = (d.gastosDirectos || 0) + (d.gastosRutas || 0);
                const totalPerdidaDev = d.perdidasDevoluciones || 0;
                const gananciaNeta = d.utilidadBruta - totalGastosDia - totalPerdidaDev;
                const margenNeto = d.ventaTotal > 0 ? (gananciaNeta / d.ventaTotal) * 100 : 0;
                return {
                    ...d,
                    totalGastosDia,
                    totalPerdidaDev,
                    gananciaNeta,
                    margenNeto
                };
            }).sort((a,b) => b.fecha.localeCompare(a.fecha));
        }, [ventasNotas, cargas, docsGasto, docsDevolucion, today]);

        const gananciasFiltradas = useMemo(() => {
            return reporteGananciasDiarias.filter(d => {
                const ok1 = filtroInicio ? d.fecha >= filtroInicio : true;
                const ok2 = filtroFin ? d.fecha <= filtroFin : true;
                return ok1 && ok2;
            });
        }, [reporteGananciasDiarias, filtroInicio, filtroFin]);

        const totalesGanancias = useMemo(() => {
            const vTotal = gananciasFiltradas.reduce((a, d) => a + d.ventaTotal, 0);
            const cTotal = gananciasFiltradas.reduce((a, d) => a + d.costoTotal, 0);
            const uBruta = gananciasFiltradas.reduce((a, d) => a + d.utilidadBruta, 0);
            const gTotal = gananciasFiltradas.reduce((a, d) => a + d.totalGastosDia, 0);
            const pDevTotal = gananciasFiltradas.reduce((a, d) => a + (d.totalPerdidaDev || 0), 0);
            const gNeta  = gananciasFiltradas.reduce((a, d) => a + d.gananciaNeta, 0);
            const uUnids = gananciasFiltradas.reduce((a, d) => a + d.totalUnidades, 0);
            const diaHoy = gananciasFiltradas.find(d => d.fecha === today);
            return {
                vTotal, cTotal, uBruta, gTotal, pDevTotal, gNeta, uUnids,
                gananciaHoy: diaHoy ? diaHoy.gananciaNeta : 0
            };
        }, [gananciasFiltradas, today]);

        // Libro contable consolidado
        const libroCompleto = useMemo(() => {
            let data = [];
            (ventasNotas || []).forEach(v => {
                data.push({
                    fecha: v.fecha || today,
                    desc: `NOTA DE VENTA ${v.numeroNota || ''}: ${v.cliente || 'Cliente'} (${v.ciudad || v.direccion || 'Ruta'})`,
                    ingreso: parseFloat(v.totalMonto) || 0,
                    egreso: 0,
                    tipo: 'VENTA'
                });
            });

            cargas.filter(c => c.estado === 'liquidada').forEach(c =>
                data.push({ fecha: c.fechaLiquidacion || c.fecha, desc: `DEPÓSITO RUTA: ${c.responsable}`, ingreso: parseFloat(c.totalADepositar)||0, egreso: 0, tipo: 'RUTA' }));

            docsCompra.forEach(d => {
                (d.pagos || []).forEach(p => {
                    data.push({
                        fecha: p.fecha,
                        desc: `PAGO PROVEEDOR (${p.metodo?.toUpperCase()}): ${d.proveedor} F#${d.numFact}`,
                        ingreso: 0,
                        egreso: parseFloat(p.monto) || 0,
                        tipo: 'PAGO_COMPRA',
                        comprobante: p.archivo,
                        tipoComprobante: p.tipoArchivo,
                        textoEfectivo: p.detalleTextoEfectivo
                    });
                });
            });

            docsGasto.forEach(d => {
                const monto = parseFloat(d.monto) || 0;
                if (monto > 0) {
                    data.push({ fecha: d.fecha, desc: `GASTO OPERATIVO (${d.categoria?.toUpperCase()}): ${d.concepto || d.notas || 'Sin detalle'}`, ingreso: 0, egreso: monto, tipo: 'GASTO' });
                }
            });

            movManuales.forEach(m =>
                data.push({ fecha: m.fecha, desc: m.desc.toUpperCase(), ingreso: m.tipo === 'ingreso' ? parseFloat(m.monto)||0 : 0, egreso: m.tipo === 'egreso' ? parseFloat(m.monto)||0 : 0, tipo: 'MANUAL' }));

            data.sort((a,b) => new Date(a.fecha) - new Date(b.fecha));
            let saldo = 0;
            return data.map(m => {
                saldo += (m.ingreso - m.egreso);
                return { ...m, saldoActual: saldo };
            }).reverse();
        }, [ventasNotas, cargas, docsCompra, docsGasto, movManuales, today]);

        const libroFiltrado = useMemo(() => libroCompleto.filter(m => {
            const ok1 = filtroInicio ? m.fecha >= filtroInicio : true;
            const ok2 = filtroFin   ? m.fecha <= filtroFin   : true;
            return ok1 && ok2;
        }), [libroCompleto, filtroInicio, filtroFin]);

        const resumenCaja = useMemo(() => {
            const ing = libroFiltrado.reduce((a, m) => a + m.ingreso, 0);
            const eg  = libroFiltrado.reduce((a, m) => a + m.egreso, 0);
            return { ing, eg, saldo: ing - eg };
        }, [libroFiltrado]);

        // Filtrado de compras
        const comprasFiltradas = useMemo(() => {
            return docsCompra.filter(c => {
                const matchTexto = busquedaCompra
                    ? (c.proveedor?.toLowerCase().includes(busquedaCompra.toLowerCase()) || c.numFact?.includes(busquedaCompra) || c.notas?.toLowerCase().includes(busquedaCompra.toLowerCase()))
                    : true;
                const matchFechaIni = filtroInicio ? c.fecha >= filtroInicio : true;
                const matchFechaFin = filtroFin ? c.fecha <= filtroFin : true;
                return matchTexto && matchFechaIni && matchFechaFin;
            }).sort((a,b) => new Date(b.fecha || b.createdAt || 0) - new Date(a.fecha || a.createdAt || 0));
        }, [docsCompra, busquedaCompra, filtroInicio, filtroFin]);

        // Filtrado de gastos
        const gastosFiltrados = useMemo(() => {
            return docsGasto.filter(g => {
                const matchCat = filtroGastoCat === 'todos' ? true : g.categoria === filtroGastoCat;
                const matchFechaIni = filtroInicio ? g.fecha >= filtroInicio : true;
                const matchFechaFin = filtroFin ? g.fecha <= filtroFin : true;
                return matchCat && matchFechaIni && matchFechaFin;
            }).sort((a,b) => new Date(b.fecha || b.createdAt || 0) - new Date(a.fecha || a.createdAt || 0));
        }, [docsGasto, filtroGastoCat, filtroInicio, filtroFin]);

        const totalGastosPorCat = useMemo(() => {
            return {

                otros:        docsGasto.filter(g => g.categoria === 'otros' || (!['alimentacion','combustible','mantenimiento','hospedaje','accesorios'].includes(g.categoria))).reduce((a, g) => a + (parseFloat(g.monto)||0), 0),
            };
        }, [docsGasto]);

        // Guardar o Actualizar Factura de Compra de Avena Polaca (Con soporte para los 2 Destinos)

                    // SI EL DESTINO ES LOCAL 3 PUENTES (O PARTE EN MIXTO):
                    // Se despacha exactamente al precio de compra (sin utilidad) y se da de baja como cliente final (no requiere seguimiento)
                    if (destinoFinal === '3puentes' || destinoFinal === 'mixto') {
                        const itemsPara3P = formDocCompra.items.map(it => {

                            const cBase = Number(it.costo || 0);

                                subtotalSinIva: parseFloat((cantidad3P * cBase).toFixed(4)),
                                totalVenta: parseFloat((cantidad3P * cIva).toFixed(2)),

                                totalCarga: parseFloat(totalConIva3P.toFixed(2)),
                                totalCargado: parseFloat(totalConIva3P.toFixed(2)),
                                totalConIva: parseFloat(totalConIva3P.toFixed(2)),
                                totalCosto: parseFloat(subtotalSinIva3P.toFixed(4)),
                                totalSinIva: parseFloat(subtotalSinIva3P.toFixed(4)),
                                totalIva: parseFloat(totalIva3P.toFixed(4)),
                                totalVenta: parseFloat(totalConIva3P.toFixed(2)),
                                ventaNeta: parseFloat(totalConIva3P.toFixed(2)),
                                totalADepositar: parseFloat(totalConIva3P.toFixed(2)),
                                utilidadBruta: 0,
                                depositoReportado: parseFloat(totalConIva3P.toFixed(2)),
                                totalUnidades: totalUnids3P,
                                notas: `Factura ${numFactFinal}: ${totalUnids3P} unidades enviadas a Local 3 Puentes al costo + 15% IVA ($${totalConIva3P.toFixed(2)}) sin utilidad. Cliente final dado de baja.`,

                            };

                        mostrarAviso("¡Factura guardada! Unidades distribuidas entre Andrés Cárdenas y Local 3 Puentes.");
                    } else {
                        mostrarAviso("¡Factura guardada para Andrés Cárdenas! Items ingresados a Bodega para distribución con utilidad.");

                }

                setError(e.message || "Error al guardar factura");
            } finally {
                setIsSaving(false);
            }
        };

        // REGISTRAR PAGO / ABONO A FACTURA DE COMPRA
        const registrarPagoAbonoFactura = async () => {

        const guardarDocGasto = async () => {

            } else if (formDocGasto.categoria === 'hospedaje') {
                montoFinal = parseFloat(formDocGasto.monto);
                if (!conceptoFinal) conceptoFinal = `Hospedaje: ${formDocGasto.nombreHotel || 'Hotel'}`;
            } else if (formDocGasto.categoria === 'accesorios') {

            } else if (formDocGasto.categoria === 'otros') {
                montoFinal = parseFloat(formDocGasto.monto);
                if (!conceptoFinal) conceptoFinal = formDocGasto.detalleOtros ? `Otros: ${formDocGasto.detalleOtros}` : 'Otros Gastos';
            } else {
                montoFinal = parseFloat(formDocGasto.monto);

        // ── ESTRUCTURA OFICIAL DE GASTOS MENSUALES PRESUPUESTADOS (COSTOS FIJOS OPERATIVOS) ──
        // Los gastos operativos fijos son SOLO el Crédito Vehículo de $436.00;
        // todo lo demás se registra manualmente en Gastos (docsGasto) y se suma al cierre como Gasto Operativo.
        const GASTOS_PRESUPUESTADOS = {
            pagoVehiculoMensual: 436.00,   // Único gasto operativo fijo mensual: Crédito Vehículo $436.00
            mesesPlazoVehiculo: 36,
            creditoDosAnosMensual: 0.00,

            gasolinaMensual: 0.00,         // Se registra manualmente en Gastos
            hotelesMensual: 0.00,          // Se registra manualmente en Gastos
            mantenimientoVehiculo: 0.00,   // Se registra manualmente en Gastos
            alimentacionMensual: 0.00,     // Se registra manualmente en Gastos
            ayudanteRutaMensual: 0.00,     // Se registra manualmente en Gastos
            parqueoMensual: 0.00,          // Se registra manualmente en Gastos
            planInternet: 0.00             // Se registra manualmente en Gastos
        };

        const presupuestoGastosMensual = useMemo(() => {
            const dias = parseInt(diasRutaMes) || 20;

            // Total Gasto Operativo Fijo Mensual: SOLO Crédito Vehículo ($436.00)
            const totalFijo = GASTOS_PRESUPUESTADOS.pagoVehiculoMensual;

            // Margen Bruto Ponderado sobre Ventas de los 3 productos (~20.5%)
            const margenPonderado = 0.2050;
            // Punto de Equilibrio Fijo en Ventas = Costo Fijo ($436) / Margen Bruto
            const ventaPuntoEquilibrio = totalFijo / margenPonderado;
            const ventaDiariaEquilibrio = dias > 0 ? (ventaPuntoEquilibrio / dias) : 0;
            const ventaPorRutaEquilibrio = ventaDiariaEquilibrio;

            return {
                ...GASTOS_PRESUPUESTADOS,
                diasRutaMes: dias,
                totalFijo,
                margenPonderado,
                ventaPuntoEquilibrio,
                ventaDiariaEquilibrio,
                ventaPorRutaEquilibrio
            };
        }, [diasRutaMes]);

        // ── CÁLCULO DE BALANCE MENSUAL: VENTAS (NOTAS DE VENTA) VS COMPRAS, CRÉDITO VEHÍCULO ($436) Y GASTOS OPERATIVOS MANUALES ──
        const balanceMensualData = useMemo(() => {
            const notasMes = (ventasNotas || []).filter(v => (v.fecha || '').startsWith(mesBalance));
            const cargasMes = (cargas || []).filter(c => {
                const f = c.fechaLiquidacion || c.fecha || '';
                return f.startsWith(mesBalance) && c.rutaId !== 'local3puentes' && !c.sinUtilidad;
            });

            let ventaBruta = 0;
            let costoMercaderia = 0;
            let totalUnidadesVendidas = 0;
            let gastosRutas = 0;
            let totalCargadoUnids = 0;
            let totalDevueltoUnids = 0;

            // Sumar unidades cargadas en el mes
            cargasMes.forEach(c => {
                (c.items || []).forEach(it => {
                    totalCargadoUnids += (parseInt(it.q) || 0);
                });
            });

            // Sumar ventas desde las Notas de Venta Ágiles del mes
            notasMes.forEach(v => {
                (v.items || []).forEach(it => {
                    const q = parseInt(it.q) || 0;
                    if (q > 0) {
                        const prodBase = PRODUCTOS_POLACA.find(p => p.id === it.id);
                        const pvd = parseFloat(it.pvd) || prodBase?.pvd || 0;
                        const costo = parseFloat(it.costo) || prodBase?.costo || 0;
                        totalUnidadesVendidas += q;
                        ventaBruta += (Number(it.subtotal) || (q * pvd));
                        costoMercaderia += (q * costo);
                    }
                });
            });

            // Si hay cargas liquidadas antiguas en días sin Notas de Venta
            cargasMes.filter(c => c.estado === 'liquidada').forEach(c => {
                const f = c.fechaLiquidacion || c.fecha || '';
                const tieneNotas = notasMes.some(v => v.fecha === f);
                if (tieneNotas) return;
                gastosRutas += (parseFloat(c.gastosTotal) || 0);
                const devs = c.itemsDevueltos || [];
                (c.items || []).forEach(it => {
                    const dev = devs.find(d => d.id === it.id)?.q || 0;
                    const vend = Math.max(0, it.q - dev);
                    totalDevueltoUnids += dev;
                    totalUnidadesVendidas += vend;
                    ventaBruta += vend * it.pvd;
                    costoMercaderia += vend * it.costo;
                });
            });

            const utilidadBruta = ventaBruta - costoMercaderia;

            // Compras del mes (docsCompra)
            const comprasMes = (docsCompra || []).filter(d => (d.fecha || '').startsWith(mesBalance));
            const totalMontoComprasMes = comprasMes.reduce((a, d) => a + (parseFloat(d.monto) || parseFloat(d.subtotal) || 0), 0);
            const totalUnidadesCompradasMes = comprasMes.reduce((a, d) => a + (d.items || []).reduce((acc, it) => acc + (parseInt(it.q) || 0), 0), 0);

            // Gastos operativos manuales del mes (docsGasto)
            const gastosOperativos = (docsGasto || [])
                .filter(g => (g.fecha || '').startsWith(mesBalance))
                .reduce((a, g) => a + (parseFloat(g.monto) || 0), 0);

            // Devoluciones del mes (100% pérdida)
            const devolucionesMes = (docsDevolucion || []).filter(d => (d.fecha || '').startsWith(mesBalance));
            const perdidaDevoluciones = devolucionesMes.reduce((a, d) => a + (parseFloat(d.perdidaTotal) || 0), 0);
            const unidadesPerdidasDevolucion = devolucionesMes.reduce((a, d) => a + (parseInt(d.totalUnidades) || 0), 0);

            // Costo fijo operativo del mes: SOLO Crédito Vehículo ($436.00)
            const totalGastosFijos = presupuestoGastosMensual.totalFijo;

            // Total de gastos y deducciones (Crédito Vehículo $436 + Gastos Operativos Manuales + Devoluciones)
            const totalGastosYDeducciones = totalGastosFijos + gastosRutas + gastosOperativos + perdidaDevoluciones;
            const utilidadNetaReal = utilidadBruta - totalGastosYDeducciones;
            const margenNetoPorc = ventaBruta > 0 ? ((utilidadNetaReal / ventaBruta) * 100) : 0;

            const margenBrutoRealPorc = ventaBruta > 0 ? (utilidadBruta / ventaBruta) : presupuestoGastosMensual.margenPonderado;

            // Punto de Equilibrio Total del Mes (Crédito Vehículo $436 + Gastos Operativos Manuales)
            const costosTotalesOperacion = totalGastosFijos + gastosOperativos;
            const metaEquilibrio = margenBrutoRealPorc > 0 ? (costosTotalesOperacion / margenBrutoRealPorc) : presupuestoGastosMensual.ventaPuntoEquilibrio;
            const porcPuntoEquilibrio = metaEquilibrio > 0 ? ((ventaBruta / metaEquilibrio) * 100) : 0;
            const faltaParaEquilibrio = Math.max(0, metaEquilibrio - ventaBruta);
            const superavitEquilibrio = Math.max(0, ventaBruta - metaEquilibrio);

            const balanceVentaVsCompraMonto = ventaBruta - totalMontoComprasMes;
            const balanceUnidadesInventario = totalUnidadesCompradasMes - totalUnidadesVendidas;

            return {
                mes: mesBalance,
                cargasMesCount: notasMes.length || cargasMes.length,
                totalCargadoUnids,
                totalDevueltoUnids,
                totalUnidadesVendidas,
                ventaBruta,
                costoMercaderia,
                utilidadBruta,
                margenBrutoRealPorc,
                totalGastosFijos,
                gastosRutas,
                gastosOperativos,
                perdidaDevoluciones,
                unidadesPerdidasDevolucion,
                pagoVehiculo: GASTOS_PRESUPUESTADOS.pagoVehiculoMensual,
                creditoDosAnos: 0,
                totalGastosYDeducciones,
                utilidadNetaReal,
                margenNetoPorc,
                metaEquilibrio,
                porcPuntoEquilibrio,
                faltaParaEquilibrio,
                superavitEquilibrio,
                comprasMesCount: comprasMes.length,
                totalMontoComprasMes,
                totalUnidadesCompradasMes,
                balanceVentaVsCompraMonto,
                balanceUnidadesInventario
            };
        }, [ventasNotas, cargas, docsGasto, docsDevolucion, docsCompra, mesBalance, presupuestoGastosMensual]);

        // ── FILTRO CONSOLIDADO PARA REPORTES EXCEL (DIARIO / SEMANAL / MENSUAL / RANGO) ──
        const reporteExcelConsolidado = useMemo(() => {
            const desde = fechaReporteDesde;
            const hasta = fechaReporteHasta;

            const notasPeriodo = (ventasNotas || []).filter(v => (v.fecha || '') >= desde && (v.fecha || '') <= hasta);
            const cargasPeriodo = cargas.filter(c => {
                const f = c.fechaLiquidacion || c.fecha || '';
                return f >= desde && f <= hasta && c.rutaId !== 'local3puentes' && !c.sinUtilidad;
            });

            const gastosPeriodo = docsGasto.filter(g => (g.fecha || '') >= desde && (g.fecha || '') <= hasta);
            const devsPeriodo   = docsDevolucion.filter(d => (d.fecha || '') >= desde && (d.fecha || '') <= hasta);

            let unidsCargadas = 0;
            let unidsSobrantes = 0;
            let unidsVendidas = 0;
            let totalVenta = 0;
            let totalCosto = 0;
            let gastosRutaTotal = 0;

            const resumenPorProducto = PRODUCTOS_POLACA.map(p => {
                let carg = 0, vend = 0, devCli = 0, ventaMonto = 0;
                cargasPeriodo.forEach(c => {
                    const item = c.items?.find(it => it.id === p.id);
                    carg += (item ? (parseInt(item.q) || 0) : 0);
                });
                notasPeriodo.forEach(v => {
                    const it = (v.items || []).find(i => i.id === p.id);
                    if (it) {
                        const q = parseInt(it.q) || 0;
                        const pr = parseFloat(it.pvd) || p.pvd;
                        vend += q;
                        ventaMonto += (Number(it.subtotal) || (q * pr));
                    }
                });
                devsPeriodo.forEach(d => {
                    const it = (d.items || []).find(i => i.id === p.id);
                    if (it) devCli += (parseInt(it.q) || 0);
                });
                const sob = Math.max(0, carg - vend - devCli);
                const cTot = vend * p.costo;
                return {
                    ...p,
                    carg,
                    sob,
                    vend,
                    ventaTotal: ventaMonto,
                    costoTotal: cTot,
                    utilidadBruta: ventaMonto - cTot
                };
            });

            resumenPorProducto.forEach(r => {
                unidsCargadas += r.carg;
                unidsSobrantes += r.sob;
                unidsVendidas += r.vend;
                totalVenta += r.ventaTotal;
                totalCosto += r.costoTotal;
            });

            const utilidadBruta = totalVenta - totalCosto;
            const gastosGenerales = gastosPeriodo.reduce((a, g) => a + (parseFloat(g.monto) || 0), 0);
            const perdidaDevs = devsPeriodo.reduce((a, d) => a + (parseFloat(d.perdidaTotal) || 0), 0);
            const unidsBajasDevs = devsPeriodo.reduce((a, d) => a + (parseInt(d.totalUnidades) || 0), 0);

            const pagoVehiculoPeriodo = GASTOS_PRESUPUESTADOS.pagoVehiculoMensual;
            const creditoPeriodo = 0;
            const utilidadNeta = utilidadBruta - gastosRutaTotal - gastosGenerales - perdidaDevs;

            return {
                desde,
                hasta,
                notasPeriodo,
                cargasPeriodo,
                gastosPeriodo,
                devsPeriodo,
                unidsCargadas,
                unidsSobrantes,
                unidsVendidas,
                totalVenta,
                totalCosto,
                utilidadBruta,
                gastosRutaTotal,
                gastosGenerales,
                perdidaDevs,
                unidsBajasDevs,
                pagoVehiculoPeriodo,
                creditoPeriodo,
                utilidadNeta,
                resumenPorProducto
            };
        }, [ventasNotas, cargas, docsGasto, docsDevolucion, fechaReporteDesde, fechaReporteHasta]);

        // ── FUNCIÓN EXPORTAR REPORTE COMPLETO EN EXCEL (.XLSX) ──
        const descargarReporteExcel = () => {

                if (typeof XLSX !== 'undefined') {

                    // Hoja 1: Resumen Ejecutivo
                    const resumenRows = [

                        [],

                        ["Ingresos por Ventas (PVD con IVA)", `$${rep.totalVenta.toFixed(2)}`, "Total notas de venta"],
                        ["Costo de Mercadería Vendida (con IVA)", `$${rep.totalCosto.toFixed(2)}`, "Costo compra ($0.31, $0.70, $0.89)"],
                        ["Utilidad Bruta de Ventas", `$${rep.utilidadBruta.toFixed(2)}`, "Ganancia bruta antes de gastos"],

                        ["(=) UTILIDAD NETA DESPUÉS DE CRÉDITO VEHÍCULO", `$${(rep.utilidadNeta - (rep.pagoVehiculoPeriodo || 0)).toFixed(2)}`, "Resultado final después de cuota vehicular"]

                    const wsResumen = XLSX.utils.aoa_to_sheet(resumenRows);

                    // Hoja 2: Ventas por los 3 Productos
                    const prodHeaders = [["CÓDIGO", "PRODUCTO", "CARGA (U)", "VENDIDO NOTAS (U)", "SOBRANTE AUTOMÁTICO (U)", "PRECIO COMPRA ($)", "PRECIO VENTA ($)", "VENTA TOTAL ($)", "COSTO TOTAL ($)", "UTILIDAD BRUTA ($)"]];
                    const prodRows = rep.resumenPorProducto.map(p => [
                        p.codigo,
                        p.nombreCorto || p.nombre,
                        p.carg,
                        p.vend,
                        p.sob,
                        p.costo,
                        p.pvd,
                        parseFloat(p.ventaTotal.toFixed(2)),
                        parseFloat(p.costoTotal.toFixed(2)),
                        parseFloat(p.utilidadBruta.toFixed(2))
                    ]);
                    const wsProd = XLSX.utils.aoa_to_sheet([...prodHeaders, ...prodRows]);
                    XLSX.utils.book_append_sheet(wb, wsProd, "3 Productos");

                    // Hoja 3: Notas de Venta Ágiles
                    const notasHeaders = [["FECHA", "HORA", "NOTA", "NOMBRE CLIENTE", "CIUDAD", "VASO 165G ($0.42)", "VASO 340G ($0.84)", "BOTELLA 1/2L ($1.04)", "TOTAL UNIDS", "TOTAL VENTA ($)"]];
                    const notasRows = rep.notasPeriodo.map(v => {
                        const its = v.items || [];
                        return [
                            v.fecha,
                            v.hora || '',
                            v.numeroNota || '',
                            v.cliente || '',
                            v.ciudad || v.direccion || '',
                            its.find(i=>i.id==='p1')?.q || 0,
                            its.find(i=>i.id==='p2')?.q || 0,
                            its.find(i=>i.id==='p3')?.q || 0,

                        ];
                    });
                    const wsNotas = XLSX.utils.aoa_to_sheet([...notasHeaders, ...notasRows]);
                    XLSX.utils.book_append_sheet(wb, wsNotas, "Notas de Venta");

                    // Hoja 4: Gastos Operativos
                    const gastoHeaders = [["FECHA", "CATEGORÍA", "CONCEPTO / DETALLE", "MONTO ($)"]];
                    const gastoRows = rep.gastosPeriodo.map(g => [
                        g.fecha,
                        g.categoria,
                        g.concepto || g.notas || '-',
                        parseFloat((g.monto || 0).toFixed(2))
                    ]);
                    const wsGastos = XLSX.utils.aoa_to_sheet([...gastoHeaders, ...gastoRows]);
                    XLSX.utils.book_append_sheet(wb, wsGastos, "Gastos Operativos");

                    // Hoja 5: Devoluciones (3 Productos)
                    const devHeaders = [["FECHA", "NOMBRE CLIENTE", "VASO 165G", "VASO 340G", "BOTELLA 1/2 L", "TOTAL UNIDS", "VALOR DEVOLUCIÓN ($)"]];
                    const devRows = rep.devsPeriodo.map(d => {
                        const its = d.items || [];
                        return [
                            d.fecha,
                            d.cliente,
                            its.find(i=>i.id==='p1')?.q || 0,
                            its.find(i=>i.id==='p2')?.q || 0,
                            its.find(i=>i.id==='p3')?.q || 0,
                            d.totalUnidades,

                    const wsDevs = XLSX.utils.aoa_to_sheet([...devHeaders, ...devRows]);
                    XLSX.utils.book_append_sheet(wb, wsDevs, "Devoluciones");

                    XLSX.writeFile(wb, nombreArchivo);
                    mostrarAviso("¡Reporte Excel descargado con éxito!");
                } else {
                    let csv = "\uFEFF";
                    csv += "AUSTROPOLACA CONTROL - REPORTE DE ACTIVIDAD\n";
                    csv += `Periodo,${rep.desde} al ${rep.hasta}\n\n`;
                    csv += "INDICADOR,VALOR\n";
                    csv += `Unidades Cargadas,${rep.unidsCargadas}\n`;
                    csv += `Unidades Vendidas,${rep.unidsVendidas}\n`;
                    csv += `Sobrante Automatico Manana,${rep.unidsSobrantes}\n`;
                    csv += `Venta Bruta Total,${rep.totalVenta.toFixed(2)}\n`;
                    csv += `Costo Mercaderia,${rep.totalCosto.toFixed(2)}\n`;

                    csv += `Credito Vehiculo Fijo,${(rep.pagoVehiculoPeriodo || 0).toFixed(2)}\n`;

                    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                    const a = document.createElement("a");
                    a.href = URL.createObjectURL(blob);
                    a.download = nombreArchivo.replace('.xlsx', '.csv');
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    mostrarAviso("¡Reporte descargado en formato CSV!");
                }
            } catch(e) {
                console.error("Error al exportar:", e);
                setError("Error al generar el archivo Excel: " + (e.message || e));

        // Pestañas de navegación
        const navItems = [

            { id: 'bodega',         icon: 'package',          label: 'Bodega',            badge: totalesBodega.stockTotal + ' u.' },
            { id: 'rutas',          icon: 'truck',            label: 'Carga & Rutas',     badge: 'Sem.' },
            { id: 'balanceMensual', icon: 'scale',            label: 'Balance Mensual',   badge: 'Mes' },
            { id: 'reportesExcel',  icon: 'file-spreadsheet', label: 'Reportes Excel',    badge: 'XLSX' },
            { id: 'devoluciones',   icon: 'rotate-ccw',       label: 'Devoluciones',      badge: totalesDevoluciones.totalUnidades > 0 ? (totalesDevoluciones.totalUnidades + ' u.') : undefined },

        <div className="min-h-screen md:pl-64 flex flex-col text-left">

                        title="Abrir Menú Lateral de Pestañas"
                    >
                        <Icon name="menu" size={20}/>
                    </button>
                    <div className="h-9 w-9 sm:h-10 sm:w-10 rounded-2xl bg-white p-0.5 shadow-md flex items-center justify-center overflow-hidden border border-white/40 shrink-0">
                        <img src="image.jpg" alt="AustroPolaca" className="h-full w-full object-contain" />

    class ErrorBoundary extends React.Component {
        constructor(props) {
            super(props);
            this.state = { hasError: false, error: null };
        }
        static getDerivedStateFromError(error) {
            return { hasError: true, error };
        }
        componentDidCatch(error, errorInfo) {
            console.error("ErrorBoundary caught an error:", error, errorInfo);
        }
        render() {
            if (this.state.hasError) {
                return (
                    <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4 text-white">
                        <div className="bg-white text-slate-800 p-6 rounded-3xl max-w-md w-full shadow-2xl text-center">
                            <h3 className="font-black text-lg text-red-600 mb-2">Aviso de Renderizado</h3>
                            <p className="text-xs text-slate-600 mb-4">{this.state.error?.message || "Ocurrió un error inesperado al cargar la interfaz"}</p>
                            <button onClick={() => window.location.reload()} className="px-5 py-2.5 bg-[#075E54] text-white rounded-xl font-black text-xs uppercase shadow">
                                Recargar Plataforma
                            </button>
                        </div>
                    </div>
                );
            }
            return this.props.children;
        }
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ErrorBoundary><App/></ErrorBoundary>);
</script>
</body>
</html>
