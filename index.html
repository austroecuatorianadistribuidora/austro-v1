<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AustroControl Pro v1.3 ✨</title>
    <!-- Bibliotecas de Alto Rendimiento -->
    <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Librería para Exportar Excel -->
    <script src="https://cdn.sheetjs.com/xlsx-0.19.3/package/dist/xlsx.full.min.js"></script>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        
        :root {
            --brand-orange: #f97316;
            --brand-dark: #0f172a;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #fcfcfd; 
            color: #334155; 
            overflow-x: hidden; 
            text-align: left;
        }

        .glass-card {
            background: white;
            border: 1px solid rgba(226, 232, 240, 0.7);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border-radius: 1.25rem;
            transition: all 0.2s ease;
        }

        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.875rem 1.25rem;
            border-radius: 0.75rem;
            font-size: 0.875rem;
            font-weight: 500;
            color: #64748b;
            transition: all 0.2s;
        }

        .sidebar-item.active {
            background-color: var(--brand-orange);
            color: white;
            box-shadow: 0 4px 12px rgba(249, 115, 22, 0.25);
        }

        .btn-primary {
            background-color: var(--brand-orange);
            color: white;
            padding: 0.625rem 1.25rem;
            border-radius: 0.75rem;
            font-weight: 600;
            font-size: 0.875rem;
            transition: all 0.2s;
        }

        .btn-outline {
            border: 1px solid #e2e8f0;
            background: white;
            color: #64748b;
            padding: 0.625rem 1.25rem;
            border-radius: 0.75rem;
            font-weight: 600;
            font-size: 0.875rem;
        }

        .invoice-table th {
            font-weight: 600; font-size: 0.7rem; text-transform: uppercase;
            letter-spacing: 0.05em; color: #94a3b8; padding: 1rem; border-bottom: 1px solid #f1f5f9;
        }

        .invoice-table td { padding: 1rem; font-size: 0.875rem; border-bottom: 1px solid #f8fafc; }

        input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .hide-scrollbar::-webkit-scrollbar { width: 0; background: transparent; }
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- CONFIGURACIÓN ---
        const PRODUCTOS = [
            { id: 'p1', nombre: 'Avena Polaca 165g', costo: 0.269565, pvd: 0.3478 },
            { id: 'p2', nombre: 'Avena Polaca 340g', costo: 0.608694, pvd: 0.6956 },
            { id: 'p3', nombre: 'Avena Polaca 500g', costo: 0.777042, pvd: 0.8869 },
            { id: 'p4', nombre: 'Avena Polaca 1000g', costo: 1.597390, pvd: 1.8260 },
        ];

        const VENDEDORES = ["Diego Xavier Siavichay", "Byron Armando Miranda Capa"];
        const SUELDO_BASE = 482.00;
        const today = new Date().toISOString().split('T')[0];

        const firebaseConfig = {
            apiKey: "AIzaSyBu0b-O86orBd_fQut3i9n5s0W9fLpkRFI",
            authDomain: "austrodistribuidoraecuatoriana.firebaseapp.com",
            projectId: "austrodistribuidoraecuatoriana",
            storageBucket: "austrodistribuidoraecuatoriana.firebasestorage.app",
            messagingSenderId: "711061794814",
            appId: "1:711061794814:web:65b028a387ecf277ca5aaf"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const pathId = 'austro-v27';

        const Icon = ({ name, size = 18, className = "" }) => {
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        function App() {
            const [user, setUser] = useState(null);
            const [activeTab, setActiveTab] = useState('dashboard');
            const [loading, setLoading] = useState(true);
            const [facturas, setFacturas] = useState([]);
            const [cargas, setCargas] = useState([]);
            const [registrosNomina, setRegistrosNomina] = useState([]);
            const [movimientosContables, setMovimientosContables] = useState([]);
            const [dateFilter, setDateFilter] = useState({ start: today.substring(0, 8) + '01', end: today });

            const [modals, setModals] = useState({ factura: false, carga: false, nomina: false, conta: false });
            const [formF, setFormF] = useState({ num: '', items: PRODUCTOS.map(p => ({...p, q: 0})) });
            const [formC, setFormC] = useState({ ven: '', items: PRODUCTOS.map(p => ({...p, q: 0})) });
            const [formN, setFormN] = useState({ empleado: '', tipo: 'Anticipo', valor: 0 });
            const [formK, setFormK] = useState({ tipo: 'Ingreso', concepto: '', valor: 0, fecha: today });

            // Lógica Unificada
            const totalVentas = useMemo(() => cargas.reduce((a, c) => a + (c.totalCargado || 0), 0), [cargas]);
            const totalUtilidad = useMemo(() => facturas.reduce((a, f) => a + (f.utilidad || 0), 0), [facturas]);
            
            // Libro Diario Combinado (Facturas + Cargas + Movimientos Manuales)
            const libroDiario = useMemo(() => {
                const f = facturas.map(x => ({ id: x.id, fecha: x.fecha, concepto: `Compra Proveedor: Fac #${x.numFactura}`, tipo: 'Egreso', valor: x.total, cat: 'Compra' }));
                const c = cargas.map(x => ({ id: x.id, fecha: x.fecha, concepto: `Venta Ruta: ${x.responsable}`, tipo: 'Ingreso', valor: x.totalCargado, cat: 'Venta' }));
                const k = movimientosContables.map(x => ({ id: x.id, fecha: x.fecha, concepto: x.concepto, tipo: x.tipo, valor: x.valor, cat: 'Manual' }));
                
                return [...f, ...c, ...k]
                    .filter(m => m.fecha >= dateFilter.start && m.fecha <= dateFilter.end)
                    .sort((a, b) => new Date(b.fecha) - new Date(a.fecha));
            }, [facturas, cargas, movimientosContables, dateFilter]);

            useEffect(() => {
                auth.onAuthStateChanged(async (u) => {
                    if (!u) await auth.signInAnonymously();
                    setUser(u); setLoading(false);
                });
            }, []);

            useEffect(() => {
                if (!user) return;
                const base = db.collection('artifacts').doc(pathId).collection('public').doc('data');
                const unsubF = base.collection('facturas').onSnapshot(s => setFacturas(s.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsubC = base.collection('despachos').onSnapshot(s => setCargas(s.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsubN = base.collection('nomina').onSnapshot(s => setRegistrosNomina(s.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsubK = base.collection('contabilidad').onSnapshot(s => setMovimientosContables(s.docs.map(d => ({id: d.id, ...d.data()}))));
                return () => { unsubF(); unsubC(); unsubN(); unsubK(); };
            }, [user]);

            const crud = {
                borrar: async (col, id) => { if(confirm("¿Eliminar?")) await db.collection('artifacts').doc(pathId).collection('public').doc('data').collection(col).doc(id).delete(); },
                factura: async () => {
                    const ut = formF.items.reduce((a, b) => a + (b.q * (b.pvd - b.costo)), 0);
                    const tt = formF.items.reduce((a, b) => a + (b.q * b.costo), 0) * 1.15;
                    await db.collection('artifacts').doc(pathId).collection('public').doc('data').collection('facturas').add({
                        numFactura: formF.num, items: formF.items, total: tt, utilidad: ut, fecha: today, createdAt: new Date().toISOString()
                    });
                    setModals({...modals, factura: false}); setFormF({ num: '', items: PRODUCTOS.map(p => ({...p, q: 0})) });
                },
                carga: async () => {
                    const tt = formC.items.reduce((a, b) => a + (b.q * b.pvd), 0);
                    await db.collection('artifacts').doc(pathId).collection('public').doc('data').collection('despachos').add({
                        responsable: formC.ven, items: formC.items, totalCargado: tt, fecha: today, createdAt: new Date().toISOString()
                    });
                    setModals({...modals, carga: false}); setFormC({ ven: '', items: PRODUCTOS.map(p => ({...p, q: 0})) });
                },
                conta: async () => {
                    await db.collection('artifacts').doc(pathId).collection('public').doc('data').collection('contabilidad').add({ ...formK, createdAt: new Date().toISOString() });
                    setModals({...modals, conta: false}); setFormK({ tipo: 'Ingreso', concepto: '', valor: 0, fecha: today });
                }
            };

            const exportExcel = () => {
                const worksheet = XLSX.utils.json_to_sheet(libroDiario.map(m => ({
                    Fecha: m.fecha,
                    Concepto: m.concepto,
                    Tipo: m.tipo,
                    Valor: m.valor,
                    Categoria: m.cat
                })));
                const workbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(workbook, worksheet, "Libro Diario");
                XLSX.writeFile(workbook, `Contabilidad_Austro_${dateFilter.start}_al_${dateFilter.end}.xlsx`);
            };

            if (loading) return <div className="h-screen flex items-center justify-center bg-white"><div className="w-8 h-8 border-2 border-orange-500 border-t-transparent rounded-full animate-spin"></div></div>;

            return (
                <div className="min-h-screen flex">
                    <aside className="hidden md:flex w-64 border-r bg-white flex-col p-6 sticky top-0 h-screen">
                        <div className="flex items-center gap-2 mb-10 px-2">
                            <div className="bg-orange-500 p-1.5 rounded-lg text-white"><Icon name="box" size={20}/></div>
                            <span className="font-extrabold text-lg tracking-tight text-slate-900">AustroControl</span>
                        </div>
                        <nav className="space-y-1 flex-1">
                            {[
                                { id: 'dashboard', icon: 'pie-chart', label: 'Resumen' },
                                { id: 'facturacion', icon: 'file-text', label: 'Facturas' },
                                { id: 'logistica', icon: 'truck', label: 'Logística' },
                                { id: 'inventario', icon: 'package', label: 'Inventario' },
                                { id: 'nomina', icon: 'users', label: 'Nómina' },
                                { id: 'conta', icon: 'book-open', label: 'Contabilidad' }
                            ].map(item => (
                                <button key={item.id} onClick={() => setActiveTab(item.id)} className={`sidebar-item w-full ${activeTab === item.id ? 'active' : 'hover:bg-slate-50'}`}>
                                    <Icon name={item.icon}/> <span>{item.label}</span>
                                </button>
                            ))}
                        </nav>
                        <div className="mt-auto p-4 rounded-xl bg-slate-50 border border-slate-100"><p className="text-[10px] font-bold text-slate-400 uppercase mb-1">Status</p><p className="text-xs font-semibold text-emerald-600">Online: {pathId}</p></div>
                    </aside>

                    <main className="flex-1 p-4 md:p-10 max-w-6xl mx-auto">
                        
                        {activeTab === 'conta' && (
                            <div className="space-y-8 fade-in text-left">
                                <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                    <div>
                                        <h2 className="text-2xl font-bold text-slate-800">Contabilidad Realtime</h2>
                                        <p className="text-slate-400 text-sm italic">Libro diario de ingresos y egresos</p>
                                    </div>
                                    <div className="flex flex-wrap gap-2">
                                        <button onClick={exportExcel} className="btn-outline flex items-center gap-2 hover:bg-slate-50 transition-colors"><Icon name="download" size={16}/> Excel</button>
                                        <button onClick={() => setModals({...modals, conta: true})} className="btn-primary flex items-center gap-2"><Icon name="plus" size={16}/> Nuevo Movimiento</button>
                                    </div>
                                </div>

                                <div className="glass-card p-6 flex flex-col md:flex-row items-center gap-6">
                                    <div className="flex items-center gap-4 border-r pr-6 border-slate-100">
                                        <div className="w-10 h-10 bg-orange-100 text-orange-600 rounded-full flex items-center justify-center"><Icon name="calendar"/></div>
                                        <div>
                                            <p className="text-[10px] font-bold text-slate-400 uppercase">Periodo</p>
                                            <div className="flex items-center gap-2">
                                                <input type="date" className="text-xs font-bold bg-transparent outline-none" value={dateFilter.start} onChange={e => setDateFilter({...dateFilter, start: e.target.value})} />
                                                <span className="text-slate-300">al</span>
                                                <input type="date" className="text-xs font-bold bg-transparent outline-none" value={dateFilter.end} onChange={e => setDateFilter({...dateFilter, end: e.target.value})} />
                                            </div>
                                        </div>
                                    </div>
                                    <div className="flex-1 grid grid-cols-3 gap-6">
                                        <div><p className="text-[10px] font-bold text-slate-400 uppercase">Total Ingresos</p><p className="text-xl font-bold text-emerald-600">${libroDiario.filter(x=>x.tipo==='Ingreso').reduce((a,b)=>a+parseFloat(b.valor),0).toFixed(2)}</p></div>
                                        <div><p className="text-[10px] font-bold text-slate-400 uppercase">Total Egresos</p><p className="text-xl font-bold text-rose-500">${libroDiario.filter(x=>x.tipo==='Egreso').reduce((a,b)=>a+parseFloat(b.valor),0).toFixed(2)}</p></div>
                                        <div><p className="text-[10px] font-bold text-slate-400 uppercase">Balance Caja</p><p className="text-xl font-bold text-slate-800">${(libroDiario.filter(x=>x.tipo==='Ingreso').reduce((a,b)=>a+parseFloat(b.valor),0) - libroDiario.filter(x=>x.tipo==='Egreso').reduce((a,b)=>a+parseFloat(b.valor),0)).toFixed(2)}</p></div>
                                    </div>
                                </div>

                                <div className="glass-card overflow-hidden">
                                    <table className="w-full text-left invoice-table">
                                        <thead className="bg-slate-50"><tr><th>Fecha</th><th>Concepto</th><th>Categoría</th><th>Monto</th><th className="text-right">Acción</th></tr></thead>
                                        <tbody>
                                            {libroDiario.map(m => (
                                                <tr key={m.id} className="hover:bg-slate-50/50 transition-colors">
                                                    <td className="text-xs font-medium text-slate-500 italic">{m.fecha}</td>
                                                    <td className="font-semibold text-slate-700">{m.concepto}</td>
                                                    <td><span className={`text-[10px] font-bold px-2 py-1 rounded-full uppercase ${m.cat==='Venta'?'bg-emerald-50 text-emerald-600':m.cat==='Compra'?'bg-rose-50 text-rose-600':'bg-slate-100 text-slate-600'}`}>{m.cat}</span></td>
                                                    <td className={`font-bold ${m.tipo === 'Ingreso' ? 'text-emerald-600' : 'text-rose-600'}`}>
                                                        {m.tipo === 'Ingreso' ? '+' : '-'}${parseFloat(m.valor).toFixed(2)}
                                                    </td>
                                                    <td className="text-right">
                                                        {m.cat === 'Manual' && <button onClick={() => crud.borrar('contabilidad', m.id)} className="text-slate-300 hover:text-rose-500"><Icon name="trash-2" size={14}/></button>}
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {/* Módulos anteriores simplificados */}
                        {activeTab === 'dashboard' && (
                            <div className="space-y-8 fade-in text-left">
                                <div><h1 className="text-2xl font-bold text-slate-800 leading-none">Status AustroPro</h1><p className="text-slate-400 text-sm mt-1">Visión global de la operación</p></div>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                    <div className="glass-card p-6 border-l-4 border-emerald-500"><p className="text-xs font-bold text-slate-400 uppercase">Utilidad Bruta</p><h3 className="text-3xl font-extrabold text-slate-800">${totalUtilidad.toFixed(2)}</h3></div>
                                    <div className="glass-card p-6 border-l-4 border-orange-500"><p className="text-xs font-bold text-slate-400 uppercase">Ventas Ruta</p><h3 className="text-3xl font-extrabold text-slate-800">${totalVentas.toFixed(2)}</h3></div>
                                    <div className="glass-card p-6 border-l-4 border-slate-900"><p className="text-xs font-bold text-slate-400 uppercase">Costos Fijos</p><h3 className="text-3xl font-extrabold text-slate-800">$3,579.80</h3></div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'facturacion' && (
                            <div className="space-y-6 fade-in text-left">
                                <div className="flex justify-between items-center"><h2 className="text-xl font-bold">Facturación Proveedor</h2><button onClick={()=>setModals({...modals, factura:true})} className="btn-primary">+ Nueva Factura</button></div>
                                <div className="glass-card overflow-hidden"><table className="w-full invoice-table"><thead><tr><th>Fac #</th><th>Fecha</th><th>Total</th><th className="text-right">Borrar</th></tr></thead><tbody>{facturas.map(f=>(<tr key={f.id}><td>#{f.numFactura}</td><td>{f.fecha}</td><td className="font-bold">${f.total?.toFixed(2)}</td><td className="text-right"><button onClick={()=>crud.borrar('facturas', f.id)} className="text-slate-300 hover:text-rose-500"><Icon name="trash-2" size={14}/></button></td></tr>))}</tbody></table></div>
                            </div>
                        )}

                        {activeTab === 'logistica' && (
                            <div className="space-y-6 fade-in text-left">
                                <div className="flex justify-between items-center"><h2 className="text-xl font-bold">Despachos Ruta</h2><button onClick={()=>setModals({...modals, carga:true})} className="btn-primary">Enviar Carga</button></div>
                                <div className="grid grid-cols-1 gap-3">{cargas.map(c=>(<div key={c.id} className="glass-card p-5 flex justify-between"><div><p className="font-bold">{c.responsable}</p><p className="text-xs text-slate-400 italic">{c.fecha}</p></div><div className="flex items-center gap-6"><div className="text-right"><p className="text-[10px] font-bold text-slate-300 uppercase">Total</p><p className="font-bold">${c.totalCargado?.toFixed(2)}</p></div><button onClick={()=>crud.borrar('despachos', c.id)} className="text-slate-300"><Icon name="x" size={16}/></button></div></div>))}</div>
                            </div>
                        )}

                        {activeTab === 'inventario' && (
                             <div className="space-y-8 fade-in text-left">
                                <h2 className="text-xl font-bold">Stock en Bodega</h2>
                                <div className="grid grid-cols-2 md:grid-cols-4 gap-6">
                                    {PRODUCTOS.map(p => {
                                        const ing = facturas.reduce((acc, f) => acc + (f.items?.find(it => it.id === p.id)?.q || 0), 0);
                                        const sal = cargas.reduce((acc, c) => acc + (c.items?.find(it => it.id === p.id || it.pId === p.id)?.q || 0), 0);
                                        const stock = ing - sal;
                                        return (
                                            <div key={p.id} className="glass-card p-6 text-center border-t-4 border-orange-500">
                                                <p className="text-[10px] font-bold text-slate-400 uppercase mb-3 leading-tight italic">{p.nombre}</p>
                                                <h3 className={`text-4xl font-black ${stock < 50 ? 'text-rose-500' : 'text-slate-800'}`}>{stock}</h3>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        {activeTab === 'nomina' && (
                            <div className="space-y-10 fade-in text-left">
                                <div className="flex justify-between items-center"><h2 className="text-xl font-bold text-slate-800">Cálculo de Nómina</h2><button onClick={()=>setModals({...modals, nomina:true})} className="btn-primary">Registrar Novedad</button></div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    {VENDEDORES.map(emp => {
                                        const ant = registrosNomina.filter(r => r.empleado === emp && r.tipo === 'Anticipo').reduce((a, b) => a + parseFloat(b.valor), 0);
                                        const des = registrosNomina.filter(r => r.empleado === emp && r.tipo === 'Descuento').reduce((a, b) => a + parseFloat(b.valor), 0);
                                        const total = SUELDO_BASE - ant - des;
                                        return (
                                            <div key={emp} className="glass-card p-6">
                                                <h4 className="font-bold text-lg text-slate-800 mb-6 italic">{emp}</h4>
                                                <div className="space-y-2 text-sm">
                                                    <div className="flex justify-between"><span>Sueldo</span><span>${SUELDO_BASE.toFixed(2)}</span></div>
                                                    <div className="flex justify-between text-rose-500"><span>Anticipos/Desc.</span><span>-${(ant+des).toFixed(2)}</span></div>
                                                    <div className="pt-4 border-t border-slate-50 flex justify-between items-end"><span className="text-xs font-bold uppercase text-slate-400">Pagar</span><span className="text-2xl font-black text-slate-900">${total.toFixed(2)}</span></div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}
                    </main>

                    {/* MODALES REFINADOS */}
                    {Object.entries(modals).map(([key, isOpen]) => isOpen && (
                        <div key={key} className="fixed inset-0 bg-slate-950/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white w-full max-w-xl rounded-[1.5rem] shadow-2xl overflow-hidden p-8 fade-in">
                                <div className="flex justify-between items-center mb-8"><h3 className="text-xl font-bold text-slate-800 capitalize italic leading-none">{key}</h3><button onClick={() => setModals({...modals, [key]: false})} className="p-2 hover:bg-slate-50 rounded-full text-slate-400"><Icon name="x"/></button></div>

                                {key === 'conta' && (
                                    <div className="space-y-6 text-left">
                                        <div className="grid grid-cols-2 gap-4">
                                            <div><label className="text-[10px] font-bold text-slate-400 uppercase block mb-1">Tipo</label><select className="w-full p-3 bg-slate-50 rounded-xl font-bold outline-none" value={formK.tipo} onChange={e=>setFormK({...formK, tipo:e.target.value})}><option>Ingreso</option><option>Egreso</option></select></div>
                                            <div><label className="text-[10px] font-bold text-slate-400 uppercase block mb-1">Fecha</label><input type="date" className="w-full p-3 bg-slate-50 rounded-xl font-bold outline-none" value={formK.fecha} onChange={e=>setFormK({...formK, fecha:e.target.value})}/></div>
                                        </div>
                                        <div><label className="text-[10px] font-bold text-slate-400 uppercase block mb-1">Concepto / Detalle</label><input className="w-full p-3 bg-slate-50 rounded-xl font-bold outline-none" placeholder="Ej: Pago de Luz Marzo" value={formK.concepto} onChange={e=>setFormK({...formK, concepto:e.target.value})}/></div>
                                        <div><label className="text-[10px] font-bold text-slate-400 uppercase block mb-1">Valor $</label><input type="number" className="w-full p-3 bg-orange-50 rounded-xl font-bold text-orange-600 outline-none text-xl" placeholder="0.00" onChange={e=>setFormK({...formK, valor:e.target.value})}/></div>
                                        <button onClick={crud.conta} className="btn-primary w-full py-4 shadow-lg">Registrar Movimiento</button>
                                    </div>
                                )}

                                {key === 'factura' && (
                                    <div className="space-y-6 text-left">
                                        <div className="bg-slate-50 p-4 rounded-xl text-left"><p className="text-[10px] font-bold text-slate-400 uppercase mb-1">Nº Factura</p><input className="w-full bg-transparent text-xl font-bold outline-none" value={formF.num} onChange={e=>setFormF({...formF, num:e.target.value})}/></div>
                                        <div className="space-y-2 max-h-60 overflow-y-auto hide-scrollbar">{formF.items.map((it,idx)=>(<div key={it.id} className="flex items-center justify-between p-3 border-b border-slate-50"><span className="text-xs font-semibold">{it.nombre}</span><input type="number" className="w-20 p-2 bg-slate-50 rounded-lg text-center font-bold" onChange={e=>{const ni=[...formF.items]; ni[idx].q=parseInt(e.target.value)||0; setFormF({...formF, items:ni});}}/></div>))}</div>
                                        <button onClick={crud.factura} className="btn-primary w-full py-4">Grabar Compra</button>
                                    </div>
                                )}

                                {key === 'carga' && (
                                    <div className="space-y-6 text-left">
                                        <select className="w-full p-4 bg-slate-50 rounded-xl font-bold outline-none" value={formC.ven} onChange={e=>setFormC({...formC, ven:e.target.value})}><option value="">Responsable...</option>{VENDEDORES.map(v=><option key={v}>{v}</option>)}</select>
                                        <div className="space-y-2 max-h-60 overflow-y-auto hide-scrollbar">{formC.items.map((it,idx)=>(<div key={it.id} className="flex items-center justify-between p-3 border-b border-slate-50"><span className="text-xs font-semibold">{it.nombre}</span><input type="number" className="w-20 p-2 bg-orange-50 rounded-lg text-center font-bold" onChange={e=>{const ni=[...formC.items]; ni[idx].q=parseInt(e.target.value)||0; setFormC({...formC, items:ni});}}/></div>))}</div>
                                        <button onClick={crud.carga} className="btn-primary w-full py-4 text-left">Despachar Ruta</button>
                                    </div>
                                )}
                            </div>
                        </div>
                    ))}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
