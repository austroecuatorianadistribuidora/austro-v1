                                                                <button
                                                                    type="button"
                                                                    onClick={() => abrirPdfEnPestana(fac.archivo)}
                                                                    className="px-3 py-1.5 rounded-xl bg-slate-200 hover:bg-slate-300 text-slate-800 text-xs font-black"
                                                                >
                                                                    📄 Ver PDF
                                                                </button>
                                                            )}
                                                            <button
                                                                type="button"
                                                                onClick={() => {
                                                                    setModalPagoCompra(fac);
                                                                    setFormPago({
                                                                        fecha: today,
                                                                        monto: pendiente > 0 ? pendiente.toFixed(2) : '',
                                                                        metodo: 'transferencia',
                                                                        referencia: ''
                                                                    });
                                                                }}
                                                                className="px-3.5 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-black"
                                                            >
                                                                💳 Registrar Pago
                                                            </button>
                                                            <button
                                                                type="button"
                                                                onClick={() => editarFacturaCompra(fac)}
                                                                className="px-3 py-1.5 rounded-xl bg-amber-100 text-amber-800 text-xs font-black"
                                                            >
                                                                Editar
                                                            </button>
                                                            <button
                                                                type="button"
                                                                onClick={() => eliminarFacturaCompra(fac.id)}
                                                                className="px-2.5 py-1.5 rounded-xl bg-rose-100 text-rose-700 text-xs font-black"
                                                            >
                                                                ✕
                                                            </button>
                                                        </div>
                                                    </div>

                                                    {/* Historial de pagos de esta factura */}
                                                    {(fac.pagos || []).length > 0 && (
                                                        <div className="pt-2 space-y-1">
                                                            <span className="text-[10px] font-black uppercase text-slate-400 block">Pagos Realizados:</span>
                                                            {(fac.pagos || []).map((p, idx) => (
                                                                <div key={idx} className="text-xs font-bold text-emerald-800 bg-emerald-50 px-3 py-1 rounded-lg flex justify-between">
                                                                    <span>✓ {p.fecha} • {(p.metodo || 'Pago').toUpperCase()} {p.referenciaBanco ? `(${p.referenciaBanco})` : ''}</span>
                                                                    <span className="font-black">${Number(p.monto).toFixed(2)}</span>
                                                                </div>
                                                            ))}
                                                        </div>
                                                    )}
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* ═══════════════════════════════════════════════════════════════════════════
                        PESTAÑA 6: CAJA Y UTILIDAD REAL (DIARIA, SEMANAL, MENSUAL Y CUADRE TOTAL HASTA HOY)
                    ═══════════════════════════════════════════════════════════════════════════ */}
                    {activeTab === 'caja' && (
                        <div className="space-y-5 fade-in">
                            {/* BANNER PRINCIPAL DE LIQUIDACIÓN Y CUADRE TOTAL HASTA HOY (100% FACTURAS VENDIDAS) */}
                            <div className="bg-gradient-to-r from-[#075E54] via-emerald-900 to-slate-900 text-white p-5 sm:p-6 rounded-3xl shadow-xl border-2 border-emerald-400/40 space-y-4">
                                <div className="flex flex-wrap items-center justify-between gap-3">
                                    <div>
                                        <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-[#25D366] text-[#075E54] text-xs font-black uppercase">
                                            ✅ LIQUIDACIÓN TOTAL HASTA HOY ({today}) • 100% PRODUCTO VENDIDO
                                        </span>
                                        <h3 className="text-xl sm:text-2xl font-black mt-1.5">
                                            Todo el Producto de las {liquidacionFacturasConsumidorFinal.totalFacturasHastaHoy} Facturas Ingresadas Hasta Hoy Está Vendido y Cuadrado
                                        </h3>
                                        <p className="text-xs text-emerald-100 font-bold">
                                            Lo registrado en Notas de Venta ({liquidacionFacturasConsumidorFinal.totalUnidadesConNota} u.) + Saldo Consumidor Final ({liquidacionFacturasConsumidorFinal.totalUnidadesCF} u.) = {liquidacionFacturasConsumidorFinal.totalUnidadesVendidasHastaHoy} u. vendidas (Arranca de 0 desde hoy).
                                        </p>
                                    </div>
                                    {liquidacionFacturasConsumidorFinal.totalUnidadesCF > 0 && (
                                        <button
                                            type="button"
                                            onClick={asentarCuadreConsumidorFinalEnFirme}
                                            className="px-4 py-3 rounded-2xl bg-[#25D366] hover:bg-[#20bd5a] text-[#075E54] font-black text-xs uppercase shadow-lg shrink-0"
                                        >
                                            📌 Asentar Nota de Cuadre en Firme
                                        </button>
                                    )}
                                </div>

                                <div className="grid grid-cols-2 md:grid-cols-5 gap-3">
                                    <div className="bg-black/30 border border-white/15 p-3.5 rounded-2xl">
                                        <span className="text-[10px] font-black uppercase text-indigo-300 block">Total Facturas Hasta Hoy</span>
                                        <span className="text-2xl font-black text-white block mt-0.5">
                                            ${liquidacionFacturasConsumidorFinal.totalMontoFacturasHastaHoy.toFixed(2)}
                                        </span>
                                        <span className="text-[11px] font-bold text-slate-300">
                                            {liquidacionFacturasConsumidorFinal.totalFacturasHastaHoy} facturas • {liquidacionFacturasConsumidorFinal.totalUnidadesFacturadas} u.
                                        </span>
                                    </div>

                                    <div className="bg-black/30 border border-emerald-400/40 p-3.5 rounded-2xl">
                                        <span className="text-[10px] font-black uppercase text-emerald-300 block">Venta Total Hasta Hoy</span>
                                        <span className="text-2xl sm:text-3xl font-black text-[#25D366] block mt-0.5">
                                            ${liquidacionFacturasConsumidorFinal.ventaTotalHastaHoy.toFixed(2)}
                                        </span>
                                        <span className="text-[11px] font-bold text-emerald-200">
                                            {liquidacionFacturasConsumidorFinal.totalUnidadesVendidasHastaHoy} u. (100% vendido)
                                        </span>
                                    </div>

                                    <div className="bg-black/30 border border-amber-400/40 p-3.5 rounded-2xl">
                                        <span className="text-[10px] font-black uppercase text-amber-300 block">Utilidad Bruta Ganada</span>
                                        <span className="text-2xl sm:text-3xl font-black text-amber-300 block mt-0.5">
                                            +${liquidacionFacturasConsumidorFinal.utilidadBrutaGanadaHastaHoy.toFixed(2)}
                                        </span>
                                        <span className="text-[11px] font-bold text-slate-300">
                                            Costo Prod.: ${liquidacionFacturasConsumidorFinal.costoTotalVendidoHastaHoy.toFixed(2)}
                                        </span>
                                    </div>

                                    <div className="bg-black/30 border border-rose-400/30 p-3.5 rounded-2xl">
                                        <span className="text-[10px] font-black uppercase text-rose-300 block">Gastos y Devoluciones</span>
                                        <span className="text-2xl font-black text-rose-300 block mt-0.5">
                                            -${(liquidacionFacturasConsumidorFinal.totalGastosHastaHoy + liquidacionFacturasConsumidorFinal.totalDevolucionesHastaHoy).toFixed(2)}
                                        </span>
                                        <span className="text-[11px] font-bold text-slate-300">
                                            Gastos: ${liquidacionFacturasConsumidorFinal.totalGastosHastaHoy.toFixed(2)}
                                        </span>
                                    </div>

                                    <div className="bg-emerald-950/90 border-2 border-[#25D366] p-3.5 rounded-2xl">
                                        <span className="text-[10px] font-black uppercase text-[#25D366] block">Utilidad Neta Ganada Hasta Hoy</span>
                                        <span className="text-2xl sm:text-3xl font-black text-white block mt-0.5">
                                            ${liquidacionFacturasConsumidorFinal.utilidadNetaGanadaHastaHoy.toFixed(2)}
                                        </span>
                                        <span className="text-[11px] font-bold text-emerald-300">
                                            ✓ Caja Cuadrada al Día de Hoy
                                        </span>
                                    </div>
                                </div>
                            </div>

                            <div className="bg-white p-5 rounded-3xl border border-slate-200 shadow-md flex flex-wrap items-center justify-between gap-3">
                                <div>
                                    <span className="text-xs font-black uppercase text-[#075E54] block">
                                        💰 RESUMEN FINANCIERO DIRECTO • RUTA ANDRÉS CÁRDENAS
                                    </span>
                                    <h2 className="text-2xl font-black text-slate-900">
                                        Caja: Venta, Compra, Gastos y Utilidad Real (Diaria, Semanal y Mensual)
                                    </h2>
                                </div>
                                <div className="flex flex-wrap items-center gap-2">
                                    <div className="flex items-center gap-1.5 bg-slate-100 px-3 py-1.5 rounded-xl border border-slate-200">
                                        <span className="text-xs font-black text-slate-600">Día/Semana:</span>
                                        <input
                                            type="date"
                                            value={fechaCajaDia}
                                            onChange={(e) => setFechaCajaDia(e.target.value)}
                                            className="bg-white px-2.5 py-1 rounded-lg font-black text-xs outline-none"
                                        />
                                    </div>
                                    <div className="flex items-center gap-1.5 bg-slate-100 px-3 py-1.5 rounded-xl border border-slate-200">
                                        <span className="text-xs font-black text-slate-600">Mes:</span>
                                        <input
                                            type="month"
                                            value={mesCaja}
                                            onChange={(e) => setMesCaja(e.target.value)}
                                            className="bg-white px-2.5 py-1 rounded-lg font-black text-xs outline-none"
                                        />
                                    </div>
                                    <button
                                        type="button"
                                        onClick={exportarCajaExcel}
                                        className="px-4 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-black text-xs uppercase shadow"
                                    >
                                        📥 Descargar Excel
                                    </button>
                                </div>
                            </div>

                            {/* 3 TARJETAS GRANDES: UTILIDAD REAL DIARIA, SEMANAL Y MENSUAL */}
                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-5">
                                {[
                                    {
                                        titulo: '1. UTILIDAD REAL DIARIA',
                                        sub: `Fecha: ${fechaCajaDia} (${obtenerRutaPorFecha(fechaCajaDia).nombre})`,
                                        data: calculosCajaYUtilidad.diario,
                                        headerBg: 'from-emerald-800 to-teal-900'
                                    },
                                    {
                                        titulo: '2. UTILIDAD REAL SEMANAL',
                                        sub: `${calculosCajaYUtilidad.semInfo.etiqueta}`,
                                        data: calculosCajaYUtilidad.semanal,
                                        headerBg: 'from-sky-800 to-indigo-900'
                                    },
                                    {
                                        titulo: '3. UTILIDAD REAL MENSUAL',
                                        sub: `Mes: ${mesCaja} (Incluye Crédito Vehículo $436)`,
                                        data: calculosCajaYUtilidad.mensual,
                                        headerBg: 'from-slate-900 to-purple-950'
                                    }
                                ].map((bloque, idx) => {
                                    const d = bloque.data;
                                    return (
                                        <div key={idx} className="bg-white rounded-3xl border-2 border-slate-200 shadow-lg overflow-hidden flex flex-col justify-between">
                                            <div>
                                                <div className={`bg-gradient-to-r ${bloque.headerBg} text-white p-5`}>
                                                    <span className="text-[11px] font-black uppercase tracking-wider text-emerald-300 block">
                                                        {bloque.titulo}
                                                    </span>
                                                    <p className="text-xs font-bold text-slate-200 mt-0.5">{bloque.sub}</p>
                                                    <div className="mt-3 pt-3 border-t border-white/15 flex items-baseline justify-between">
                                                        <span className="text-xs font-black uppercase text-slate-300">Utilidad Neta Real:</span>
                                                        <span className={`text-3xl sm:text-4xl font-black ${d.utilidadNetaReal >= 0 ? 'text-[#25D366]' : 'text-rose-400'}`}>
                                                            ${d.utilidadNetaReal.toFixed(2)}
                                                        </span>
                                                    </div>
                                                </div>

                                                <div className="p-5 space-y-2.5 text-sm font-bold">
                                                    <div className="flex justify-between py-1.5 border-b border-slate-100">
                                                        <span className="text-slate-600">📦 Unidades Vendidas:</span>
                                                        <span className="font-black text-slate-900">{d.unidadesVendidas} u.</span>
                                                    </div>
                                                    <div className="flex justify-between py-1.5 border-b border-slate-100">
                                                        <span className="text-slate-600">💵 Venta Total Cobrada:</span>
                                                        <span className="font-black text-emerald-700">${d.ventaTotal.toFixed(2)}</span>
                                                    </div>
                                                    <div className="flex justify-between py-1.5 border-b border-slate-100">
                                                        <span className="text-slate-600">🏭 (-) Costo de Compra Producto:</span>
                                                        <span className="font-black text-slate-800">-${d.costoMercaderiaVendida.toFixed(2)}</span>
                                                    </div>
                                                    <div className="flex justify-between py-1.5 border-b border-slate-200 bg-emerald-50/70 px-2.5 rounded-xl">
                                                        <span className="text-emerald-950 font-black">📈 (=) Utilidad Bruta Venta:</span>
                                                        <span className="font-black text-emerald-800">+${d.utilidadBrutaVenta.toFixed(2)}</span>
                                                    </div>
                                                    <div className="flex justify-between py-1.5 border-b border-slate-100">
                                                        <span className="text-rose-600">💸 (-) Gastos Registrados:</span>
                                                        <span className="font-black text-rose-600">-${d.totalGastosManuales.toFixed(2)}</span>
                                                    </div>
                                                    <div className="flex justify-between py-1.5 border-b border-slate-100">
                                                        <span className="text-amber-700">🔄 (-) Devoluciones ({d.unidadesDevueltas} u.):</span>
                                                        <span className="font-black text-amber-700">-${d.totalDevoluciones.toFixed(2)}</span>
                                                    </div>
                                                    {d.creditoVehiculo > 0 && (
                                                        <div className="flex justify-between py-1.5 border-b border-slate-100">
                                                            <span className="text-purple-700">🚚 (-) Crédito Vehículo Fijo:</span>
                                                            <span className="font-black text-purple-700">-${d.creditoVehiculo.toFixed(2)}</span>
                                                        </div>
                                                    )}
                                                    <div className="flex justify-between py-1.5 border-b border-slate-100 text-xs text-slate-500">
                                                        <span>🧾 Facturas de Compra del período:</span>
                                                        <span className="font-black text-slate-700">${d.totalComprasFacturas.toFixed(2)}</span>
                                                    </div>
                                                </div>
                                            </div>

                                            <div className="p-4 bg-slate-900 text-white flex items-center justify-between">
                                                <span className="text-xs font-black uppercase text-amber-300">Efectivo Neto Caja (Venta - Gastos):</span>
                                                <span className="text-xl font-black text-white">
                                                    ${(d.ventaTotal - d.totalGastosManuales - d.totalDevoluciones).toFixed(2)}
                                                </span>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>

                            {/* Cronograma Oficial de la Única Ruta: Andrés Cárdenas */}
                            <div className="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm space-y-3">
                                <h3 className="text-sm font-black uppercase text-slate-800">
                                    🚚 Cronograma Oficial de Ruta — Andrés Cárdenas
                                </h3>
                                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2.5">
                                    {RUTAS_OFICIALES.map(r => (
                                        <div key={r.id} className={`p-3.5 rounded-2xl border ${r.badgeColor}`}>
                                            <span className="text-[11px] font-black uppercase block">{r.diaSemana}</span>
                                            <span className="text-sm font-black block mt-0.5">{r.nombre}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}
                    </main>
                </div>

                {/* ═══ MODAL ÁGIL PARA REGISTRAR PAGO DE FACTURA ═══ */}
                {modalPagoCompra && (
                    <div className="fixed inset-0 z-50 bg-slate-900/80 flex items-center justify-center p-4">
                        <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4">
                            <div className="flex items-center justify-between">
                                <h3 className="text-lg font-black text-slate-900">
                                    💳 Registrar Pago • Factura #{modalPagoCompra.numFact}
                                </h3>
                                <button onClick={() => setModalPagoCompra(null)} className="text-slate-400 font-black">✕</button>
                            </div>
                            <div className="space-y-3">
                                <div>
                                    <label className="text-xs font-black uppercase text-slate-600 block mb-1">Fecha de Pago:</label>
                                    <input
                                        type="date"
                                        value={formPago.fecha}
                                        onChange={(e) => setFormPago(prev => ({ ...prev, fecha: e.target.value }))}
                                        className="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-300 font-black"
                                    />
                                </div>
                                <div>
                                    <label className="text-xs font-black uppercase text-slate-600 block mb-1">Monto Pagado ($):</label>
                                    <input
                                        type="number"
                                        step="0.01"
                                        value={formPago.monto}
                                        onChange={(e) => setFormPago(prev => ({ ...prev, monto: e.target.value }))}
                                        className="w-full px-4 py-3 rounded-xl bg-emerald-50 border-2 border-emerald-500 font-black text-2xl text-emerald-900"
                                    />
                                </div>
                                <div>
                                    <label className="text-xs font-black uppercase text-slate-600 block mb-1">Método:</label>
                                    <select
                                        value={formPago.metodo}
                                        onChange={(e) => setFormPago(prev => ({ ...prev, metodo: e.target.value }))}
                                        className="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-300 font-black"
                                    >
                                        <option value="transferencia">Transferencia Bancaria</option>
                                        <option value="deposito">Depósito</option>
                                        <option value="efectivo">Efectivo</option>
                                    </select>
                                </div>
                                <div>
                                    <label className="text-xs font-black uppercase text-slate-600 block mb-1">Referencia / Comprobante:</label>
                                    <input
                                        type="text"
                                        placeholder="Nº comprobante o nota"
                                        value={formPago.referencia}
                                        onChange={(e) => setFormPago(prev => ({ ...prev, referencia: e.target.value }))}
                                        className="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-300 font-bold"
                                    />
                                </div>
                            </div>
                            <div className="flex gap-2 pt-2">
                                <button
                                    type="button"
                                    onClick={() => setModalPagoCompra(null)}
                                    className="flex-1 py-3 rounded-xl bg-slate-100 font-black text-xs uppercase text-slate-700"
                                >
                                    Cancelar
                                </button>
                                <button
                                    type="button"
                                    onClick={guardarPagoFactura}
                                    className="flex-1 py-3 rounded-xl bg-emerald-600 text-white font-black text-xs uppercase shadow-lg"
                                >
                                    Guardar Pago
                                </button>
                            </div>
                        </div>
                    </div>
                )}
            </div>
        );
    }

    class ErrorBoundary extends React.Component {
        constructor(props) {
            super(props);
            this.state = { hasError: false, error: null };
        }
        static getDerivedStateFromError(error) {
            return { hasError: true, error };
        }
        render() {
            if (this.state.hasError) {
                return (
                    <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4 text-white">
                        <div className="bg-white text-slate-800 p-6 rounded-3xl max-w-md w-full shadow-2xl text-center">
                            <h3 className="font-black text-lg text-red-600 mb-2">Aviso de Renderizado</h3>
                            <p className="text-xs text-slate-600 mb-4">{this.state.error?.message || "Ocurrió un error inesperado"}</p>
                            <button onClick={() => window.location.reload()} className="px-5 py-2.5 bg-[#075E54] text-white rounded-xl font-black text-xs uppercase shadow">
                                Recargar Plataforma
                            </button>
                        </div>
                    </div>
                );
            }
            return this.props.children;
        }
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ErrorBoundary><App/></ErrorBoundary>);
</script>
</body>
</html>
