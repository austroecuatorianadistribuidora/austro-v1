<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AustroControl Pro v1.0 ✨</title>
    <!-- Bibliotecas Base -->
    <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Firebase SDK (Versión Compat para estabilidad máxima en archivo único) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #f8fafc; 
            color: #1e293b; 
            padding-bottom: 90px; /* Espacio para nav inferior */
        }
        @media (min-width: 768px) {
            body { padding-bottom: 0; }
        }
        .invoice-paper { 
            background: white; 
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.1); 
            border: 1px solid #e2e8f0; 
            border-radius: 1.5rem;
        }
        .invoice-table th { 
            background-color: #f1f5f9; 
            font-weight: 800; 
            text-transform: uppercase; 
            color: #475569;
            font-size: 0.65rem;
            padding: 0.75rem;
        }
        .invoice-table td {
            padding: 0.75rem;
            border-bottom: 1px solid #f1f5f9;
            font-size: 0.8rem;
        }
        input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .sidebar-active {
            background-color: #ea580c;
            color: white;
            box-shadow: 0 10px 15px -3px rgba(234, 88, 12, 0.3);
        }
        .mobile-nav-active { color: #ea580c; transform: translateY(-4px); }
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        .pulse-green {
            box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7);
            animation: pulse-green 2s infinite;
        }
        @keyframes pulse-green {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(34, 197, 94, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- 1. CONFIGURACIÓN DEL NEGOCIO ---
        const PRODUCTOS = [
            { id: 'p1', nombre: '01 EMPACADO AVENA POLACA 165G', costo: 0.269565, pvd: 0.3478 },
            { id: 'p2', nombre: '02 EMPACADO AVENA POLACA 340G', costo: 0.608694, pvd: 0.6956 },
            { id: 'p3', nombre: '03 EMPACADO AVENA POLACA 500G', costo: 0.777042, pvd: 0.8869 },
            { id: 'p4', nombre: '04 EMPACADO AVENA POLACA 1000G', costo: 1.597390, pvd: 1.8260 },
        ];

        const GASTOS_FIJOS_LISTA = [
            { det: "Sueldos empleados", val: 964.00 },
            { det: "Combustible", val: 350.00 },
            { det: "Comisiones", val: 600.00 },
            { det: "Viáticos locales", val: 60.00 },
            { det: "Viáticos foráneos", val: 180.00 },
            { det: "Depreciación vehículos", val: 200.00 },
            { det: "Intereses préstamo", val: 172.73 },
            { det: "Pago de capital vehículos", val: 683.06 },
            { det: "Mantenimiento y reparaciones", val: 100.00 },
            { det: "Telefonía celular", val: 30.00 },
            { det: "Honorarios prof.", val: 200.00 },
            { det: "Suministros", val: 10.00 },
            { det: "Gastos Varios", val: 30.00 }
        ];

        const TOTAL_FIJO = 3579.80;
        const VENDEDORES = ["Diego Xavier Siavichay", "Byron Armando Miranda Capa"];

        // --- 2. FIREBASE INIT ---
        const firebaseConfig = typeof __firebase_config !== 'undefined' 
            ? JSON.parse(__firebase_config) 
            : {
                apiKey: "", 
                authDomain: "austrodistribuidoraecuatoriana.firebaseapp.com",
                projectId: "austrodistribuidoraecuatoriana",
                storageBucket: "austrodistribuidoraecuatoriana.firebasestorage.app",
                messagingSenderId: "711061794814",
                appId: "1:711061794814:web:65b028a387ecf277ca5aaf"
            };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        const auth = firebase.auth();
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'austro-pro-v3';

        // --- 3. UI COMPONENTS ---
        const Icon = ({ name, size = 20, className = "" }) => {
            const icons = {
                'package': <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M16.5 9.4 7.5 4.21"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><polyline points="3.29 7 12 12 20.71 7"/><line x1="12" y1="22" x2="12" y2="12"/></svg>,
                'chart': <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>,
                'scan': <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 12h10"/></svg>,
                'truck': <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="16" height="13" x="2" y="6" rx="2"/><path d="M18 9h2l3 3v4h-3"/><circle cx="6.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>,
                'box': <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="M3.3 7 12 12l8.7-5"/><path d="M12 22V12"/></svg>,
                'trash': <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>,
                'edit': <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>,
                'wifi': <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 20h.01"/><path d="M2 8.82a15 15 0 0 1 20 0"/><path d="M5 12.85a10 10 0 0 1 14 0"/><path d="M8.5 16.42a5 5 0 0 1 7 0"/></svg>,
                'x': <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            };
            return icons[name] || null;
        };

        const Card = ({ children, className = "" }) => (
            <div className={`bg-white p-5 md:p-8 rounded-[2rem] border border-slate-100 shadow-sm ${className}`}>{children}</div>
        );

        // --- 4. APLICACIÓN PRINCIPAL ---
        function App() {
            const [user, setUser] = useState(null);
            const [activeTab, setActiveTab] = useState('dashboard');
            const [loading, setLoading] = useState(true);
            const [facturas, setFacturas] = useState([]);
            const [despachos, setDespachos] = useState([]);
            const [error, setError] = useState(null);

            const [modalF, setModalF] = useState(false);
            const [modalC, setModalC] = useState(false);
            const [isEditingF, setIsEditingF] = useState(null);
            const [formF, setFormF] = useState({ num: '', items: PRODUCTOS.map(p => ({...p, q: 0})) });
            const [formC, setFormC] = useState({ ven: '', items: PRODUCTOS.map(p => ({...p, q: 0})) });

            const today = new Date().toISOString().split('T')[0];

            // Gestión de Auth
            useEffect(() => {
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await auth.signInWithCustomToken(__initial_auth_token);
                        } else {
                            await auth.signInAnonymously();
                        }
                    } catch (e) {
                        setError("Error de conexión. Recargue la página.");
                    }
                };
                initAuth();
                const unsubscribe = auth.onAuthStateChanged((u) => {
                    setUser(u);
                    setLoading(false);
                });
                return () => unsubscribe();
            }, []);

            // Sincronización Firestore
            useEffect(() => {
                if (!user) return;

                const path = `/artifacts/${appId}/public/data`;
                
                const unsubFacturas = db.collection(`${path}/facturas`).onSnapshot((s) => {
                    setFacturas(s.docs.map(d => ({ id: d.id, ...d.data() })));
                }, (err) => setError("Error sincronizando facturas."));

                const unsubDespachos = db.collection(`${path}/despachos`).onSnapshot((s) => {
                    setDespachos(s.docs.map(d => ({ id: d.id, ...d.data() })));
                }, (err) => setError("Error sincronizando despachos."));

                return () => { unsubFacturas(); unsubDespachos(); };
            }, [user]);

            // Cálculos Globales
            const totalUtilidadRuta = useMemo(() => {
                return despachos.reduce((acc, d) => {
                    const items = d.items || [];
                    return acc + items.reduce((s, it) => s + (Number(it.q) * (Number(it.pvd) - Number(it.costo))), 0);
                }, 0);
            }, [despachos]);

            const subtotalF = useMemo(() => formF.items.reduce((a, b) => a + (Number(b.q) * Number(b.costo)), 0), [formF.items]);
            const totalF = subtotalF * 1.15;

            // Handlers de Facturas
            const handleGuardarFactura = async () => {
                if (!formF.num) return setError("El número de factura es obligatorio.");
                if (!user) return;
                try {
                    const data = {
                        numFactura: formF.num,
                        fecha: today,
                        items: formF.items.map(i => ({ id: i.id, nombre: i.nombre, q: Number(i.q), costo: i.costo, pvd: i.pvd })),
                        total: totalF,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
                        createdAt: isEditingF ? (facturas.find(f => f.id === isEditingF)?.createdAt || firebase.firestore.FieldValue.serverTimestamp()) : firebase.firestore.FieldValue.serverTimestamp()
                    };

                    const ref = db.collection(`/artifacts/${appId}/public/data/facturas`);
                    if (isEditingF) {
                        await ref.doc(isEditingF).set(data);
                    } else {
                        await ref.add(data);
                    }
                    
                    setModalF(false);
                    setIsEditingF(null);
                    setFormF({ num: '', items: PRODUCTOS.map(p => ({...p, q: 0})) });
                    setError(null);
                } catch (e) { setError("No se pudo guardar la factura."); }
            };

            const handleEditFactura = (f) => {
                setIsEditingF(f.id);
                setFormF({
                    num: f.numFactura,
                    items: PRODUCTOS.map(p => {
                        const itemExistente = f.items?.find(it => it.id === p.id);
                        return { ...p, q: itemExistente ? itemExistente.q : 0 };
                    })
                });
                setModalF(true);
            };

            // Handlers de Despachos (Cargas)
            const handleGuardarDespacho = async () => {
                if (!formC.ven) return setError("Seleccione un vendedor.");
                if (formC.items.every(i => Number(i.q) <= 0)) return setError("Ingrese cantidades.");
                if (!user) return;
                try {
                    const totalCargado = formC.items.reduce((a, b) => a + (Number(b.q) * Number(b.pvd)), 0);
                    await db.collection(`/artifacts/${appId}/public/data/despachos`).add({
                        responsable: formC.ven,
                        fecha: today,
                        items: formC.items.filter(i => Number(i.q) > 0).map(i => ({ id: i.id, nombre: i.nombre, q: Number(i.q), costo: i.costo, pvd: i.pvd })),
                        totalCargado,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    setModalC(false);
                    setFormC({ ven: '', items: PRODUCTOS.map(p => ({...p, q: 0})) });
                    setError(null);
                } catch (e) { setError("No se pudo guardar el despacho."); }
            };

            const handleDelete = async (col, id) => {
                if (!user) return;
                try {
                    await db.collection(`/artifacts/${appId}/public/data/${col}`).doc(id).delete();
                } catch (e) { setError("No se pudo eliminar el registro."); }
            };

            if (loading) return (
                <div className="h-screen flex flex-col items-center justify-center bg-white space-y-6">
                    <div className="w-14 h-14 border-4 border-orange-600 border-t-transparent rounded-full animate-spin"></div>
                    <p className="font-extrabold text-orange-600 uppercase tracking-widest text-[10px] animate-pulse">Sincronizando Austro Control...</p>
                </div>
            );

            return (
                <div className="min-h-screen md:pl-72 flex flex-col md:flex-row bg-slate-50">
                    {/* INDICADOR ONLINE */}
                    <div className="fixed top-5 right-5 z-[60] pointer-events-auto">
                        <div className={`px-4 py-2 rounded-full flex items-center gap-2 font-black uppercase text-[10px] italic shadow-2xl transition-all border ${user ? 'bg-white text-green-600 border-green-100' : 'bg-red-50 text-red-600 border-red-100'}`}>
                            <div className={`w-2 h-2 rounded-full ${user ? 'bg-green-500 pulse-green' : 'bg-red-500 animate-pulse'}`}></div>
                            <span className="hidden sm:inline">{user ? 'En Línea' : 'Desconectado'}</span>
                            <Icon name="wifi" size={14} />
                        </div>
                    </div>

                    {/* SIDEBAR (ESCRITORIO) */}
                    <aside className="hidden md:flex fixed left-0 top-0 bottom-0 w-72 bg-white border-r border-slate-100 flex-col p-8 z-30">
                        <div className="flex items-center gap-4 mb-12">
                            <div className="bg-orange-600 p-2.5 rounded-2xl text-white shadow-xl rotate-3"><Icon name="package" size={24}/></div>
                            <span className="font-black text-2xl tracking-tighter text-orange-600 uppercase italic">AustroPro</span>
                        </div>
                        <nav className="space-y-2 flex-1">
                            {[
                                { id: 'dashboard', icon: 'chart', label: 'Gerencia' },
                                { id: 'facturacion', icon: 'scan', label: 'Facturación' },
                                { id: 'logistica', icon: 'truck', label: 'Logística' },
                                { id: 'inventario', icon: 'box', label: 'Inventario' }
                            ].map(item => (
                                <button key={item.id} onClick={() => setActiveTab(item.id)} className={`w-full flex items-center gap-4 p-5 rounded-[1.5rem] transition-all font-black uppercase text-[11px] tracking-widest italic ${activeTab === item.id ? 'sidebar-active' : 'text-slate-400 hover:bg-slate-50'}`}>
                                    <Icon name={item.icon} size={20}/>
                                    <span>{item.label}</span>
                                </button>
                            ))}
                        </nav>
                        <div className="mt-auto p-4 bg-slate-900 rounded-[2rem] text-white text-center shadow-xl">
                            <p className="text-[8px] font-black uppercase opacity-40 mb-1 italic">V. 1.0 PRO</p>
                            <p className="text-[10px] font-bold text-orange-400 truncate tracking-tighter">RUTA: {appId}</p>
                        </div>
                    </aside>

                    {/* NAVEGACIÓN INFERIOR (MÓVIL) */}
                    <nav className="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-slate-100 flex justify-around items-center p-4 z-[50] shadow-[0_-15px_40px_rgba(0,0,0,0.08)]">
                         {[
                            { id: 'dashboard', icon: 'chart', label: 'Inicio' },
                            { id: 'facturacion', icon: 'scan', label: 'Facturas' },
                            { id: 'logistica', icon: 'truck', label: 'Cargas' },
                            { id: 'inventario', icon: 'box', label: 'Bodega' }
                         ].map(item => (
                            <button key={item.id} onClick={() => setActiveTab(item.id)} className={`flex flex-col items-center gap-1 transition-all duration-300 ${activeTab === item.id ? 'mobile-nav-active scale-110' : 'text-slate-300'}`}>
                                <Icon name={item.icon} size={24} />
                                <span className="text-[8px] font-black uppercase tracking-tight">{item.label}</span>
                            </button>
                         ))}
                    </nav>

                    {/* CONTENIDO PRINCIPAL */}
                    <main className="flex-1 p-5 md:p-12 max-w-7xl mx-auto w-full">
                        {error && (
                            <div className="mb-8 p-6 bg-red-50 text-red-700 border-2 border-red-200 rounded-[2rem] font-black text-xs uppercase italic flex justify-between items-center shadow-lg animate-bounce">
                                <span>{error}</span>
                                <button onClick={() => setError(null)}><Icon name="x" size={16}/></button>
                            </div>
                        )}

                        {activeTab === 'dashboard' && (
                            <div className="space-y-10 fade-in text-left">
                                <div className="border-b-4 border-slate-900 pb-4 inline-block">
                                    <h2 className="text-4xl font-black uppercase italic tracking-tighter text-slate-800">Gerencia</h2>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                    <Card className="bg-slate-900 text-white border-none">
                                        <p className="text-[10px] uppercase opacity-50 mb-3 tracking-widest font-black">Gastos Operativos</p>
                                        <p className="text-4xl font-black italic tracking-tighter">${TOTAL_FIJO.toLocaleString(undefined, {minimumFractionDigits: 2})}</p>
                                    </Card>
                                    <Card className="bg-orange-600 text-white border-none">
                                        <p className="text-[10px] uppercase opacity-60 mb-3 tracking-widest font-black">Utilidad de Ruta</p>
                                        <p className="text-4xl font-black italic tracking-tighter">${totalUtilidadRuta.toLocaleString(undefined, {minimumFractionDigits: 2})}</p>
                                    </Card>
                                    <Card className={`${totalUtilidadRuta >= TOTAL_FIJO ? 'bg-green-600' : 'bg-red-600'} text-white border-none`}>
                                        <p className="text-[10px] uppercase opacity-60 mb-3 tracking-widest font-black">Neto Austro</p>
                                        <p className="text-4xl font-black italic tracking-tighter">${(totalUtilidadRuta - TOTAL_FIJO).toLocaleString(undefined, {minimumFractionDigits: 2})}</p>
                                    </Card>
                                </div>
                                <Card className="p-8 border-none shadow-xl bg-white">
                                    <h3 className="font-black text-2xl uppercase tracking-tighter mb-8 border-b-2 border-slate-50 pb-2 italic text-slate-800">Desglose de Gastos</h3>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-x-12 gap-y-3">
                                        {GASTOS_FIJOS_LISTA.map((g, i) => (
                                            <div key={i} className="flex justify-between items-center text-[11px] font-bold italic border-b border-slate-50 pb-1.5 uppercase text-slate-500">
                                                <span>{g.det}</span>
                                                <span className="text-slate-900 font-black">${g.val.toFixed(2)}</span>
                                            </div>
                                        ))}
                                    </div>
                                </Card>
                            </div>
                        )}

                        {activeTab === 'facturacion' && (
                            <div className="space-y-6 fade-in text-left">
                                <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8">
                                    <h2 className="text-3xl font-black uppercase italic tracking-tighter">Entradas (Facturas)</h2>
                                    <button onClick={() => { setIsEditingF(null); setFormF({num: '', items: PRODUCTOS.map(p => ({...p, q: 0}))}); setModalF(true); }} className="bg-orange-600 text-white px-8 py-4 rounded-[1.5rem] shadow-2xl font-black uppercase text-[10px] hover:scale-105 active:scale-95 transition-all">Nueva Factura ✨</button>
                                </div>
                                <div className="grid grid-cols-1 gap-4">
                                    {facturas.length === 0 && <p className="text-center py-20 text-slate-400 font-bold uppercase tracking-widest text-xs italic">Cargando registros...</p>}
                                    {facturas.slice().sort((a,b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0)).map(f => (
                                        <Card key={f.id} className="flex flex-col md:flex-row justify-between items-start md:items-center border-l-[12px] border-orange-500 py-6 gap-6 transition-all hover:border-l-[20px]">
                                            <div className="flex-1">
                                                <h4 className="font-black text-slate-800 uppercase italic leading-none mb-1 text-lg">#{f.numFactura}</h4>
                                                <span className="text-[10px] text-slate-400 font-bold uppercase italic tracking-widest">{f.fecha}</span>
                                            </div>
                                            <div className="flex items-center justify-between w-full md:w-auto gap-8">
                                                <div className="text-right">
                                                    <p className="text-[9px] uppercase opacity-40 font-black italic mb-1">Monto Invertido</p>
                                                    <p className="text-3xl font-black tracking-tighter text-slate-800">${f.total?.toFixed(2)}</p>
                                                </div>
                                                <div className="flex gap-2">
                                                    <button onClick={() => handleEditFactura(f)} className="p-3 bg-slate-100 rounded-xl text-slate-400 hover:text-orange-600 hover:bg-orange-50 transition-all"><Icon name="edit" size={20}/></button>
                                                    <button onClick={() => handleDelete('facturas', f.id)} className="p-3 bg-red-50 rounded-xl text-red-200 hover:text-red-500 hover:bg-red-100 transition-all"><Icon name="trash" size={20}/></button>
                                                </div>
                                            </div>
                                        </Card>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'logistica' && (
                            <div className="space-y-6 fade-in text-left">
                                <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8">
                                    <h2 className="text-3xl font-black uppercase italic tracking-tighter">Salidas (Despachos)</h2>
                                    <button onClick={() => setModalC(true)} className="bg-slate-900 text-white px-8 py-4 rounded-[1.5rem] shadow-2xl font-black uppercase text-[10px] hover:scale-105 active:scale-95 transition-all">Cargar Ruta ✨</button>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                                    {despachos.slice().sort((a,b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0)).map(c => (
                                        <Card key={c.id} className="border-l-[12px] border-slate-900 flex justify-between items-center">
                                            <div className="text-left">
                                                <h4 className="font-black text-slate-800 uppercase text-lg italic tracking-tight">{c.responsable}</h4>
                                                <span className="text-[9px] font-black text-slate-400 uppercase italic tracking-widest">{c.fecha}</span>
                                            </div>
                                            <div className="flex items-center gap-4">
                                                <div className="text-right">
                                                    <p className="text-[8px] uppercase opacity-40 font-black italic">Total Carga</p>
                                                    <p className="text-2xl font-black tracking-tighter text-slate-800">${c.totalCargado?.toLocaleString(undefined, {minimumFractionDigits: 2})}</p>
                                                </div>
                                                <button onClick={() => handleDelete('despachos', c.id)} className="p-3 bg-red-50 rounded-xl text-red-200 hover:text-red-500"><Icon name="trash" size={18}/></button>
                                            </div>
                                        </Card>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'inventario' && (
                            <div className="space-y-6 fade-in text-left">
                                <div className="border-b-4 border-slate-900 pb-2 mb-10 inline-block">
                                    <h2 className="text-3xl font-black uppercase italic tracking-tighter">Stock en Bodega</h2>
                                </div>
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                                    {PRODUCTOS.map(p => {
                                        const totalIngresos = facturas.reduce((acc, f) => {
                                            const item = f.items?.find(it => it.id === p.id);
                                            return acc + (item ? Number(item.q) : 0);
                                        }, 0);
                                        const totalSalidas = despachos.reduce((acc, d) => {
                                            const item = d.items?.find(it => it.id === p.id);
                                            return acc + (item ? Number(item.q) : 0);
                                        }, 0);
                                        const stock = totalIngresos - totalSalidas;
                                        return (
                                            <Card key={p.id} className="relative overflow-hidden border-t-[10px] border-orange-500 flex flex-col items-center text-center">
                                                <p className="text-[10px] font-black text-slate-400 uppercase mb-5 leading-tight italic tracking-widest px-2">{p.nombre}</p>
                                                <p className={`text-7xl font-black tracking-tighter ${stock < 50 ? 'text-red-600' : 'text-slate-800'}`}>{stock}</p>
                                                <div className="mt-6 flex justify-around w-full border-t border-slate-50 pt-4">
                                                    <div className="text-center">
                                                        <p className="text-[7px] font-black text-slate-400 uppercase">Entradas</p>
                                                        <p className="text-xs font-black text-green-600">{totalIngresos}</p>
                                                    </div>
                                                    <div className="text-center">
                                                        <p className="text-[7px] font-black text-slate-400 uppercase">Salidas</p>
                                                        <p className="text-xs font-black text-red-500">{totalSalidas}</p>
                                                    </div>
                                                </div>
                                                <p className="text-[9px] font-extrabold text-slate-300 mt-2 uppercase tracking-widest italic">Existencia Actual</p>
                                            </Card>
                                        );
                                    })}
                                </div>
                            </div>
                        )}
                    </main>

                    {/* MODAL FACTURA */}
                    {modalF && (
                        <div className="fixed inset-0 bg-slate-900/95 z-[100] flex items-center justify-center p-4 backdrop-blur-md">
                            <div className="bg-white w-full max-w-4xl max-h-[90vh] rounded-[3rem] flex flex-col overflow-hidden shadow-2xl fade-in border-4 border-orange-500/20">
                                <div className="p-8 border-b flex justify-between items-center bg-slate-50">
                                    <h3 className="text-2xl font-black uppercase italic text-slate-800 tracking-tighter">
                                        {isEditingF ? 'Modificar Factura' : 'Ingreso a Bodega'}
                                    </h3>
                                    <button onClick={() => {setModalF(false); setIsEditingF(null);}} className="p-3 hover:bg-red-50 rounded-2xl text-slate-400 hover:text-red-500 transition-all"><Icon name="x" size={24}/></button>
                                </div>
                                <div className="flex-1 overflow-y-auto p-6 md:p-10 hide-scrollbar">
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-10 text-left">
                                        <div className="space-y-2">
                                            <label className="text-[10px] font-black uppercase text-slate-400 italic tracking-widest ml-1">Nº Documento / Referencia</label>
                                            <input className="w-full p-5 bg-slate-50 rounded-[1.5rem] font-black text-2xl outline-none border-2 border-transparent focus:border-orange-500 transition-all shadow-inner" placeholder="000-000-0000" value={formF.num} onChange={e => setFormF({...formF, num: e.target.value})} />
                                        </div>
                                        <div className="space-y-2">
                                            <label className="text-[10px] font-black uppercase text-slate-400 italic tracking-widest ml-1">Fecha de Registro</label>
                                            <div className="p-5 bg-slate-50 border-2 border-slate-100 rounded-[1.5rem] font-black text-2xl text-slate-400">{today}</div>
                                        </div>
                                    </div>
                                    <table className="w-full invoice-table text-left">
                                        <thead><tr><th>Producto Seleccionado</th><th className="text-center">Cant.</th><th className="text-right">Costo U.</th></tr></thead>
                                        <tbody>
                                            {formF.items.map((it, idx) => (
                                                <tr key={it.id}>
                                                    <td className="font-bold text-slate-700 text-xs py-5">{it.nombre}</td>
                                                    <td>
                                                        <input type="number" className="w-24 mx-auto block text-center p-3 rounded-2xl bg-orange-50 font-black text-orange-600 outline-none border-2 border-transparent focus:border-orange-500 transition-all" value={it.q || ''} placeholder="0" onChange={e => {
                                                            const n = [...formF.items]; n[idx].q = e.target.value; setFormF({...formF, items: n});
                                                        }} />
                                                    </td>
                                                    <td className="text-right font-mono text-slate-400 italic text-xs tracking-tighter">${it.costo.toFixed(4)}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                                <div className="p-10 bg-slate-900 text-white flex flex-col md:flex-row justify-between items-center gap-6">
                                    <div className="flex flex-col text-center md:text-left">
                                        <span className="text-[10px] font-black uppercase opacity-50 italic tracking-widest">Total Inversión (Aprox)</span>
                                        <span className="text-5xl font-black tracking-tighter italic text-orange-400">${totalF.toFixed(2)}</span>
                                    </div>
                                    <button onClick={handleGuardarFactura} className="w-full md:w-auto bg-orange-600 px-12 py-5 rounded-[2rem] font-black uppercase text-xs hover:scale-105 active:scale-95 shadow-[0_20px_50px_rgba(234,88,12,0.3)] transition-all">
                                        {isEditingF ? 'Sincronizar Cambios ✨' : 'Grabar en Nube ✨'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL DESPACHO */}
                    {modalC && (
                        <div className="fixed inset-0 bg-slate-900/90 z-[100] flex items-center justify-center p-4 backdrop-blur-md">
                            <Card className="max-w-xl w-full p-10 fade-in text-left border-4 border-slate-700/20">
                                <div className="flex justify-between items-center mb-8 border-b border-slate-50 pb-4">
                                    <h3 className="text-3xl font-black uppercase italic tracking-tighter text-slate-800 leading-none">Despacho de Ruta</h3>
                                    <button onClick={() => setModalC(false)} className="text-slate-300 hover:text-slate-800 transition-colors"><Icon name="x" size={28}/></button>
                                </div>
                                <div className="space-y-6">
                                    <div className="space-y-2">
                                        <label className="text-[10px] font-black uppercase text-slate-400 italic tracking-widest ml-1">Responsable de Carga</label>
                                        <select className="w-full p-5 bg-slate-50 rounded-[1.5rem] font-black uppercase text-sm border-2 border-transparent focus:border-orange-500 shadow-inner appearance-none transition-all" value={formC.ven} onChange={e => setFormC({...formC, ven: e.target.value})}>
                                            <option value="">Seleccione Vendedor...</option>
                                            {VENDEDORES.map(v => <option key={v} value={v}>{v}</option>)}
                                        </select>
                                    </div>
                                    <div className="space-y-3 max-h-[40vh] overflow-y-auto pr-2 hide-scrollbar">
                                        {formC.items.map((it, idx) => (
                                            <div key={it.id} className="flex justify-between items-center border-b border-slate-50 pb-4">
                                                <span className="text-[10px] font-black uppercase flex-1 italic text-slate-600 leading-tight pr-4">{it.nombre}</span>
                                                <input type="number" className="w-20 p-3 bg-orange-50 rounded-xl text-center font-black text-orange-600 border-none outline-none focus:bg-orange-100 transition-all" value={it.q || ''} placeholder="0" onChange={e => {
                                                    const n = [...formC.items]; n[idx].q = e.target.value; setFormC({...formC, items: n});
                                                }} />
                                            </div>
                                        ))}
                                    </div>
                                    <div className="flex justify-end gap-5 pt-8">
                                        <button onClick={() => setModalC(false)} className="px-6 py-4 font-black text-[10px] uppercase text-slate-400 hover:text-slate-800 transition-all italic">Cancelar</button>
                                        <button onClick={handleGuardarDespacho} className="bg-slate-900 text-white px-10 py-5 rounded-[2rem] font-black uppercase text-xs shadow-2xl hover:scale-105 active:scale-95 transition-all">Confirmar Salida ✨</button>
                                    </div>
                                </div>
                            </Card>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
