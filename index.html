<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AustroControl Pro - Gestión Total ✨</title>
    <!-- Bibliotecas de Alto Rendimiento -->
    <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Firebase SDK (Compatibilidad) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #1e293b; overflow-x: hidden; }
        
        .sidebar-active {
            background-color: #ea580c;
            color: white;
            box-shadow: 0 15px 25px -5px rgba(234, 88, 12, 0.4);
            transform: translateY(-2px);
        }

        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .hide-scrollbar::-webkit-scrollbar { width: 0; background: transparent; }
        
        .card-shadow { box-shadow: 0 4px 20px -2px rgba(0,0,0,0.05); }

        input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- 1. CONFIGURACIÓN DEL NEGOCIO ---
        const today = new Date().toISOString().split('T')[0];
        const PRODUCTOS = [
            { id: 'p1', nombre: 'AVENA POLACA 165G', costo: 0.269565, pvd: 0.3478 },
            { id: 'p2', nombre: 'AVENA POLACA 340G', costo: 0.608694, pvd: 0.6956 },
            { id: 'p3', nombre: 'AVENA POLACA 500G', costo: 0.777042, pvd: 0.8869 },
            { id: 'p4', nombre: 'AVENA POLACA 1000G', costo: 1.597390, pvd: 1.8260 },
        ];

        const TOTAL_GASTO_MENSUAL = 3579.80;
        const VENDEDORES = ["Diego Xavier Siavichay", "Byron Armando Miranda Capa"];

        // --- 2. FIREBASE CONFIG (INTEGRADA) ---
        const firebaseConfig = {
            apiKey: "AIzaSyBu0b-O86orBd_fQut3i9n5s0W9fLpkRFI",
            authDomain: "austrodistribuidoraecuatoriana.firebaseapp.com",
            projectId: "austrodistribuidoraecuatoriana",
            storageBucket: "austrodistribuidoraecuatoriana.firebasestorage.app",
            messagingSenderId: "711061794814",
            appId: "1:711061794814:web:65b028a387ecf277ca5aaf"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const appId = "austro-dist-ecu";

        // --- 3. COMPONENTES UI ---
        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [name]);
            return <i data-lucide={name} className={className} style={{ width: size, height: size }}></i>;
        };

        // --- 4. APP PRINCIPAL ---
        function App() {
            const [user, setUser] = useState(null);
            const [activeTab, setActiveTab] = useState('dashboard');
            const [loading, setLoading] = useState(true);
            const [facturas, setFacturas] = useState([]);
            const [cargas, setCargas] = useState([]);
            
            // Estados Modales
            const [modalF, setModalF] = useState(false);
            const [modalC, setModalC] = useState(false);
            const [isSaving, setIsSaving] = useState(false);
            const [error, setError] = useState(null);

            // Formularios
            const [formF, setFormF] = useState({ num: '', items: PRODUCTOS.map(p => ({...p, q: 0})) });
            const [formC, setFormC] = useState({ ven: '', items: PRODUCTOS.map(p => ({...p, q: 0})) });

            // Autenticación Silenciosa
            useEffect(() => {
                const init = async () => {
                    try {
                        await auth.signInAnonymously();
                    } catch (e) { console.error("Auth:", e); }
                };
                init();
                return auth.onAuthStateChanged(u => { setUser(u); setLoading(false); });
            }, []);

            // Sincronización Firestore
            useEffect(() => {
                if (!user) return;
                const path = db.collection('artifacts').doc(appId).collection('public').doc('data');
                
                const unsubF = path.collection('facturas').onSnapshot(s => 
                    setFacturas(s.docs.map(d => ({id: d.id, ...d.data()})))
                );
                const unsubC = path.collection('cargas').onSnapshot(s => 
                    setCargas(s.docs.map(d => ({id: d.id, ...d.data()})))
                );

                return () => { unsubF(); unsubC(); };
            }, [user]);

            // Cálculos
            const utilidadRutaTotal = useMemo(() => {
                return cargas.reduce((acc, c) => acc + (c.items || []).reduce((s, i) => s + (i.q * (i.pvd - i.costo)), 0), 0);
            }, [cargas]);

            const stockActual = useMemo(() => {
                return PRODUCTOS.map(p => {
                    const ing = facturas.reduce((acc, f) => acc + (f.items?.find(it => it.id === p.id)?.q || 0), 0);
                    const sal = cargas.reduce((acc, c) => acc + (c.items?.find(it => it.pId === p.id)?.q || 0), 0);
                    return { ...p, stock: ing - sal };
                });
            }, [facturas, cargas]);

            // Guardado
            const saveFactura = async () => {
                if (!formF.num) return setError("Falta número de factura");
                setIsSaving(true);
                try {
                    await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('facturas').add({
                        numFactura: formF.num,
                        fecha: today,
                        items: formF.items,
                        total: formF.items.reduce((a,b) => a + (b.q * b.costo), 0) * 1.15,
                        createdAt: new Date().toISOString()
                    });
                    setModalF(false);
                    setFormF({ num: '', items: PRODUCTOS.map(p => ({...p, q: 0})) });
                } catch (e) { setError("Error al guardar"); }
                finally { setIsSaving(false); }
            };

            if (loading) return (
                <div className="h-screen flex flex-col items-center justify-center bg-white">
                    <div className="w-12 h-12 border-4 border-orange-600 border-t-transparent rounded-full animate-spin"></div>
                    <p className="mt-4 font-black text-orange-600 uppercase text-[10px] tracking-widest italic">Iniciando Sistema...</p>
                </div>
            );

            return (
                <div className="min-h-screen md:pl-72 flex bg-slate-50">
                    {/* SIDEBAR */}
                    <aside className="hidden md:flex fixed left-0 top-0 bottom-0 w-72 bg-white border-r border-slate-100 flex-col p-8 z-30">
                        <div className="flex items-center gap-3 mb-12">
                            <div className="bg-orange-600 p-2.5 rounded-2xl text-white shadow-lg"><Icon name="pie-chart" size={24}/></div>
                            <span className="font-black text-2xl tracking-tighter text-slate-800 italic uppercase">Austro<span className="text-orange-600">Pro</span></span>
                        </div>

                        <nav className="space-y-2 flex-1">
                            {[
                                { id: 'dashboard', icon: 'trending-up', label: 'Gerencia' },
                                { id: 'logistica', icon: 'truck', label: 'Despachos' },
                                { id: 'inventario', icon: 'box', label: 'Inventario' }
                            ].map(item => (
                                <button key={item.id} onClick={() => setActiveTab(item.id)} className={`w-full flex items-center gap-4 p-5 rounded-2xl transition-all font-black uppercase text-[11px] tracking-widest italic ${activeTab === item.id ? 'sidebar-active' : 'text-slate-400 hover:bg-slate-50'}`}>
                                    <Icon name={item.icon} size={18}/>
                                    <span>{item.label}</span>
                                </button>
                            ))}
                        </nav>
                        
                        <div className="mt-auto p-4 bg-slate-900 rounded-[2rem] text-white">
                            <p className="text-[8px] font-black uppercase opacity-40 mb-1 italic">Conexión Segura:</p>
                            <p className="text-[10px] font-bold text-orange-400 truncate tracking-tight">{firebaseConfig.projectId}</p>
                        </div>
                    </aside>

                    {/* MAIN */}
                    <main className="p-6 md:p-12 w-full max-w-7xl mx-auto">
                        {activeTab === 'dashboard' && (
                            <div className="space-y-10 fade-in">
                                <header className="border-b-4 border-slate-900 pb-6">
                                    <h2 className="text-4xl font-black uppercase italic tracking-tighter text-slate-800 leading-none">Visión de Negocio</h2>
                                    <p className="text-slate-400 text-[10px] font-bold uppercase tracking-[0.4em] mt-2">Distribución AustroEcuatoriana v1.0</p>
                                </header>

                                <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                                    <div className="bg-slate-900 p-8 rounded-[2.5rem] text-white card-shadow">
                                        <p className="text-[10px] uppercase opacity-40 mb-4 tracking-widest font-black italic">Gastos Fijos</p>
                                        <p className="text-5xl font-black italic tracking-tighter">${TOTAL_GASTO_MENSUAL.toLocaleString()}</p>
                                    </div>
                                    <div className="bg-orange-600 p-8 rounded-[2.5rem] text-white card-shadow">
                                        <p className="text-[10px] uppercase opacity-60 mb-4 tracking-widest font-black italic">Utilidad Ruta</p>
                                        <p className="text-5xl font-black italic tracking-tighter">${utilidadRutaTotal.toLocaleString(undefined, {minimumFractionDigits: 2})}</p>
                                    </div>
                                    <div className={`${utilidadRutaTotal >= TOTAL_GASTO_MENSUAL ? 'bg-emerald-600' : 'bg-rose-600'} p-8 rounded-[2.5rem] text-white card-shadow`}>
                                        <p className="text-[10px] uppercase opacity-60 mb-4 tracking-widest font-black italic">Balance Neto</p>
                                        <p className="text-5xl font-black italic tracking-tighter">${(utilidadRutaTotal - TOTAL_GASTO_MENSUAL).toLocaleString(undefined, {minimumFractionDigits: 2})}</p>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                                    <section className="bg-white p-10 rounded-[2.5rem] border border-slate-100 card-shadow">
                                        <h3 className="font-black text-xl uppercase tracking-tighter mb-8 border-b-2 border-slate-50 pb-4 italic">Productos en Bodega</h3>
                                        <div className="space-y-6">
                                            {stockActual.map(p => (
                                                <div key={p.id} className="flex justify-between items-center">
                                                    <div>
                                                        <p className="font-black text-[11px] text-slate-800 uppercase italic tracking-tight">{p.nombre}</p>
                                                        <p className="text-[9px] text-slate-400 font-bold uppercase">Unidades</p>
                                                    </div>
                                                    <span className={`text-2xl font-black italic ${p.stock < 50 ? 'text-rose-500' : 'text-slate-800'}`}>{p.stock}</span>
                                                </div>
                                            ))}
                                        </div>
                                    </section>
                                    
                                    <section className="bg-white p-10 rounded-[2.5rem] border border-slate-100 card-shadow flex flex-col items-center justify-center text-center space-y-6">
                                        <div className="w-20 h-20 bg-orange-50 text-orange-600 rounded-full flex items-center justify-center"><Icon name="file-plus" size={32}/></div>
                                        <div>
                                            <h4 className="font-black text-lg uppercase italic text-slate-800">Cargar Inventario</h4>
                                            <p className="text-xs text-slate-400 font-medium">Ingresa las facturas de Lácteos La Polaca para actualizar stock.</p>
                                        </div>
                                        <button onClick={() => setModalF(true)} className="bg-slate-900 text-white px-10 py-4 rounded-2xl font-black uppercase text-[10px] tracking-widest italic hover:bg-orange-600 transition-colors">Nueva Entrada</button>
                                    </section>
                                </div>
                            </div>
                        )}

                        {activeTab === 'inventario' && (
                            <div className="space-y-6 fade-in text-center py-20">
                                <Icon name="package" size={60} className="mx-auto text-slate-200 mb-6"/>
                                <h3 className="text-2xl font-black uppercase italic text-slate-800">Control de Almacén</h3>
                                <p className="text-slate-400 max-w-sm mx-auto">Próximamente: Historial detallado de entradas y salidas por producto.</p>
                            </div>
                        )}
                    </main>

                    {/* MODAL ENTRADA STOCK */}
                    {modalF && (
                        <div className="fixed inset-0 bg-slate-900/90 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
                            <div className="bg-white w-full max-w-3xl rounded-[3rem] overflow-hidden shadow-2xl animate-in zoom-in-95 duration-200">
                                <div className="p-10 border-b flex justify-between items-center bg-slate-50">
                                    <h3 className="font-black text-2xl uppercase italic tracking-tighter">Nueva Entrada Stock</h3>
                                    <button onClick={() => setModalF(false)} className="p-3 hover:bg-white rounded-full transition-colors"><Icon name="x"/></button>
                                </div>
                                <div className="p-10 space-y-8 max-h-[60vh] overflow-y-auto hide-scrollbar">
                                    <div>
                                        <label className="text-[10px] font-black uppercase text-slate-400 mb-2 block tracking-widest italic">Nº Factura de Proveedor</label>
                                        <input className="w-full p-6 bg-slate-50 rounded-2xl font-black text-xl outline-none focus:ring-4 ring-orange-500/10 border-2 border-transparent focus:border-orange-500 transition-all" placeholder="000-000-000" value={formF.num} onChange={e => setFormF({...formF, num: e.target.value})} />
                                    </div>
                                    <div className="space-y-4">
                                        <p className="text-[10px] font-black uppercase text-slate-400 tracking-widest italic">Cantidades Recibidas</p>
                                        {formF.items.map((it, idx) => (
                                            <div key={it.id} className="flex items-center justify-between p-4 bg-slate-50 rounded-2xl border border-slate-100">
                                                <span className="font-black text-[11px] uppercase italic text-slate-600">{it.nombre}</span>
                                                <input type="number" className="w-24 p-3 bg-white rounded-xl text-center font-black text-orange-600 outline-none border-2 border-transparent focus:border-orange-500" value={it.q || ''} onChange={e => {
                                                    const ni = [...formF.items]; ni[idx].q = parseInt(e.target.value) || 0;
                                                    setFormF({...formF, items: ni});
                                                }} />
                                            </div>
                                        ))}
                                    </div>
                                </div>
                                <div className="p-10 flex gap-4">
                                    <button onClick={() => setModalF(false)} className="flex-1 py-5 font-black uppercase text-xs text-slate-400 italic">Cancelar</button>
                                    <button onClick={saveFactura} disabled={isSaving} className="flex-[2] bg-orange-600 text-white py-5 rounded-[1.5rem] font-black uppercase text-xs tracking-widest italic shadow-xl shadow-orange-500/20 hover:scale-[1.02] transition-all active:scale-95 disabled:opacity-50 flex items-center justify-center gap-3">
                                        {isSaving && <div className="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>}
                                        Grabar Ingreso
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
